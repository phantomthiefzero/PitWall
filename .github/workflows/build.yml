name: Build iRacing Suite

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Tests (PitWall pipeline and the suite app)
        shell: pwsh
        run: |
          python -m pytest tests -q -rfE --tb=short 2>&1 | Tee-Object -FilePath pytest.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Failing test names as annotations, readable without the full log.
            Select-String -Path pytest.txt -Pattern '^(FAILED|ERROR) ' | ForEach-Object { "::error::" + $_.Line }
            Select-String -Path pytest.txt -Pattern '^E  ' | Select-Object -First 15 | ForEach-Object { "::error::" + $_.Line }
          }
          exit $code

      - name: Stamp the build number into the app (the updater compares it)
        shell: pwsh
        run: |
          "BUILD = $env:GITHUB_RUN_NUMBER`nCOMMIT = `"$env:GITHUB_SHA`"" | Out-File -Encoding utf8 suite/_build.py
          Get-Content suite/_build.py

      - name: Build the app
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "iRacing Suite"
          --icon assets/icon.ico
          --add-data "suite/web;suite/web"
          --add-data "client;client"
          --add-data "broadcast;broadcast"
          --collect-submodules pitwall
          --hidden-import relay.server
          --hidden-import suite.cameras
          --hidden-import suite.share
          --hidden-import suite.updater
          --hidden-import suite._build
          --hidden-import segno
          --hidden-import websockets.sync.client
          run_suite.py

      - name: Check the build
        shell: pwsh
        run: |
          $exe = "dist/iRacing Suite.exe"
          if (!(Test-Path $exe)) { throw "Build output missing" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - name: Check the running app can swap itself (how an update installs)
        shell: pwsh
        run: |
          $out = Join-Path $PWD "rename.txt"
          $p = Start-Process -FilePath "dist/iRacing Suite.exe" -ArgumentList "--selftest-rename", "`"$out`"" -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw "The self-test did not finish" }
          if (!(Test-Path $out)) { throw "The self-test wrote nothing" }
          $r = Get-Content $out -Raw
          "Rename while running: $r"
          if ($r.Trim() -ne "ok") { throw "The app could not rename itself while running: $r" }
          if (!(Test-Path "dist/iRacing Suite.exe")) { throw "The app is missing after the self-test" }

      - uses: actions/upload-artifact@v4
        with:
          name: iRacing-Suite
          path: dist/iRacing Suite.exe

      - name: Publish a release (pushes to master only)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: iRacing Suite build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Download **iRacing Suite.exe** below and double-click it.
            First run: if Windows says "Windows protected your PC", click More info, then Run anyway (the app is not code-signed).
          files: dist/iRacing Suite.exe
