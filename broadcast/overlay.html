<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broadcast Overlay</title>
<!--
  PitWall broadcast overlay. OBS Browser Source, 1920 x 1080, above the iRacing capture:

      http://<relay>/broadcast/overlay.html?token=<view token>
      file:///.../broadcast/overlay.html?relay=ws://127.0.0.1:8765&token=<view token>

  &only=<graphic> shows just one graphic (tower, banner, battle, card, map, ticker,
  board, grid, replay, stinger) so each can be its own OBS source.

  Everything shown and how it looks (colours, fonts, logos, text, position and
  size of every graphic, the transition stinger) is set from the producer panel
  and arrives as the relay's shared "gfx" state. Numbers come from iRacing
  through pitwall/normalize.py; computed ones (live gaps, predicted incidents)
  are computed there too, never here. On air they are not marked -- the
  producer panel marks them for the people running the show.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#111317; --ink2:#16191f; --head:#000; --headText:#fff; --text:#fff; --muted:#9aa3ae;
  --accent:#ffcc00; --accentText:#000; --line:rgba(255,255,255,.07); --fl:#a766ff;
  --gain:#2fd27a; --lose:#ff4d4d;
  --flag-green:#22c55e; --flag-yellow:#ffd23f; --flag-red:#e5383b; --flag-white:#f4f4f4; --flag-blue:#3a86ff;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Segoe UI",sans-serif;
  --caps:uppercase; --r:0px; --rowH:34px;
}
html,body{margin:0;background:transparent;overflow:hidden}
body{font-family:var(--body);color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.layer{position:absolute;opacity:0;pointer-events:none;transition:opacity .35s ease}
.layer.on{opacity:1}
.layer{transition:opacity .35s ease,translate .45s cubic-bezier(.2,.8,.2,1)}
.layer.on.roomoff{opacity:0}   /* no room on screen beside the graphics already up (makeRoom) */
/* Arrange mode (&edit=1, the producer's "Arrange graphics"): every graphic on screen can be dragged, and resized
   by its corner or the mouse wheel; double-click puts it back. */
body.edit .layer.on:not(#stinger):not(#scene){pointer-events:auto;cursor:move}
body.edit .layer.on:not(#stinger):not(#scene) .inner,body.edit #strip.on .so{outline:2px dashed rgba(255,214,0,.85);outline-offset:3px}
body.edit .layer.drag .inner{outline-color:#3fd47a}
body.edit .layer.on:not(#stinger):not(#scene):not(:has(.inner)):not(#strip){outline:2px dashed rgba(255,214,0,.85);outline-offset:3px}
.ed-tag{position:absolute;z-index:5;transform:translateY(-100%);background:rgba(255,214,0,.95);color:#000;font:700 14px/1 sans-serif;padding:4px 7px;pointer-events:none;white-space:nowrap}
.ed-h{position:absolute;z-index:5;width:22px;height:22px;background:#ffd600;border:2px solid #000;cursor:nwse-resize}
.inner{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.hide{display:none!important}
.tab{font-variant-numeric:tabular-nums}
.plate{display:inline-grid;place-items:center;min-width:38px;height:24px;padding:0 4px;font:700 17px/1 var(--display);border-radius:var(--r);box-sizing:border-box}
.logo{max-height:30px;max-width:130px;object-fit:contain;display:block}

/* ---------- tower ---------- */
#tower{left:36px;top:36px;width:380px}
.tw-head{background:var(--head);color:var(--headText);display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r) var(--r) 0 0}
.tw-head .ttl{font:700 22px/1 var(--display);text-transform:var(--caps);letter-spacing:.02em}
.tw-head .st{margin-left:auto;font:700 22px/1 var(--display);text-transform:var(--caps);font-variant-numeric:tabular-nums}
.tw-head .md{font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--headText) 68%,var(--head));border:1px solid currentColor;border-radius:var(--r);padding:3px 5px 2px}
.row.cut{box-shadow:inset 0 -3px 0 var(--flag-red,#e33)}
.tc{display:inline-block;min-width:20px;text-align:center;font:800 13px/1 var(--display);padding:3px 4px 2px;border-radius:50%;color:#0b0d12;background:#ccc;margin-right:5px}
.tc.S{background:#ff4d4d}.tc.M{background:#ffd23f}.tc.H{background:#f2f2f2}.tc.W{background:#3c8dff;color:#fff}.tc.I{background:#3fd47a}
.tw-head .st small{font-weight:600;color:color-mix(in srgb,var(--headText) 68%,var(--head));font-size:16px;margin-right:4px}
.tw-flag{height:5px;background:var(--muted)}
.tw-body{position:relative;background:var(--ink)}
.row{position:absolute;left:0;right:0;height:var(--rowH);display:flex;align-items:center;gap:8px;padding-right:10px;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),background .3s;box-sizing:border-box;border-top:1px solid var(--line)}
.row.alt{background:var(--ink2)}
.row .pos{width:34px;text-align:center;font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
.row .nm{flex:1;min-width:0;font:600 20px/1 var(--display);text-transform:var(--caps);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--muted);font-weight:500;margin-right:3px}
.row .val{min-width:74px;text-align:right;font:600 18px/1 var(--display);font-variant-numeric:tabular-nums}
.row .tag{font:700 12px/1 var(--body);padding:3px 5px 2px;background:var(--muted);color:var(--ink);border-radius:var(--r)}
.row .fl{width:8px;height:8px;border-radius:50%;background:var(--fl);flex:none}
.row .mv{width:10px;font:700 10px/1 var(--body);text-align:center;flex:none}
.row .mv.up{color:var(--gain)} .row .mv.dn{color:var(--lose)}
.row.cam{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 35%,transparent),transparent 75%)}
.row.cam .pos{background:var(--accent);color:var(--accentText);align-self:stretch;display:grid;place-items:center}
.row.sec{background:transparent;border:0;gap:8px;padding-left:10px}
.row.sec .cls{font:800 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px 3px;border-radius:var(--r)}
.row.sec .rule{flex:1;height:2px;opacity:.6}
.row.sep{border:0}
.row.sep{background:var(--ink)}
.row.sep::after{content:"";margin:0 auto;width:36px;height:2px;border-radius:1px;background:var(--muted);opacity:.5}
.tw-foot{height:6px;background:var(--head);border-radius:0 0 var(--r) var(--r)}

/* ---------- status banner ---------- */
#banner{right:36px;top:36px}
.bn{display:flex;align-items:stretch;height:56px;border-radius:var(--r);overflow:hidden}
.bn .flag{width:12px;background:var(--muted)}
.bn .main{background:var(--head);color:var(--headText);padding:0 18px;display:flex;flex-direction:column;justify-content:center;min-width:170px}
.bn .main b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums;text-transform:var(--caps)}
.bn .main span{font:600 14px/1.2 var(--body);color:color-mix(in srgb,var(--headText) 68%,var(--head));text-transform:var(--caps);letter-spacing:.04em}
.bn .trk{background:var(--ink);padding:0 16px;display:flex;flex-direction:column;justify-content:center}
.bn .trk b{font:700 20px/1 var(--display);text-transform:var(--caps)}
.bn .trk span{font:500 14px/1.2 var(--body);color:var(--muted)}
.bn .lg{background:var(--ink);display:grid;place-items:center;padding:0 12px}

/* ---------- replay bug ---------- */
#replay{right:36px;top:104px}
.rp{display:flex;align-items:stretch;border-radius:var(--r);overflow:hidden;animation:rpIn .4s ease both}
.rp b{background:var(--lose);color:#fff;font:800 22px/1 var(--display);letter-spacing:.08em;padding:9px 14px 8px;text-transform:uppercase}
.rp span{background:var(--head);color:var(--headText);font:600 16px/1 var(--body);padding:11px 14px 8px;text-transform:var(--caps)}
@keyframes rpIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ---------- battle ---------- */
#battle{left:50%;top:36px;width:760px;margin-left:-380px}
.bt{border-radius:var(--r);overflow:hidden}
.bt-head{background:var(--accent);color:var(--accentText);font:800 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 14px 6px;display:flex}
.bt-head span:last-child{margin-left:auto;font-weight:600}
.bt-cars{display:flex;align-items:stretch;background:var(--ink)}
.bt-car{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;min-width:0}
.bt-car .pos{font:800 26px/1 var(--display)}
.bt-car .nm{flex:1;min-width:0;font:700 24px/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-car .lv{width:96px;height:44px;flex:none;border-radius:var(--r);overflow:hidden;background:var(--ink2)}
.bt-gap{background:var(--head);color:var(--headText);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;min-width:90px}
.bt-gap b{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.bt-gap span{font:600 12px/1 var(--body);color:color-mix(in srgb,var(--headText) 68%,var(--head));text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.bt-foot{background:var(--ink2);color:var(--muted);font:600 15px/1 var(--body);padding:7px 14px}
.bt-foot .g{color:var(--gain)} .bt-foot .l{color:var(--lose)}

/* ---------- where they're faster ---------- */
#faster{right:36px;top:164px;width:860px}
.fs{display:flex;background:var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.fs-map{width:400px;height:400px;flex:none;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.06),transparent 70%),var(--ink2)}
.fs-r{flex:1;display:flex;flex-direction:column;min-width:0}
.fs-h{background:var(--accent);color:var(--accentText);font:800 20px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:9px 16px 8px}
.fs-car{display:flex;align-items:center;gap:12px;padding:10px 16px 0}
.fs-car .sw{width:10px;align-self:stretch;border-radius:3px;flex:none}
.fs-car .nm{flex:1;min-width:0;font:700 30px/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-car .tm{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.fs-big{padding:10px 16px 2px;font:800 48px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.fs-big small{display:block;font:600 16px/1.2 var(--body);color:var(--muted);letter-spacing:.02em;margin-top:6px}
.fs-bars{display:flex;gap:3px;height:72px;margin:8px 16px 4px;position:relative}
.fs-bars:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.fs-bars i{flex:1;border-radius:2px;transform:scaleY(0);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#faster.on .fs-bars i{transform:scaleY(1)}
.fs-foot{margin-top:auto;padding:6px 16px 12px;font:600 15px/1.3 var(--body);color:var(--muted)}
.fs-foot b{color:var(--text)}

/* ---------- driver card ---------- */
#card{left:460px;bottom:54px;width:900px}
.cd{display:flex;align-items:stretch;border-radius:var(--r);overflow:hidden;height:130px}
.cd .lv{width:220px;flex:none;background:var(--ink2);position:relative;overflow:hidden}
.cd .num{width:96px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd .num b{font:800 54px/.9 var(--display)}
.cd .num span{font:700 14px/1 var(--body);margin-top:6px;opacity:.85}
.cd .main{flex:1;background:var(--ink);min-width:0;display:flex;flex-direction:column}
.cd .top{display:flex;align-items:baseline;gap:12px;padding:12px 16px 4px}
.cd .name{font:700 38px/.95 var(--display);text-transform:var(--caps);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .name small{font-weight:500;color:var(--muted)}
.cd .lic{margin-left:auto;display:flex;gap:6px;flex:none}
.cd .lic span{font:700 13px/1 var(--body);padding:4px 7px 3px;border-radius:var(--r)}
.cd .sub{padding:0 16px 8px;color:var(--muted);font:600 15px/1.2 var(--body);display:flex;align-items:center;gap:12px;min-width:0;height:18px;box-sizing:content-box}
.cd .sub #cdSub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .stats{margin-top:auto;display:flex;background:var(--ink2)}
.cd .stats div{flex:1 1 auto;padding:6px 14px 7px;border-right:1px solid var(--line);white-space:nowrap}
.cd .stats div:last-child{border-right:0}
.cd .stats span{display:block;color:var(--muted);font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em}
.cd .stats b{display:block;font:700 21px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:3px}
/* sector colours (normalize.py Deriver.sector_marks): purple the class's quickest, green the car's own best, yellow neither */
:root{--sx-p:#a24dff;--sx-g:#22c55e;--sx-y:#f5c518}
.sxs{display:flex;gap:3px;justify-content:flex-end;align-items:center;height:100%}
.sxs i{display:block;width:16px;height:12px;border-radius:2px;background:var(--line);opacity:.5}
.sxs i.p{background:var(--sx-p);opacity:1}.sxs i.g{background:var(--sx-g);opacity:1}.sxs i.y{background:var(--sx-y);opacity:1}
.sxs i.old{opacity:.4;filter:saturate(.5)}.sxs i.run{outline:2px solid var(--text);outline-offset:-2px;background:transparent;opacity:.7}
.cd .secs{display:flex;gap:4px;flex:none;align-items:center}
.cd .secs small{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.cd .secs em{font:700 13px/1 var(--display);font-style:normal;font-variant-numeric:tabular-nums;padding:1px 5px 0;border-radius:2px;color:#0b0d12;background:var(--line)}
.cd .secs em.p{background:var(--sx-p);color:#fff}.cd .secs em.g{background:var(--sx-g)}.cd .secs em.y{background:var(--sx-y)}

/* ---------- traffic warning: a class leader about to reach a slower class ---------- */
#traffic{left:36px;bottom:54px;width:410px}
.tr{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.tr-h{display:flex;align-items:center;gap:10px;background:var(--head);color:var(--headText);font:800 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:8px 14px 7px}
.tr-h .ic{width:10px;height:10px;border-radius:50%;background:#f5c518;box-shadow:0 0 10px #f5c518}
.tr-r{display:flex;align-items:center;gap:8px;background:var(--ink);padding:9px 12px}
.tr-r+.tr-r{border-top:1px solid var(--line)}
.tr-r .nm{flex:1;min-width:0;font:700 19px/1.1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-r .cl,.fla .cl{font:800 13px/1 var(--display);padding:4px 7px 3px;border-radius:var(--r);letter-spacing:.04em;text-transform:uppercase;flex:none}
.tr-r .in{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums;flex:none}
.tr-r .in small{font:600 13px/1 var(--body);color:var(--muted);margin-left:4px}
.tr-r .to{color:var(--muted);font:600 15px/1.2 var(--body);flex:none}

/* ---------- fastest-lap alert ---------- */
#fastlap{right:36px;bottom:250px;width:480px}
.fla{display:flex;align-items:stretch;border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:flaIn .45s cubic-bezier(.15,.9,.25,1) both}
.fla .bar{width:10px;background:var(--fl);flex:none}
.fla .m{flex:1;background:var(--ink);padding:10px 14px;min-width:0}
.fla .h{display:flex;align-items:center;gap:8px;font:800 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--fl) 55%,var(--text))}
.fla .w{display:flex;align-items:center;gap:8px;margin-top:6px}
.fla .w .nm{flex:1;min-width:0;font:700 24px/1.1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fla .t{background:var(--fl);color:#fff;padding:0 14px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;flex:none}
.fla .t b{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.fla .t small{font:600 13px/1.2 var(--body);opacity:.85;margin-top:3px}
@keyframes flaIn{from{transform:translateX(60px);opacity:0}}

/* ---------- race control: penalties and warnings for one car ---------- */
#penalty{right:36px;bottom:360px;width:480px}
/* the race's big flags called on screen: green (the start, a restart), white (the final lap), checkered (the winner) */
#flagcall{left:50%;top:36px;width:860px;margin-left:-430px}
.fc{display:flex;align-items:stretch;height:112px;background:var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:0 16px 44px rgba(0,0,0,.5)}
.fc-flag{width:150px;flex:none;position:relative}
.fc-flag.checkered{background:repeating-conic-gradient(#111 0 25%,#f4f4f4 0 50%) 0 0/37.5px 37.5px!important}
.fc-txt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 26px}
.fc-txt b{font:800 54px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.fc-txt span{color:var(--text);opacity:.85;font:700 22px/1.2 var(--display);text-transform:var(--caps);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-txt span .plate{margin-right:8px;vertical-align:2px}
:root[data-look="arcade"] .fc{clip-path:polygon(0 0,100% 0,97.5% 100%,0 100%);border-radius:0}
:root[data-look="arcade"] .fc-txt b{font-style:italic}
.pen{display:flex;align-items:stretch;border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:flaIn .45s cubic-bezier(.15,.9,.25,1) both}
.pen .fg{width:64px;flex:none;background:#0b0d12;position:relative;border-right:1px solid var(--line)}
.pen .fg.furled{background:linear-gradient(135deg,#fff 0 50%,#0b0d12 50%)}
.pen .fg.disqualify::before,.pen .fg.disqualify::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:7px;margin:-3.5px 0 0 -22px;background:#fff;transform:rotate(45deg)}
.pen .fg.disqualify::after{transform:rotate(-45deg)}
.pen .fg.served{background:#16a34a}
.pen .m{flex:1;background:var(--ink);padding:10px 14px;min-width:0}
.pen .h{display:flex;align-items:center;gap:8px;font:800 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pen .w{display:flex;align-items:center;gap:8px;margin-top:6px}
.pen .w .nm{flex:1;min-width:0;font:700 24px/1.1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pen .s{color:var(--muted);font:600 15px/1.2 var(--body);margin-top:4px}
.pen .cl{font:800 13px/1 var(--display);padding:4px 7px 3px;border-radius:var(--r);letter-spacing:.04em;text-transform:uppercase;flex:none}

/* ---------- head to head: two cars side by side ---------- */
#h2h{left:50%;top:190px;width:760px;margin-left:-380px}
.hh{border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);background:var(--ink)}
.hh-h{background:var(--head);color:var(--headText);font:800 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:8px 14px 7px;text-align:center}
.hh-who{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.hh-who>div{display:flex;align-items:center;gap:10px;padding:12px 16px;min-width:0}
.hh-who>div+div{flex-direction:row-reverse;text-align:right;border-left:1px solid var(--line)}
.hh-who .nm{flex:1;min-width:0;font:700 26px/1.1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hh-who .ps{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;flex:none}
.hh-row{display:grid;grid-template-columns:1fr 170px 1fr;align-items:center;padding:7px 16px}
.hh-row+.hh-row{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.hh-row span{text-align:center;color:var(--muted);font:600 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.hh-row b{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.hh-row b:last-child{text-align:right}
.hh-row b.up{color:var(--accent)}
.hh-row .sxr{display:flex;gap:4px}
.hh-row b:last-child .sxr{justify-content:flex-end}
.hh-row .sxr em{font:700 14px/1 var(--display);font-style:normal;padding:2px 5px 1px;border-radius:2px;color:#0b0d12;background:var(--line)}
.hh-row .sxr em.p{background:var(--sx-p);color:#fff}.hh-row .sxr em.g{background:var(--sx-g)}.hh-row .sxr em.y{background:var(--sx-y)}

/* ---------- onboard: the camera car's gear, speed, revs and wheel ---------- */
#onboard{left:460px;bottom:190px}
.ob{display:flex;align-items:center;gap:14px;background:var(--ink);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.45);padding:10px 16px 10px 12px}
.ob .gr{font:800 54px/1 var(--display);width:46px;text-align:center;font-variant-numeric:tabular-nums}
.ob .vals{display:flex;flex-direction:column;gap:4px}
.ob .vals b{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.ob .vals small{font:600 13px/1 var(--body);color:var(--muted);margin-left:5px;text-transform:uppercase;letter-spacing:.06em}
.ob svg{width:56px;height:56px;flex:none;transition:transform .1s linear}


/* ---------- the driver's picture and helmet (driver card, battle) ---------- */
.cd .ph{width:118px;flex:none;background:var(--ink2);position:relative;overflow:hidden}
.cd .ph:empty,.cd .hel:empty{display:none}
.cd .ph img,.cd .ph svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cd .hel{width:96px;flex:none;background:var(--ink);display:grid;place-items:center}
.cd .hel img,.cd .hel svg{width:84px;height:84px;object-fit:contain;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.bt-car .ph{width:44px;height:44px;flex:none;border-radius:var(--r);overflow:hidden;background:var(--ink2);position:relative}
.bt-car .ph:empty{display:none}
.bt-car .ph img,.bt-car .ph svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lv:empty{display:none}
.livery{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.livery.render{object-fit:contain;inset:4% 3%;width:94%;height:92%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}

/* ---------- map ---------- */
#map{right:36px;top:170px;width:360px;height:360px}
#map canvas{width:360px;height:360px;display:block}

/* ---------- race control ---------- */
#ticker{right:36px;bottom:54px;width:480px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tk{display:flex;align-items:stretch;background:var(--ink);width:100%;min-height:40px;border-radius:var(--r);overflow:hidden;animation:tkIn .45s cubic-bezier(.2,.8,.2,1) both}
.tk.out{animation:tkOut .4s ease both}
.tk i{min-width:84px;padding:0 10px;white-space:nowrap;box-sizing:border-box;flex:none;display:grid;place-items:center;font:800 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;font-style:normal;background:var(--muted);color:var(--ink)}
.tk.k-fl i{background:var(--fl);color:#fff} .tk.k-lead i{background:var(--accent);color:var(--accentText)}
.tk.k-inc i{background:var(--lose);color:#fff} .tk.k-flag i{background:var(--flag-green);color:#000}
.tk.k-wx i{background:#59c2e8;color:#000}
.tk p{margin:0;padding:9px 12px 8px;font:600 17px/1.25 var(--body)}
.tk p b{font:700 19px/1 var(--display);text-transform:var(--caps);letter-spacing:.02em}
@keyframes tkIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes tkOut{to{opacity:0;transform:translateX(30px)}}

/* ---------- show screens: starting soon, intermission, closing (full screen) ---------- */
#scene{left:0;top:0;width:1920px;height:1080px}
.sc{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1200px 700px at 80% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),linear-gradient(160deg,color-mix(in srgb,var(--head) 85%,#000),var(--ink) 55%,#05070b)}
.sc::before{content:"";position:absolute;left:-200px;right:-200px;bottom:100px;height:12px;background:var(--accent);transform:rotate(-2deg);opacity:.9;animation:scStripe 14s ease-in-out infinite alternate}
.sc::after{content:"";position:absolute;left:-200px;right:-200px;bottom:80px;height:4px;background:color-mix(in srgb,var(--accent) 50%,transparent);transform:rotate(-2deg);animation:scStripe 18s ease-in-out -6s infinite alternate}
/* the built-in screen's slow movement: two drifting glows, a light that sweeps by now and then, specks rising */
.sc-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sc-fx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35}
.sc-fx i.g1{width:900px;height:900px;left:-200px;top:-300px;background:color-mix(in srgb,var(--accent) 45%,transparent);animation:scDrift1 38s ease-in-out infinite alternate}
.sc-fx i.g2{width:1100px;height:1100px;right:-400px;bottom:-500px;background:color-mix(in srgb,var(--head) 70%,#3a5bff 20%);opacity:.3;animation:scDrift2 46s ease-in-out infinite alternate}
.sc-fx b{position:absolute;top:-20%;bottom:-20%;width:260px;left:-400px;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:scSweep 13s ease-in-out infinite}
.sc-fx u{position:absolute;inset:-100% 0 0 0;background-image:radial-gradient(circle,rgba(255,255,255,.22) 1.2px,transparent 1.6px),radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1.4px);
  background-size:180px 220px,260px 300px;background-position:0 0,90px 130px;animation:scRise 70s linear infinite;opacity:.6}
@keyframes scDrift1{to{transform:translate(380px,220px) scale(1.15)}}
@keyframes scDrift2{to{transform:translate(-320px,-180px) scale(.9)}}
@keyframes scSweep{0%,55%{left:-400px}100%{left:2300px}}
@keyframes scRise{to{transform:translateY(50%)}}
@keyframes scStripe{to{transform:rotate(-2deg) translateX(-120px)}}
/* coming in: the words rise, the lists follow one row at a time (only when the screen changes) */
.sc.enter .sc-k,.sc.enter h1,.sc.enter .sc-sub,.sc.enter .sc-cd{animation:scUp .9s cubic-bezier(.2,.8,.2,1) both}
.sc.enter h1{animation-delay:.12s}.sc.enter .sc-sub{animation-delay:.24s}.sc.enter .sc-cd{animation-delay:.36s}
.sc.enter .sc-col{animation:scUp .8s cubic-bezier(.2,.8,.2,1) both}
.sc.enter .sc-col:nth-child(2){animation-delay:.15s}.sc.enter .sc-col:nth-child(3){animation-delay:.3s}.sc.enter .sc-col:nth-child(4){animation-delay:.45s}
@keyframes scUp{from{opacity:0;transform:translateY(24px)}}
.sc-cd{animation:none}
.sc-cd .tick{display:inline-block;animation:scBreath 4s ease-in-out infinite}
@keyframes scBreath{50%{opacity:.82}}
/* your own file in place of the built-in background (a picture, a looping video or a web page) */
.sc-own{position:absolute;inset:0}
.sc-own img,.sc-own video,.sc-own iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.sc.own{background:#000}
.sc.own:not(.bare) .sc-own::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.35) 60%,rgba(0,0,0,.2))}.sc.own::before,.sc.own::after,.sc.own .sc-fx{display:none}
.sc.bare .sc-in,.sc.bare .sc-sp{display:none}
@media (prefers-reduced-motion:reduce){.sc *,.sc::before,.sc::after{animation:none!important}}
.sc-in{position:absolute;left:120px;right:120px;top:96px;bottom:220px;display:flex;flex-direction:column;color:var(--text)}
.sc-top{display:flex;align-items:center;gap:22px}
.sc-top img{max-height:90px;max-width:300px;object-fit:contain}
.sc-k{font:800 26px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sc h1{font:800 96px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:18px 0 8px;max-width:1500px}
.sc-sub{font:600 30px/1.2 var(--body);color:var(--muted);text-transform:var(--caps)}
.sc-cd{margin-top:22px;font:800 64px/1 var(--display);font-variant-numeric:tabular-nums}
.sc-cd small{font:700 24px/1 var(--display);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-right:16px}
.sc-body{margin-top:auto;display:grid;gap:26px;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end}
.sc-col h3{margin:0 0 8px;font:800 20px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px 6px;border-radius:var(--r);display:inline-block}
.sc-col .r{display:flex;align-items:center;gap:10px;height:34px;border-top:1px solid var(--line);font:600 21px/1 var(--display);text-transform:var(--caps);white-space:nowrap}
.sc-col .r .p{width:28px;text-align:center;font-weight:800}
.sc-col .r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sc-col .r .v{color:var(--muted);font-variant-numeric:tabular-nums}
.sc-col .more{color:var(--muted);font:600 17px/1 var(--body);padding-top:8px}
.sc-sp{position:absolute;left:120px;right:120px;bottom:12px;display:flex;align-items:center;justify-content:center;gap:56px;height:56px}
.sc-sp img{max-height:56px;max-width:220px;object-fit:contain;opacity:.9}

/* ---------- podium: top three of a class ---------- */
#podium{left:50%;top:150px;width:1040px;margin-left:-500px}   /* clear of the tower (36-416 px), which is on with it at the finish */
.pd{border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.pd-h{background:var(--head);color:var(--headText);display:flex;align-items:center;gap:14px;padding:12px 20px}
.pd-h b{font:800 34px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.pd-h .cl{font:800 16px/1 var(--display);padding:5px 9px 4px;border-radius:var(--r);letter-spacing:.05em;text-transform:uppercase}
.pd-h span{margin-left:auto;color:var(--muted);font:600 17px/1 var(--body)}
.pd-b{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:14px;background:var(--ink);padding:18px 18px 0}
.pd-s{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pd-s .ph{width:150px;height:150px;border-radius:50%;overflow:hidden;background:var(--ink2);display:grid;place-items:center}
.pd-s .ph img,.pd-s .ph svg{width:100%;height:100%;object-fit:cover}
.pd-s .nm{margin-top:10px;font:700 26px/1.1 var(--display);text-transform:var(--caps);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-s .x{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font:600 18px/1 var(--display);font-variant-numeric:tabular-nums}
.pd-s .step{margin-top:12px;width:100%;background:var(--ink2);display:grid;place-items:center;font:800 64px/1 var(--display);color:var(--accent);border-top:4px solid var(--accent)}
.pd-s.p1 .step{height:150px}.pd-s.p2 .step{height:110px}.pd-s.p3 .step{height:80px}
.pd-s.p1 .ph{width:180px;height:180px;box-shadow:0 0 0 5px var(--accent)}

/* ---------- commentator strap and sponsor bug ---------- */
#strap{left:36px;bottom:180px}
.sp-s{display:flex;align-items:stretch;border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:flaIn .45s cubic-bezier(.15,.9,.25,1) both}
.sp-s .bar{width:10px;background:var(--accent);flex:none}
.sp-s .m{background:var(--ink);padding:12px 22px 11px 16px}
.sp-s .nm{font:800 34px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.sp-s .rl{margin-top:6px;color:var(--muted);font:600 18px/1.1 var(--body)}
.sp-s .rl b{color:var(--accent);font-weight:700}
#sponsors{left:36px;bottom:54px;width:260px;height:76px}
.sb{width:100%;height:100%;background:var(--ink);border-radius:var(--r);display:grid;place-items:center;box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden}
.sb img{max-width:220px;max-height:56px;object-fit:contain;animation:sbIn .6s ease both}
@keyframes sbIn{from{opacity:0;transform:translateY(8px)}}

/* ---------- qualifying: the camera car's live lap against the class pole lap ---------- */
#qlap{left:50%;top:36px;width:640px;margin-left:-320px}
.ql{background:var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.ql-h{display:flex;align-items:center;gap:10px;background:var(--head);color:var(--headText);padding:8px 14px 7px;font:800 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.ql-h .nm{font:700 20px/1 var(--display);letter-spacing:0;text-transform:var(--caps)}
.ql-b{display:flex;align-items:center;gap:18px;padding:10px 16px}
.ql-d{font:800 46px/1 var(--display);font-variant-numeric:tabular-nums;padding:4px 10px 2px;border-radius:var(--r)}
.ql-d.p{background:var(--sx-p);color:#fff}.ql-d.g{background:var(--sx-g);color:#0b0d12}.ql-d.y{background:var(--sx-y);color:#0b0d12}
.ql-x{display:flex;flex-direction:column;gap:6px;color:var(--muted);font:600 16px/1 var(--body)}
.ql-x b{color:var(--text);font:800 26px/1 var(--display)}
.ql-bar{height:6px;background:var(--line)}.ql-bar i{display:block;height:100%;background:var(--accent)}

/* ---------- tyres, speed trap ---------- */
#tyres{left:800px;bottom:190px}
/* ---------- race TV extras: pit stop, closing in, race pace, strategy, lap chart ---------- */
#pitstop{right:36px;bottom:470px;width:480px}
#closing{left:50%;bottom:210px;width:900px;margin-left:-450px}
#pace{right:36px;top:110px;width:470px}
#strategy{right:36px;top:110px;width:600px}
#lapchart{left:50%;top:110px;width:1400px;margin-left:-700px}
.ps-big{display:flex;align-items:baseline;gap:14px;padding:10px 14px 4px}
.ps-big b{font:800 46px/1 var(--display);font-variant-numeric:tabular-nums}
.ps-big span{color:var(--muted);font:700 14px/1 var(--body);text-transform:uppercase;letter-spacing:.06em}
.ps-line{padding:4px 14px 10px;font:600 18px/1.3 var(--display);text-transform:var(--caps)}
.ps-line .plate{margin:0 4px;vertical-align:1px}
.ps-line .up{color:#3fd47a}.ps-line .dn{color:#ff6b6b}
.cl{display:flex;align-items:center;gap:16px;background:var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);padding-right:18px}
.cl-h{background:var(--head);color:var(--headText);align-self:stretch;display:flex;align-items:center;padding:0 16px;font:800 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.cl-who{flex:1;min-width:0;padding:12px 0;font:700 22px/1.2 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-who .plate{margin-right:6px;vertical-align:2px}
.cl-who small{color:var(--muted);font-weight:600}
.cl-n{text-align:right;white-space:nowrap}
.cl-n b{display:block;font:800 26px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.cl-n span{color:var(--muted);font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.06em}
.tb-r{display:flex;align-items:center;gap:8px;padding:5px 12px;border-top:1px solid var(--line);font:600 18px/1 var(--display);text-transform:var(--caps);white-space:nowrap}
.tb-r .p{width:26px;text-align:center;font-weight:800}
.tb-r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tb-r .v{width:86px;text-align:right;font-variant-numeric:tabular-nums}
.tb-r .v.m{color:var(--muted)}
.tb-r .v.g{color:#3fd47a}.tb-r .v.b{color:#ff6b6b}
.tb-h{display:flex;gap:8px;padding:5px 12px 3px;color:var(--muted);font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em}
.tb-h .sp{flex:1}.tb-h .c{width:86px;text-align:right}
.tb-r .v.w,.tb-h .c.w{width:118px}
.lc-svg{display:block;width:100%;height:auto;background:var(--ink)}
.lc-svg text{font-family:var(--display);font-weight:700}
#trap{left:1016px;bottom:200px;width:360px}
.mini{background:var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.mini-h{background:var(--head);color:var(--headText);padding:7px 12px 6px;font:800 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.mini-r{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);font:600 18px/1 var(--display);text-transform:var(--caps);white-space:nowrap}
.mini-r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mini-r .v{font-variant-numeric:tabular-nums;font-weight:800}
.ty{display:flex;align-items:center;gap:6px;padding:9px 12px}
.ty .run{display:flex;align-items:center;font:700 17px/1 var(--display);font-variant-numeric:tabular-nums}
.ty .ar{color:var(--muted)}

/* ---------- running order strip (oval style), league standings ---------- */
#strip{left:0;bottom:8px;width:1920px;height:36px;overflow:hidden}
.so{display:flex;width:max-content;animation:soRun var(--so-dur,60s) linear infinite}
.so-c{display:flex;align-items:center;gap:7px;height:36px;padding:0 16px 0 10px;background:var(--ink);border-right:1px solid var(--line);font:700 19px/1 var(--display);text-transform:var(--caps);white-space:nowrap}
.so-c .p{font-weight:800;color:var(--accent)}
.so-c .g{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.so-c.cam{background:color-mix(in srgb,var(--accent) 25%,var(--ink))}
.so-t{background:var(--head);color:var(--headText);padding:0 16px;display:flex;align-items:center;font:800 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
@keyframes soRun{to{transform:translateX(-50%)}}
#league{left:50%;top:110px;width:1100px;margin-left:-550px}
.lg-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.lg-r{display:flex;align-items:center;gap:10px;height:34px;border-top:1px solid var(--line);padding:0 6px;font:600 20px/1 var(--display);text-transform:var(--caps)}
.lg-r .p{width:30px;text-align:center;font-weight:800}
.lg-r .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-r .now{font:700 13px/1 var(--body);color:var(--accentText);background:var(--accent);border-radius:var(--r);padding:4px 6px 3px;text-transform:none}
.lg-r .pts{width:70px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- picture in picture: a second camera's video (VDO.Ninja link) in a framed window ---------- */
#pip{right:36px;top:170px;width:640px}
#pip.with-map{right:412px}      /* the track map keeps the corner; the window sits beside it */
.pp{border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);background:#000;border:3px solid var(--accent)}
.pp-v{position:relative;aspect-ratio:16/9;background:#000}
.pp-v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pp-c{display:flex;align-items:center;gap:9px;background:var(--ink);padding:7px 12px 6px}
.pp-c .lb{font:800 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accentText);padding:4px 7px 3px;border-radius:var(--r)}
.pp-c .nm{flex:1;min-width:0;font:700 21px/1.1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-c .ps{color:var(--muted);font:700 17px/1 var(--display)}

/* ---------- standings board / grid ---------- */
#board,#grid{left:50%;top:110px;width:1400px;margin-left:-700px}
.pn{border-radius:var(--r);overflow:hidden}
.pn-head{background:var(--head);color:var(--headText);display:flex;align-items:center;gap:16px;padding:14px 22px}
.pn-head b{font:800 40px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.pn-head span{margin-left:auto;font:600 17px/1.2 var(--body);color:color-mix(in srgb,var(--headText) 68%,var(--head));text-align:right;text-transform:var(--caps)}
.pn-body{background:var(--ink);padding:10px 14px 14px}
.bd-cols{display:grid;gap:14px}
.bd-sec .cls{font:800 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px 5px;margin:8px 0 2px;border-radius:var(--r)}
.bd-row{display:flex;align-items:center;gap:10px;height:32px;border-top:1px solid var(--line);padding:0 6px}
.bd-row .pos{width:30px;text-align:center;font:700 20px/1 var(--display)}
.bd-row .nm{flex:1;min-width:0;font:600 19px/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-row .v{width:88px;text-align:right;font:600 17px/1 var(--display);font-variant-numeric:tabular-nums}
.bd-row .v.m{color:var(--muted)}
.bd-row .v.fl{color:color-mix(in srgb,var(--fl) 55%,var(--text))}
.bd-row .v.up{color:#3fd47a}.bd-row .v.dn{color:#ff6b6b}
.bd-hi{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}.bd-hi:empty{display:none}
.bd-hi .hi{display:flex;align-items:center;gap:10px;background:var(--ink2);border-top:3px solid var(--accent);padding:10px 12px;border-radius:var(--r);animation:hiIn .5s ease both}
.bd-hi .hi:nth-child(2){animation-delay:.15s}.bd-hi .hi:nth-child(3){animation-delay:.3s}
.bd-hi small{color:var(--muted);font:600 11px/1.1 var(--body);text-transform:uppercase;letter-spacing:.06em;width:70px}
.bd-hi .nm{flex:1;font:600 19px/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-hi b{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
@keyframes hiIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bd-colhead{display:flex;gap:10px;color:var(--muted);font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.bd-colhead .sp{flex:1}.bd-colhead .c{width:88px;text-align:right}

.gd{display:grid;grid-template-columns:1fr 1fr;column-gap:30px;row-gap:10px}
.slot{display:flex;align-items:center;gap:12px;background:var(--ink2);border-radius:var(--r);height:68px;padding-right:14px;position:relative;overflow:hidden;transition:background .3s}
.slot:nth-child(even){transform:translateY(36px)}
.slot .p{width:56px;align-self:stretch;display:grid;place-items:center;font:800 34px/1 var(--display);background:var(--head);color:var(--headText)}
.slot .lv{width:130px;height:68px;flex:none;position:relative;overflow:hidden;background:var(--ink)}
.slot .who{flex:1;min-width:0}
.slot .who b{display:block;font:700 26px/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .who > span{display:block;color:var(--muted);font:600 14px/1.3 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.slot .who b .plate{margin-right:8px;vertical-align:2px}
small{margin-right:4px}
.slot .tm{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.slot .tm span{display:block;color:var(--muted);font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.slot.cam{background:color-mix(in srgb,var(--accent) 22%,var(--ink2));box-shadow:inset 0 0 0 3px var(--accent)}
.gd-foot{display:flex;justify-content:space-between;color:var(--muted);font:600 14px/1 var(--body);padding:48px 4px 0}

/* ---------- grid walk: the car the camera is on, as a TV grid slot, and the grid beside it ---------- */
#gwalk{left:36px;bottom:54px;width:1240px}
#gwalk.pair{width:1480px}
.gw{position:relative}
.gw-tags{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.gw-tags:not(:has(:not(.hide))){display:none}
.gw-cls{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 6px;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;border-radius:var(--r)}
.gw-cls span{font:600 15px/1 var(--body);letter-spacing:.04em;opacity:.85;text-transform:none}
.gw-row{display:flex;align-items:stretch;height:164px;border-radius:var(--r);overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.gw-pos{width:150px;flex:none;background:var(--head);color:var(--headText);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.gw-pos small{font:700 14px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.gw-pos b{font:800 96px/.86 var(--display);font-variant-numeric:tabular-nums;margin:4px 0 2px;display:block}
.gw-pos span{font:700 14px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.gw-lv{width:300px;flex:none;background:linear-gradient(160deg,var(--ink2),var(--ink));position:relative;overflow:hidden}
.gw-lv:empty{display:none}
.gw-lv img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
.gw-lv img:not(.render){inset:0;width:100%;height:100%;object-fit:cover}
.gw-main{flex:1;min-width:0;background:var(--ink);display:flex;flex-direction:column}
.gw-top{display:flex;align-items:center;gap:14px;padding:16px 20px 4px}
.gw-top .plate{min-width:56px;height:36px;font-size:24px}
.gw-name{font:800 48px/.95 var(--display);text-transform:var(--caps);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gw-name small{font-weight:500;color:var(--muted)}
.gw-lic{margin-left:auto;display:flex;gap:6px;flex:none}
.gw-lic span{font:700 14px/1 var(--body);padding:5px 8px 4px;border-radius:var(--r)}
.gw-sub{padding:2px 20px 0;color:var(--muted);font:600 16px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw-stats{margin-top:auto;display:flex;background:var(--ink2)}
.gw-stats div{flex:1 1 auto;padding:8px 16px 9px;border-right:1px solid var(--line);white-space:nowrap}
.gw-stats div:last-child{border-right:0}
.gw-stats span{display:block;color:var(--muted);font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.06em}
.gw-stats b{display:block;font:700 26px/1.05 var(--display);font-variant-numeric:tabular-nums;margin-top:3px}
.gw-stats b.q{color:var(--accent)}
.gw-ph{width:130px;flex:none;background:var(--ink2);position:relative;overflow:hidden}
.gw-ph:empty,.gw-hel:empty{display:none}
.gw-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gw-hel{width:120px;flex:none;background:var(--ink);display:grid;place-items:center}
.gw-hel img,.gw-hel svg{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.gw-badge{display:inline-flex;align-items:center;padding:8px 16px 7px;font:800 24px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;
  color:#1a1300;background:linear-gradient(100deg,#b88a1e,#ffe08a 45%,#d9a42b 60%,#ffe9a8);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.4)}
/* a row at a time: both cars of the row, side by side, the one on camera lit */
.gw-pair{display:flex;align-items:stretch;height:200px;border-radius:var(--r);overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.gw-pair .rw{width:118px;flex:none;background:var(--head);color:var(--headText);display:flex;flex-direction:column;align-items:center;justify-content:center}
.gw-pair .rw small{font:700 14px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.gw-pair .rw b{font:800 88px/.86 var(--display);margin-top:6px}
.gw-half{flex:1 1 0;min-width:0;display:flex;align-items:stretch;background:var(--ink);position:relative;transition:filter .4s,opacity .4s}
.gw-half+.gw-half{border-left:2px solid var(--line)}
.gw-half:not(.now){filter:brightness(.7) saturate(.8)}
.gw-half.now{box-shadow:inset 0 4px 0 var(--accent)}
.gw-half .ps{width:84px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ink2)}
.gw-half .ps b{font:800 54px/.9 var(--display);font-variant-numeric:tabular-nums}
.gw-half .ps span{font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:4px;white-space:nowrap}
.gw-half .lvh{width:300px;flex:none;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--ink2),var(--ink))}
.gw-half .lvh:empty{display:none}
.gw-half .lvh img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain}
.gw-half .lvh img:not(.render){inset:0;width:100%;height:100%;object-fit:cover}
.gw-half .gb{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 16px 0}
.gw-half .gn{display:flex;align-items:center;gap:10px;font:800 32px/1.2 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;min-width:0}
.gw-half .gn em{font-style:normal;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gw-half .gn small{font-weight:500;color:var(--muted)}
.gw-half .gs{color:var(--muted);font:600 14px/1.2 var(--body);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw-half .gq{display:flex;gap:18px;margin-top:auto;padding:0 0 12px}
.gw-half .gq div span{display:block;color:var(--muted);font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em}
.gw-half .gq div b{display:block;font:700 26px/1.05 var(--display);font-variant-numeric:tabular-nums;margin-top:3px}
.gw-half .gq div b.q{color:var(--accent)}
#gwalk.gw-next .gw-half.now .gb{animation:gwIn .45s cubic-bezier(.2,.8,.2,1) both}
#gwalk.gw-next .gw-half.now .lvh img{animation:gwLv .6s cubic-bezier(.15,.9,.25,1) both}
#gwalk.gw-row-new .gw-pair .rw b{animation:gwPos .55s cubic-bezier(.2,.8,.2,1) both}
:root[data-look="arcade"] .gw-pair{clip-path:polygon(0 0,100% 0,98.6% 100%,0 100%);border-radius:0}
:root[data-look="arcade"] .gw-half .gn,:root[data-look="arcade"] .gw-pair .rw b{font-style:italic}
:root[data-look="arcade"] .gw-half .gq div b{font:900 italic 26px/1.05 var(--num);color:var(--accent)}
:root[data-look="pitwall"] .gw-pair{box-shadow:0 0 0 5px #16181b,0 0 0 6px #2a2e33,0 14px 30px rgba(0,0,0,.55)}
:root[data-look="pitwall"] .gw-half .gq div b{font-family:var(--seg)!important;font-size:21px}
/* ---------- the grid board: the whole grid on one screen, every car's picture in its slot, a light running
   down it from pole (the director's gridBoard: the row it is on; 0 while it comes in) ---------- */
#gboard{left:50%;top:60px;width:1760px;margin-left:-880px}
.gbd{border-radius:var(--r);overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.gbd .pn-head small{font:700 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.gbd-win{background:color-mix(in srgb,var(--ink) 96%,transparent);overflow:hidden;position:relative}
.gbd-cols{display:grid;gap:0 28px;padding:16px 20px 20px;transition:translate .7s cubic-bezier(.2,.8,.2,1)}
.gbd-col{display:flex;flex-direction:column;gap:var(--gbGap);min-width:0}
.gbs{display:flex;align-items:stretch;height:var(--gbH);background:var(--ink2);border-radius:var(--r);overflow:hidden;position:relative;transition:box-shadow .45s,filter .45s,background .45s}
.gbs i{width:6px;flex:none}
.gbs .p{width:calc(var(--gbH) * .62);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--head);color:var(--headText)}
.gbs .p b{font:800 calc(var(--gbH) * .42)/.9 var(--display);font-variant-numeric:tabular-nums}
.gbs .p span{font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:3px;white-space:nowrap}
.gbs .lv{width:calc(var(--gbH) * 2.3);flex:none;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--ink2),var(--ink))}
.gbs .lv img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain}
.gbs .lv img:not(.render){inset:0;width:100%;height:100%;object-fit:cover}
.gbs .who{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 16px}
.gbs .who b{font:800 calc(min(34px, var(--gbH) * .3))/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbs .who b .plate{margin-right:10px;vertical-align:3px}
.gbs .who span{color:var(--muted);font:600 15px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.gbs .tm{padding:0 18px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;font:700 calc(min(28px, var(--gbH) * .24))/1 var(--display);font-variant-numeric:tabular-nums}
.gbs .tm span{color:var(--muted);font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;margin-top:5px}
.gbs .tm em{font-style:normal;color:var(--muted);font-size:.7em;margin-top:4px}
.gbs::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;transition:box-shadow .45s}
.gbs.lit{box-shadow:0 0 28px color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 16%,var(--ink2))}
.gbs.lit::after{box-shadow:inset 0 0 0 3px var(--accent)}
.gbs.lit .lv img{animation:gwLv .6s cubic-bezier(.15,.9,.25,1) both}
.gbs.away{filter:saturate(.45) brightness(.78)}
.gbs .who .out{font-style:normal;color:var(--text);font-weight:700}
#gboard.gb-in .gbs{animation:gbIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 45ms)}
@keyframes gbIn{from{opacity:0;translate:0 24px;filter:blur(4px)}}
:root[data-look="arcade"] .gbs{clip-path:polygon(0 0,100% 0,98.8% 100%,0 100%);border-radius:0}
:root[data-look="arcade"] .gbs .who b,:root[data-look="arcade"] .gbs .p b{font-style:italic}
:root[data-look="pitwall"] .gbs .tm{font-family:var(--seg)!important}
/* the grid beside it: two columns, staggered like the cars, the one on camera lit, the ones walked dimmed */
#gladder{right:36px;top:110px;width:400px}
.gl{background:color-mix(in srgb,var(--ink) 94%,transparent);border-radius:var(--r);overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.gl-head{display:flex;align-items:baseline;gap:8px;background:var(--head);color:var(--headText);padding:10px 14px}
.gl-head b{font:800 21px/1 var(--display);text-transform:var(--caps);letter-spacing:.02em}
.gl-head span{margin-left:auto;font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
.gl-win{height:640px;overflow:hidden;position:relative}
.gl-slots{display:grid;grid-template-columns:1fr 1fr;column-gap:10px;row-gap:6px;padding:10px 12px 46px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.gl-s{display:flex;align-items:center;gap:7px;height:46px;background:var(--ink2);border-radius:var(--r);padding:0 8px 0 0;overflow:hidden;transition:opacity .4s,background .4s,box-shadow .4s}
.gl-s:nth-child(even){transform:translateY(26px)}
.gl-s i{width:5px;align-self:stretch;flex:none}
.gl-s .p{width:24px;font:800 20px/1 var(--display);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.gl-s .plate{min-width:34px;height:22px;font-size:15px}
.gl-s em{--fit-min:.58;flex:1;font:600 14px/1 var(--display);font-style:normal;text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gl-s.done{opacity:.45}
.gl-s.now{background:color-mix(in srgb,var(--accent) 26%,var(--ink2));box-shadow:inset 0 0 0 2px var(--accent)}
.gl-s.now .p{color:var(--accent)}
.gl-s.mate{background:color-mix(in srgb,var(--accent) 10%,var(--ink2))}
/* each new car comes in (Still: nothing moves, the MOTION block) */
#gwalk.gw-next .gw-pos b{animation:gwPos .55s cubic-bezier(.2,.8,.2,1) both}
#gwalk.gw-next .gw-lv img{animation:gwLv .7s .05s cubic-bezier(.15,.9,.25,1) both}
#gwalk.gw-next .gw-top,#gwalk.gw-next .gw-sub{animation:gwIn .5s .12s cubic-bezier(.2,.8,.2,1) both}
#gwalk.gw-next .gw-stats div{animation:gwUp .45s cubic-bezier(.2,.8,.2,1) both}
#gwalk.gw-next .gw-stats div:nth-child(2){animation-delay:.08s}#gwalk.gw-next .gw-stats div:nth-child(3){animation-delay:.16s}
#gwalk.gw-next .gw-stats div:nth-child(4){animation-delay:.24s}#gwalk.gw-next .gw-stats div:nth-child(5){animation-delay:.32s}
#gwalk .gw-badge:not(.hide){animation:gwShine 2.4s ease-in-out infinite}
#gwalk.gw-next .gw-badge:not(.hide){animation:gwBadge .7s .2s cubic-bezier(.2,1.4,.4,1) both,gwShine 2.4s .9s ease-in-out infinite}
#gwalk.gw-cls-new .gw-cls{animation:gwIn .55s cubic-bezier(.2,.8,.2,1) both}
.gw-badge{background-size:220% 100%}
@keyframes gwPos{from{opacity:0;translate:0 40%}}
@keyframes gwLv{from{opacity:0;translate:60% 0}}
@keyframes gwIn{from{opacity:0;translate:-24px 0}}
@keyframes gwUp{from{opacity:0;translate:0 12px}}
@keyframes gwBadge{from{opacity:0;scale:.6}}
@keyframes gwShine{0%,100%{background-position:0 0}50%{background-position:100% 0}}

/* ---------- stinger ---------- */
#stinger{left:0;top:0;width:1920px;height:1080px;opacity:1;overflow:hidden}
#stinger .bar{position:absolute;top:-20%;height:140%;width:140%;left:-150%;transform:skewX(-18deg)}
#stinger .b1{background:var(--accent)} #stinger .b2{background:var(--head)}
#stinger .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0}
#stinger .mark img{max-width:520px;max-height:220px}
#stinger .mark b{font:800 96px/1 var(--display);color:var(--headText);text-transform:uppercase;letter-spacing:.06em}
#stinger.run .b1{animation:sw1 var(--dur,900ms) cubic-bezier(.7,0,.3,1) both}
#stinger.run .b2{animation:sw2 var(--dur,900ms) cubic-bezier(.7,0,.3,1) both}
#stinger.run .mark{animation:mk var(--dur,900ms) ease both}
@keyframes sw1{0%{left:-150%}45%{left:-20%}55%{left:-20%}100%{left:110%}}
@keyframes sw2{0%{left:-170%}10%{left:-170%}50%{left:-20%}60%{left:-20%}100%{left:120%}}
@keyframes mk{0%,35%{opacity:0;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1)}65%{opacity:1}80%,100%{opacity:0}}
#stinger video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* More built-in stingers (theme.stinger.style). Each covers the whole picture from about 40% to 60% of its length,
   where the cut happens (cutMs, half the length by default). To add one: a STINGERS entry below and its CSS here. */
#stinger .fx{position:absolute;inset:0;pointer-events:none}
#stinger .fx>*{position:absolute}
#stinger.run[data-style="chevrons"] .fx>i.fill{top:0;height:100%;left:-120%;width:120%;background:var(--head);animation:stFill var(--dur) cubic-bezier(.7,0,.3,1) both}
#stinger.run[data-style="chevrons"] .fx>i.ch{top:-10%;height:120%;width:520px;left:-700px;background:var(--accent);clip-path:polygon(0 0,55% 0,100% 50%,55% 100%,0 100%,45% 50%);animation:stChev var(--dur) cubic-bezier(.6,0,.4,1) both}
@keyframes stFill{0%{transform:translateX(0)}42%,58%{transform:translateX(100%)}100%{transform:translateX(200%)}}
@keyframes stChev{0%{transform:translateX(0)}100%{transform:translateX(3400px)}}
#stinger.run[data-style="checker"] .fx>i{inset:-10% auto -10% 0;width:2600px;left:-2700px;transform:skewX(-14deg);
  background:linear-gradient(90deg,var(--accent) 0 40px,transparent 40px),repeating-conic-gradient(#f2f2f2 0 25%,#111 0 50%) 0 0/96px 96px;animation:stFlag var(--dur) cubic-bezier(.7,0,.3,1) both}
@keyframes stFlag{0%{left:-2700px}42%,58%{left:-300px}100%{left:2200px}}
#stinger.run[data-style="panels"] .fx>i{top:0;height:100%;width:12.7%;background:var(--head);transform:translateY(-105%);animation:stPanel var(--dur) cubic-bezier(.7,0,.3,1) both}
#stinger.run[data-style="panels"] .fx>i:nth-child(even){background:color-mix(in srgb,var(--head) 80%,var(--accent))}
@keyframes stPanel{0%{transform:translateY(-105%)}35%,65%{transform:translateY(0)}100%{transform:translateY(105%)}}
#stinger.run[data-style="iris"] .fx>i{left:50%;top:50%;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;border-radius:50%;background:var(--head);box-shadow:0 0 0 22px var(--accent);transform:scale(0);animation:stIris var(--dur) cubic-bezier(.7,0,.3,1) both}
@keyframes stIris{0%{transform:scale(0);opacity:1}42%,58%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
#stinger.run:not([data-style="wipe"]) .bar{display:none}

#setup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#111;color:#fff;padding:24px 28px;max-width:640px;font:500 20px/1.45 sans-serif}
@media (prefers-reduced-motion: reduce){.row,.layer,.tk,.inner{transition:none!important;animation:none!important}}
/* The broadcast's master switch is off (the producer panel's "Broadcast off"): nothing on air */
body.bc-off>*:not(script){visibility:hidden!important}

/* ---------- LOOKS: the Pit wall and Arcade presets restyle the graphics, not just their colours (data-look) ---------- */
@font-face{font-family:"DSEG7 digits";font-weight:400 900;font-display:swap;unicode-range:U+0020,U+002B-002E,U+0030-003A;src:url("/pitwall/assets/dseg7-classic-bold.woff2") format("woff2")}
@font-face{font-family:"Russo One";font-display:swap;src:url("/pitwall/assets/russo-one-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Exo 2";font-weight:400 600;font-display:swap;src:url("/pitwall/assets/exo-2-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Exo 2";font-weight:700 900;font-style:italic;font-display:swap;src:url("/pitwall/assets/exo-2-latin-900-italic.woff2") format("woff2")}
:root[data-look="pitwall"]{--seg:"DSEG7 digits",var(--display)}
:root[data-look="pitwall"] .tw-head,:root[data-look="pitwall"] .bn,:root[data-look="pitwall"] .bt,:root[data-look="pitwall"] .cd,:root[data-look="pitwall"] .pn,:root[data-look="pitwall"] .fs,:root[data-look="pitwall"] .tk,:root[data-look="pitwall"] .rp{box-shadow:0 0 0 5px #16181b,0 0 0 6px #2a2e33,0 14px 30px rgba(0,0,0,.55)}
:root[data-look="pitwall"] .tw-head{border-bottom:3px solid var(--accent)}
:root[data-look="pitwall"] .tw-foot{background:#16181b}
:root[data-look="pitwall"] .row .val,:root[data-look="pitwall"] .bt-gap b,:root[data-look="pitwall"] .cd .stats b,:root[data-look="pitwall"] .bn .main b,:root[data-look="pitwall"] .fs-big,:root[data-look="pitwall"] .fs-car .tm{font-family:var(--seg)!important;font-weight:700;letter-spacing:.02em}
:root[data-look="pitwall"] .row .val{font-size:15px}
:root[data-look="pitwall"] .bt-gap b{font-size:22px}
:root[data-look="pitwall"] .cd .stats b{font-size:18px}
:root[data-look="pitwall"] .bn .main b{font-size:22px}
:root[data-look="pitwall"] .fs-big{font-size:40px}
:root[data-look="pitwall"] .fs-car .tm{font-size:20px}
:root[data-look="pitwall"] .row.cam{background:linear-gradient(90deg,rgba(180,60,240,.28),transparent 70%)}
:root[data-look="pitwall"] .row.cam .pos{background:var(--fl);color:#fff}
:root[data-look="pitwall"] .cd .num{box-shadow:inset -1px 0 0 #000}
:root[data-look="pitwall"] .bt-head,:root[data-look="pitwall"] .fs-h{background:#000;color:var(--accent);border-bottom:3px solid var(--accent)}
:root[data-look="pitwall"] .tk i{background:#000;color:var(--accent);border-right:3px solid var(--accent)}
:root[data-look="pitwall"] .cd .ph,:root[data-look="pitwall"] .cd .hel{background:#000}
:root[data-look="arcade"]{--num:"Exo 2",var(--body);--chkg:conic-gradient(#fff 0 25%,#0b0d12 0 50%,#fff 0 75%,#0b0d12 0);
  --chrome:linear-gradient(180deg,#ffffff 0%,#fff3b0 40%,#ffb000 54%,#ff5a1f 55%,#ffd400 100%);
  --trail:-5px 0 0 rgba(255,90,31,.5),-12px 0 0 rgba(255,90,31,.22)}
:root[data-look="arcade"] .tw-head,:root[data-look="arcade"] .bn,:root[data-look="arcade"] .cd,:root[data-look="arcade"] .pn,:root[data-look="arcade"] .fs,:root[data-look="arcade"] .rp{box-shadow:0 14px 40px rgba(0,0,0,.55);border:1px solid #2b3549}
:root[data-look="arcade"] .tw-head{transform:skewX(-8deg);position:relative;border-bottom:3px solid var(--accent)}
:root[data-look="arcade"] .tw-head::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:8px;background:var(--chkg) 0 0/8px 8px;opacity:.9}
:root[data-look="arcade"] .tw-head .ttl,:root[data-look="arcade"] .tw-head .st{font-style:italic}
:root[data-look="arcade"] .tw-head .st{font:900 italic 22px/1 var(--num);padding-right:2px;color:transparent;background:var(--chrome);-webkit-background-clip:text;background-clip:text}
:root[data-look="arcade"] .tw-flag,:root[data-look="arcade"] .tw-foot{display:none}
:root[data-look="arcade"] .tw-body{background:transparent;margin-top:10px}
:root[data-look="arcade"] .row{background:linear-gradient(90deg,rgba(17,23,37,.94),rgba(10,14,22,.94))!important;border-left:3px solid transparent;margin-top:0}
:root[data-look="arcade"] .row .nm{font-style:italic}
:root[data-look="arcade"] .row .pos{font:900 italic 1.05em var(--num);color:var(--accent)}
:root[data-look="arcade"] .row .val{font:900 italic 18px var(--num)}
:root[data-look="arcade"] .row.cam{border-left-color:var(--accent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,#0c1018),rgba(10,14,22,.94) 70%)!important;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 25%,transparent)}
:root[data-look="arcade"] .row.cam .pos{background:var(--accent);color:#000}
:root[data-look="arcade"] .bn .main b{font:900 italic 30px var(--num);color:transparent;background:var(--chrome);-webkit-background-clip:text;background-clip:text}
:root[data-look="arcade"] .bn{transform:skewX(-8deg)}
:root[data-look="arcade"] #card.on .cd{animation:lkCard .6s cubic-bezier(.15,.9,.25,1) both}
:root[data-look="arcade"] .cd{height:132px;clip-path:polygon(0 0,100% 0,98% 100%,0 100%);border-top:3px solid var(--accent)}
:root[data-look="arcade"] .cd .ph{width:160px;background:linear-gradient(135deg,#1a2234,#0a0e16)}
:root[data-look="arcade"] .cd .num b{font:900 italic 60px/.9 var(--num);text-shadow:0 3px 0 rgba(0,0,0,.6)}
:root[data-look="arcade"] .cd .name{font-style:italic;text-shadow:var(--trail)}
:root[data-look="arcade"] .cd .stats b{font:900 italic 24px var(--num);color:var(--accent)}
:root[data-look="arcade"] #card.on .cd .hel{animation:lkHel .45s .4s cubic-bezier(.2,1.5,.4,1) both}
:root[data-look="arcade"] #card.on .cd .lv{animation:lkLv .7s .2s cubic-bezier(.15,.9,.25,1) both}
:root[data-look="arcade"] .cd .lv{width:250px;background:transparent}
@keyframes lkCard{0%{transform:translateX(520px) skewX(-24deg);filter:blur(8px);opacity:0}70%{transform:translateX(-10px) skewX(-2deg);filter:none;opacity:1}100%{transform:none}}
@keyframes lkHel{from{transform:scale(1.5) translateX(40px);opacity:0}}
@keyframes lkLv{0%{transform:translateX(480px) skewX(-28deg);filter:blur(8px);opacity:0}75%{transform:translateX(-8px);filter:none;opacity:1}100%{transform:none}}
:root[data-look="arcade"] #battle{width:900px;margin-left:-450px}
:root[data-look="arcade"] .bt{overflow:visible;border-radius:0}
:root[data-look="arcade"] .bt-head{display:inline-flex;gap:14px;transform:skewX(-14deg);margin-bottom:8px;font-style:italic}
:root[data-look="arcade"] .bt-cars{display:grid;grid-template-columns:1fr auto 1fr;background:linear-gradient(180deg,rgba(17,23,37,.95),rgba(8,11,17,.95));align-items:stretch;position:relative;overflow:hidden;
  border:1px solid #2b3549;border-top:3px solid var(--accent);transform:skewX(-8deg);box-shadow:0 14px 40px rgba(0,0,0,.55)}
:root[data-look="arcade"] .bt-cars::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;
  background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(255,255,255,.06) 13px 14px,transparent 14px 31px,rgba(255,212,0,.08) 31px 33px,transparent 33px 52px);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 140px,transparent 140px 200px,#000 200px 260px,transparent 260px 380px);mask:repeating-linear-gradient(90deg,#000 0 140px,transparent 140px 200px,#000 200px 260px,transparent 260px 380px);animation:lkLines .4s linear infinite}
:root[data-look="arcade"] #battle.on .bt-cars{animation:lkBattle .55s cubic-bezier(.15,.9,.25,1) both}
@keyframes lkBattle{0%{transform:translateX(600px) skewX(-28deg);filter:blur(8px);opacity:0}70%{transform:translateX(-10px) skewX(-6deg);filter:none;opacity:1}100%{transform:skewX(-8deg)}}
@keyframes lkLines{to{-webkit-mask-position:-380px 0;mask-position:-380px 0}}
:root[data-look="arcade"] .bt-car{flex-direction:column;align-items:flex-start;gap:6px;padding:14px 18px;height:160px;box-sizing:border-box;position:relative;z-index:1}
:root[data-look="arcade"] .bt-car:last-child{align-items:flex-end;text-align:right}
:root[data-look="arcade"] .bt-car:first-child{border-left:6px solid var(--accent)}
:root[data-look="arcade"] .bt-car:last-child{border-right:6px solid #19d9ff}
:root[data-look="arcade"] .bt-car .pos{font:900 italic 30px var(--num);color:var(--accent)}
:root[data-look="arcade"] .bt-car:last-child .pos{color:#19d9ff}
:root[data-look="arcade"] .bt-car .nm{font-style:italic;font-size:28px;max-width:100%}
:root[data-look="arcade"] .bt-car .lv{width:220px;height:80px;background:transparent}
:root[data-look="arcade"] .bt-car .ph{position:absolute;top:14px;width:64px;height:64px;border:2px solid #fff;border-radius:50%;overflow:hidden}
:root[data-look="arcade"] .bt-car:first-child .ph{right:20px}
:root[data-look="arcade"] .bt-car:last-child .ph{left:20px}
:root[data-look="arcade"] .bt-gap{background:transparent;z-index:2;justify-content:center;padding:0 22px;position:relative}
:root[data-look="arcade"] .bt-gap::before{content:"";position:absolute;inset:14px 0;background:rgba(0,0,0,.55);border-left:1px solid #2b3549;border-right:1px solid #2b3549;z-index:-1}
:root[data-look="arcade"] .bt-gap b{font:900 italic 46px var(--num);color:transparent;background:var(--chrome);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1px #1a0d00}
:root[data-look="arcade"] .bt-gap span{color:#fff;letter-spacing:.3em;font-style:italic}
:root[data-look="arcade"] .bt-foot{background:#06080d;border:1px solid #2b3549;margin-top:10px;transform:skewX(-8deg);font-style:italic}
:root[data-look="arcade"] .tk{border:1px solid #2b3549;border-left:4px solid var(--accent);transform:skewX(-8deg);box-shadow:0 10px 30px rgba(0,0,0,.5)}
:root[data-look="arcade"] .tk p b{font-style:italic}
:root[data-look="arcade"] .pn-head b{font:900 italic 40px/1.05 var(--num);padding-right:4px;color:transparent;background:var(--chrome);-webkit-background-clip:text;background-clip:text}
:root[data-look="arcade"] .fs-h,:root[data-look="arcade"] .bt-head{background:var(--accent);color:#000}
:root[data-look="arcade"] .rp{transform:skewX(-10deg)}
:root[data-look="arcade"] .rp b{font-style:italic}
:root[data-look="arcade"] .lk-hit .inner::after{content:"";position:absolute;inset:-10px;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 48%,rgba(255,243,176,.25) 54%,transparent 66%) no-repeat;background-size:250% 100%;mix-blend-mode:screen;animation:lkSweep .6s cubic-bezier(.3,0,.5,1) both}
:root[data-look="arcade"] .layer .inner{position:relative}
@keyframes lkSweep{from{background-position:120% 0}to{background-position:-30% 0}}
/* ---------- ARCADE FX: the big moments full screen, the kerbs, the tower, the battle, the show (data-look="arcade").
   #arcx is not a graphic: it lies over them all, under the stinger, and is never measured by makeRoom. Its call-outs
   are axCall's; the edges' speed is the race's mood (data-ax: green, final, caution, done). Still (data-motion off)
   has none of it; Calm keeps the call-outs and drops what loops. ---------- */
#arcx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;overflow:hidden}
#axFx{position:absolute;left:0;top:0;width:1920px;height:1080px}
#axCall{position:absolute;left:0;right:0;top:330px;height:330px;display:none;--ax-c:var(--accent)}
#axCall.run{display:block}
#axCall .ax-band{position:absolute;left:-60px;right:-60px;top:24px;height:286px;transform:skewY(-3deg);
  background:linear-gradient(90deg,transparent,rgba(6,8,13,.92) 12%,rgba(6,8,13,.92) 88%,transparent),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px);
  border-top:5px solid var(--ax-c);border-bottom:5px solid var(--ax-c);box-shadow:0 0 60px color-mix(in srgb,var(--ax-c) 40%,transparent);animation:axBand var(--ax-ms) cubic-bezier(.7,0,.2,1) both}
#axCall .ax-t{position:absolute;left:0;right:0;top:36px;text-align:center;font:900 italic 150px/1.15 var(--num);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;
  color:transparent;background:linear-gradient(180deg,#fff 0%,#fff 30%,var(--ax-c) 52%,color-mix(in srgb,var(--ax-c) 55%,#000) 70%,#fff 100%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:2px rgba(0,0,0,.55);filter:drop-shadow(0 8px 0 rgba(0,0,0,.55)) drop-shadow(0 0 26px color-mix(in srgb,var(--ax-c) 55%,transparent));
  animation:axDrive var(--ax-ms) cubic-bezier(.2,.9,.2,1) both;padding:0 40px}
#axCall .ax-s{position:absolute;left:0;right:0;top:226px;display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;font:800 italic 40px/1.2 var(--num);text-transform:uppercase;
  white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.7);animation:axSub var(--ax-ms) cubic-bezier(.2,.9,.2,1) both}
#axCall .ax-s small{font:700 italic 26px var(--num);color:#c9d2e3;text-transform:uppercase}
#axCall .ax-s b{color:var(--ax-c);font-weight:900}
#axCall .ax-s .plate{font-size:24px;height:34px;min-width:48px;font-style:normal}
#axCall.ax-lead,#axCall.ax-winner{--ax-c:#ffc21a}
#axCall.ax-fl{--ax-c:var(--fl)}
#axCall.ax-green{--ax-c:#1fe07a}
#axCall.ax-final .ax-band{background:linear-gradient(90deg,transparent,rgba(6,8,13,.92) 12%,rgba(6,8,13,.92) 88%,transparent),var(--chkg) 0 0/38px 38px;background-blend-mode:normal}
#axCall.ax-final{--ax-c:#ffffff}
#axCall.ax-caution{--ax-c:#ffd400}
#axCall.ax-caution .ax-band{background:linear-gradient(180deg,transparent 0 30px,rgba(6,8,13,.95) 30px calc(100% - 30px),transparent calc(100% - 30px)),repeating-linear-gradient(-45deg,#ffd400 0 30px,#111 30px 60px);border-color:#111;animation:axBand var(--ax-ms) cubic-bezier(.7,0,.2,1) both,axBounce .5s .1s cubic-bezier(.3,1.6,.5,1) both}
#axCall.ax-winner .ax-t{font-size:170px;top:24px}
#axCall.ax-winner .ax-s{font-size:50px;top:228px}
@keyframes axBand{0%{clip-path:inset(0 0 0 100%)}10%{clip-path:inset(0)}86%{clip-path:inset(0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes axDrive{0%{transform:translateX(1500px) skewX(-30deg);filter:blur(10px);opacity:0}
  11%{transform:translateX(-60px) skewX(-4deg);filter:blur(0);opacity:1}16%{transform:translateX(16px) skewX(-12deg);filter:blur(0)}21%,84%{transform:translateX(0) skewX(-10deg);filter:blur(0);opacity:1}
  100%{transform:translateX(-1800px) skewX(24deg);filter:blur(12px);opacity:0}}
@keyframes axSub{0%,12%{transform:translateX(-420px) skewX(20deg);opacity:0}24%,82%{transform:none;opacity:1}96%,100%{transform:translateX(500px);opacity:0}}
@keyframes axBounce{0%{transform:skewY(-3deg) scaleY(.2)}100%{transform:skewY(-3deg) scaleY(1)}}
/* five start lights going out: the green */
.ax-lights{position:absolute;left:50%;top:60px;margin-left:-260px;width:520px;height:110px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;box-sizing:border-box;
  background:#07090d;border:3px solid #2b3549;border-radius:14px;opacity:0;transform:skewX(-8deg)}
.ax-lights i{width:70px;height:70px;border-radius:50%;background:#2a0b0b;box-shadow:inset 0 -6px 12px rgba(0,0,0,.6)}
.ax-lights.run{animation:axLightsBox 2.6s ease both}
.ax-lights.run i{animation:axLampOn .05s both,axLampGo 1.2s 1.25s both}
.ax-lights.run i:nth-child(2){animation-delay:.18s,1.25s}.ax-lights.run i:nth-child(3){animation-delay:.36s,1.25s}
.ax-lights.run i:nth-child(4){animation-delay:.54s,1.25s}.ax-lights.run i:nth-child(5){animation-delay:.72s,1.25s}
@keyframes axLightsBox{0%{opacity:0;transform:translateY(-40px) skewX(-8deg)}8%,88%{opacity:1;transform:skewX(-8deg)}100%{opacity:0;transform:skewX(-8deg)}}
@keyframes axLampOn{to{background:#ff1e1e;box-shadow:0 0 28px #ff1e1e,inset 0 -6px 12px rgba(0,0,0,.3)}}
@keyframes axLampGo{0%{background:#2a0b0b;box-shadow:none}25%,70%{background:#1fe07a;box-shadow:0 0 34px #1fe07a}100%{background:#1fe07a;box-shadow:0 0 34px #1fe07a}}
/* the kerbs: a red and white stripe under every graphic, running at the race's speed */
:root[data-look="arcade"]{--ax-kerb:1.4s;--ax-k1:#e10600;--ax-k2:#ffffff}
:root[data-look="arcade"][data-ax="final"]{--ax-kerb:.45s}
:root[data-look="arcade"][data-ax="caution"]{--ax-kerb:3.2s;--ax-k1:#ffd400;--ax-k2:#111111}
:root[data-look="arcade"][data-ax="done"]{--ax-k1:#f5f5f5;--ax-k2:#0b0d12}
:root[data-look="arcade"]:not([data-motion="off"]) .layer:not(#stinger):not(#scene):not(#strip):not(#map):not(#pip):not(#sponsors):not(#gboard) > .inner::before{content:"";position:absolute;left:0;right:0;bottom:-7px;height:5px;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--ax-k1) 0 18px,var(--ax-k2) 18px 36px);background-size:36px 100%;transform:skewX(-30deg)}
:root[data-look="arcade"][data-motion="on"] .layer > .inner::before{animation:axKerb var(--ax-kerb) linear infinite}
@keyframes axKerb{to{background-position:36px 0}}
/* under a caution every graphic's edge pulses yellow */
:root[data-look="arcade"][data-motion="on"][data-ax="caution"] .layer.on:not(#stinger):not(#scene):not(#strip) > .inner{animation:axCau 1.6s ease-in-out infinite}
@keyframes axCau{0%,100%{filter:drop-shadow(0 0 0 rgba(255,212,0,0))}50%{filter:drop-shadow(0 0 14px rgba(255,212,0,.75))}}
/* coming on air: a diagonal wipe with a checkered edge (the card and the battle keep their own) */
:root[data-look="arcade"]:not([data-motion="off"]) .layer.on:not(#stinger):not(#scene):not(#card):not(#battle):not(#gwalk) > .inner{animation:axIn .5s cubic-bezier(.7,0,.2,1) backwards}
:root[data-look="arcade"][data-motion="on"][data-ax="caution"] .layer.on:not(#stinger):not(#scene):not(#strip):not(#card):not(#battle):not(#gwalk) > .inner{animation:axIn .5s cubic-bezier(.7,0,.2,1) backwards,axCau 1.6s .5s ease-in-out infinite}
@keyframes axIn{0%{clip-path:polygon(0 -80px,0 -80px,-120px calc(100% + 80px),-120px calc(100% + 80px));filter:brightness(2.4)}
  100%{clip-path:polygon(0 -80px,calc(100% + 200px) -80px,calc(100% + 80px) calc(100% + 80px),-120px calc(100% + 80px));filter:none}}
/* the tower: places gained streak up in gold, lost ones flicker red; the leader shines; a car on a run is on fire */
.row .fire-t{display:none}
:root[data-look="arcade"] .row.fire .fire-t{display:inline-block;flex:none;padding:3px 6px 2px;font:900 italic 12px/1 var(--num);letter-spacing:.04em;color:#1a0500;text-transform:uppercase;
  background:linear-gradient(90deg,#ff3b00,#ffb800,#ffe36b,#ff3b00);background-size:300% 100%;transform:skewX(-12deg)}
:root[data-look="arcade"][data-motion="on"] .row.fire .fire-t{animation:axFire 1s linear infinite}
@keyframes axFire{to{background-position:-150% 0}}
:root[data-look="arcade"][data-motion="on"] .row.lead::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 35%,rgba(255,236,150,.26) 48%,rgba(255,255,255,.1) 52%,transparent 64%) no-repeat;background-size:300% 100%;animation:axLead 3.4s linear infinite}
@keyframes axLead{from{background-position:130% 0}to{background-position:-40% 0}}
:root[data-look="arcade"] .row.flh{box-shadow:inset -3px 0 0 var(--fl)}
:root[data-look="arcade"][data-motion="on"] .row.flh .nm{animation:axFlGlow 2.2s ease-in-out infinite}
@keyframes axFlGlow{50%{text-shadow:0 0 12px var(--fl),0 0 2px var(--fl)}}
:root[data-look="arcade"]:not([data-motion="off"]) .row.mv-up::before{content:"";position:absolute;left:0;right:0;top:100%;height:70px;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 55%,transparent),transparent);animation:axStreak .9s ease-out both}
:root[data-look="arcade"]:not([data-motion="off"]) .row.mv-up .pos{animation:axPosUp .9s cubic-bezier(.2,1.6,.4,1)}
:root[data-look="arcade"]:not([data-motion="off"]) .row.mv-dn{animation:axDn .8s steps(1)}
@keyframes axStreak{from{opacity:1;transform:scaleY(1)}to{opacity:0;transform:scaleY(.2);transform-origin:top}}
@keyframes axPosUp{0%{transform:scale(1.9);color:#fff;text-shadow:0 0 18px var(--accent)}100%{transform:none}}
@keyframes axDn{0%,30%,60%{box-shadow:inset 0 0 0 2px #ff2a2a,0 0 16px rgba(255,42,42,.6)}15%,45%,100%{box-shadow:none}}
/* the battle: a meter filling as the gap closes, side by side, places swapped */
.bt-gap .ax-meter,.bt-gap .ax-swaps,.bt-gap .ax-sbs{display:none}
:root[data-look="arcade"] .bt-gap .ax-meter{display:block;width:150px;height:10px;margin-top:10px;background:rgba(255,255,255,.12);transform:skewX(-14deg);overflow:hidden}
:root[data-look="arcade"] .bt-gap .ax-meter i{display:block;height:100%;width:calc(var(--f,0) * 100%);background:var(--heat,#ffd400);box-shadow:0 0 12px var(--heat,#ffd400);transition:width .6s ease,background .6s}
:root[data-look="arcade"] #battle[data-heat="warm"]{--heat:#ff8a00}
:root[data-look="arcade"] #battle[data-heat="hot"]{--heat:#ff2a2a}
:root[data-look="arcade"][data-motion="on"] #battle[data-heat="hot"] .ax-meter i{animation:axHeat .5s ease-in-out infinite alternate}
@keyframes axHeat{to{filter:brightness(1.6)}}
:root[data-look="arcade"] .bt-gap .ax-swaps{display:block;margin-top:8px;font:900 italic 15px/1 var(--num);color:#19d9ff;letter-spacing:.06em;text-transform:uppercase}
