<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broadcast Overlay</title>
<!--
  PitWall broadcast overlay. Load it in OBS as a Browser Source, 1920 x 1080,
  over the iRacing capture:

      http://<relay>/broadcast/overlay.html?token=<view token>
      file:///.../broadcast/overlay.html?relay=ws://127.0.0.1:8765&token=<view token>

  Optional: &only=tower (or banner, battle, card, map, ticker, board) shows just
  that graphic, so each one can be its own OBS source and positioned there.

  What shows is decided by the producer panel (producer.html) through the
  relay's shared "gfx" state. Nothing here computes racing numbers: plain values
  come straight from iRacing through normalize.py, and anything under `derived`
  carries the dotted underline, as everywhere else in PitWall.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101824;            /* panel base: night-blue ink, reads over sky and tarmac alike */
  --panel:rgba(16,24,36,.93);
  --panel2:rgba(29,42,61,.96);
  --line:rgba(242,239,230,.09);
  --fg:#F2EFE6;             /* pit-board white */
  --mut:#98A5B8;
  --board:#F2EFE6;
  --amber:#F5B841;          /* derived values and the camera car */
  --purple:#A766FF;         /* fastest lap, the motorsport convention */
  --gain:#3FD08A; --lose:#FF5B5B;
  --flag-green:#2DBE60; --flag-yellow:#FFD23F; --flag-red:#E5383B; --flag-white:#F2EFE6; --flag-blue:#3A86FF;
  --cut:10px;
  --num:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --txt:"Barlow","Segoe UI",system-ui,sans-serif;
}
html,body{margin:0;background:transparent;overflow:hidden}
body{font-family:var(--txt);color:var(--fg);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.layer{position:absolute;opacity:0;transition:opacity .35s ease, transform .35s ease;pointer-events:none}
.layer.on{opacity:1}
.chamfer{clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.d{border-bottom:2px dotted var(--amber);padding-bottom:1px}
.mono{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- timing tower ---------- */
#tower{left:40px;top:40px;width:392px;transform:translateX(-12px)}
#tower.on{transform:none}
.t-head{background:var(--board);color:var(--ink);padding:10px 14px 8px;display:flex;align-items:flex-end;gap:10px}
.t-head .sess{font:800 30px/0.9 var(--num);letter-spacing:.01em}
.t-head .clock{margin-left:auto;font:700 22px/1 var(--num);font-variant-numeric:tabular-nums}
.t-flag{height:6px;background:var(--mut)}
.t-cols{display:flex;background:var(--panel2);color:var(--mut);font:600 13px/1 var(--txt);padding:6px 12px 6px 0}
.t-cols span:last-child{margin-left:auto}
.t-body{position:relative;background:var(--panel)}
.row{position:absolute;left:0;right:0;height:36px;display:flex;align-items:center;transition:transform .55s cubic-bezier(.2,.8,.2,1),background .3s;border-top:1px solid var(--line)}
.row .pos{width:42px;height:100%;display:grid;place-items:center;font:800 24px/1 var(--num);font-variant-numeric:tabular-nums}
.row .bar{width:5px;align-self:stretch}
.row .num{width:44px;text-align:right;font:700 18px/1 var(--num);color:var(--mut);font-variant-numeric:tabular-nums;padding-right:8px}
.row .nm{flex:1;min-width:0;font:700 22px/1 var(--num);letter-spacing:.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{font-weight:600;color:var(--mut);margin-right:4px}
.row .tag{font:700 13px/1 var(--txt);padding:3px 6px 2px;margin-right:6px;background:var(--fg);color:var(--ink)}
.row .tag.pit{background:var(--mut)}
.row .gap{width:86px;text-align:right;padding-right:12px;font:600 19px/1 var(--num);font-variant-numeric:tabular-nums}
.row .mv{width:14px;font:700 12px/1 var(--txt);text-align:center}
.row .mv.up{color:var(--gain)} .row .mv.dn{color:var(--lose)}
.row.cam{background:linear-gradient(90deg,rgba(245,184,65,.28),rgba(245,184,65,0) 70%)}
.row.cam .pos{background:var(--amber);color:var(--ink)}
.row.fl .nm{color:#D9C2FF}
.row.fl .bar{box-shadow:inset 0 0 0 2px var(--purple)}
.row.sep{height:14px;border:0}
.row.sep::after{content:"";margin:0 auto;width:60px;border-top:2px dotted var(--mut)}
.t-foot{height:8px;background:var(--panel2)}

/* ---------- session banner ---------- */
#banner{right:40px;top:40px;display:flex;align-items:stretch;transform:translateX(12px)}
#banner.on{transform:none}
.b-track{background:var(--panel);padding:10px 16px 8px;min-width:200px}
.b-track b{display:block;font:800 26px/1 var(--num);letter-spacing:.01em}
.b-track span{display:block;color:var(--mut);font:600 15px/1.3 var(--txt);margin-top:3px}
.b-state{background:var(--board);color:var(--ink);padding:10px 16px 8px;text-align:right;min-width:150px}
.b-state b{display:block;font:800 26px/1 var(--num);font-variant-numeric:tabular-nums}
.b-state span{display:block;font:600 15px/1.3 var(--txt);margin-top:3px}
.b-flag{width:14px}
.b-replay{background:var(--lose);color:#fff;font:800 22px/1 var(--num);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 14px;letter-spacing:.04em}
.b-replay small{font:600 15px/1.2 var(--txt);letter-spacing:0;margin-top:3px}

/* ---------- battle box ---------- */
#battle{left:50%;top:40px;width:600px;margin-left:-300px;transform:translateY(-14px)}
#battle.on{transform:none}
.bt-head{background:var(--amber);color:var(--ink);font:800 24px/1 var(--num);padding:8px 14px 6px;display:flex;align-items:baseline;gap:10px}
.bt-head small{font:600 15px/1 var(--txt);margin-left:auto}
.bt-car{display:flex;align-items:center;background:var(--panel);height:46px;border-top:1px solid var(--line)}
.bt-car .pos{width:50px;text-align:center;font:800 28px/1 var(--num)}
.bt-car .bar{width:5px;align-self:stretch}
.bt-car .num{width:54px;text-align:right;padding-right:10px;font:700 20px/1 var(--num);color:var(--mut)}
.bt-car .nm{flex:1;font:700 26px/1 var(--num);letter-spacing:.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-car .ll{width:120px;text-align:right;padding-right:14px;font:600 18px/1 var(--txt);color:var(--mut);font-variant-numeric:tabular-nums}
.bt-gap{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--panel2);height:30px;font:600 17px/1 var(--txt)}
.bt-gap b{font:800 22px/1 var(--num);font-variant-numeric:tabular-nums}
.bt-foot{background:var(--panel2);color:var(--mut);font:600 15px/1 var(--txt);padding:8px 14px;border-top:1px solid var(--line)}
.bt-foot .gain{color:var(--gain)} .bt-foot .lose{color:var(--lose)}

/* ---------- driver card (lower third) ---------- */
#card{left:470px;bottom:56px;width:840px;display:flex;transform:translateY(16px)}
#card.on{transform:none}
.c-num{width:132px;background:var(--board);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.c-num b{font:900 74px/0.85 var(--num);font-variant-numeric:tabular-nums}
.c-num span{font:700 16px/1 var(--txt);margin-top:6px}
.c-main{flex:1;background:var(--panel);min-width:0}
.c-top{padding:12px 18px 8px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line)}
.c-name{font:800 40px/0.95 var(--num);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name small{font-weight:600;color:var(--mut)}
.c-lic{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.c-lic .lic{font:700 15px/1 var(--txt);padding:4px 7px 3px;color:#fff}
.c-lic .ir{font:700 15px/1 var(--txt);padding:4px 7px 3px;background:var(--panel2)}
.c-sub{padding:7px 18px;color:var(--mut);font:600 16px/1.2 var(--txt);display:flex;gap:10px;align-items:center}
.c-sub .cls{padding:2px 7px;color:var(--ink);font-weight:700}
.c-stats{display:flex;background:var(--panel2)}
.c-stats div{flex:1 1 auto;padding:8px 14px 9px;border-right:1px solid var(--line);white-space:nowrap}
.c-stats div:last-child{border-right:0}
.c-stats span{display:block;color:var(--mut);font:600 13px/1 var(--txt)}
.c-stats b{display:block;font:700 24px/1.1 var(--num);font-variant-numeric:tabular-nums;margin-top:3px}

/* ---------- track map ---------- */
#map{right:40px;top:150px;width:360px;height:360px;transform:translateX(12px)}
#map.on{transform:none}
#map canvas{width:360px;height:360px;display:block}
.m-cap{position:absolute;left:0;right:0;bottom:-26px;text-align:right;font:600 13px/1 var(--txt);color:var(--mut);text-shadow:0 1px 2px #000}

/* ---------- race control ticker ---------- */
#ticker{right:40px;bottom:56px;width:470px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tk{display:flex;align-items:stretch;background:var(--panel);min-height:44px;width:100%;animation:tkIn .45s cubic-bezier(.2,.8,.2,1) both}
.tk.out{animation:tkOut .4s ease both}
.tk i{width:8px;flex:none;background:var(--mut)}
.tk.purple i{background:var(--purple)} .tk.lead i{background:var(--amber)} .tk.pit i{background:var(--mut)}
.tk.flag-green i{background:var(--flag-green)} .tk.flag-yellow i{background:var(--flag-yellow)} .tk.flag-red i{background:var(--flag-red)}
.tk.flag-white i{background:var(--flag-white)} .tk.inc i{background:var(--lose)} .tk.flag-blue i{background:var(--flag-blue)} .tk.wx i{background:#59C2E8}
.tk p{margin:0;padding:10px 14px 9px;font:600 18px/1.25 var(--txt)}
.tk p b{font:800 21px/1 var(--num);letter-spacing:.015em}
@keyframes tkIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes tkOut{to{opacity:0;transform:translateX(30px)}}

/* ---------- full standings board ---------- */
#board{left:50%;top:50%;width:1240px;margin-left:-620px;transform:translateY(calc(-50% + 16px))}
#board.on{transform:translateY(-50%)}
.bd-head{background:var(--board);color:var(--ink);padding:16px 22px 12px;display:flex;align-items:flex-end;gap:16px}
.bd-head b{font:900 46px/0.9 var(--num)}
.bd-head span{font:600 18px/1.2 var(--txt);margin-left:auto;text-align:right}
.bd-grid{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);column-gap:2px}
.bd-row{display:flex;align-items:center;height:38px;border-top:1px solid var(--line)}
.bd-row .pos{width:48px;text-align:center;font:800 24px/1 var(--num)}
.bd-row .bar{width:5px;align-self:stretch}
.bd-row .num{width:52px;text-align:right;padding-right:10px;font:700 18px/1 var(--num);color:var(--mut)}
.bd-row .nm{flex:1;min-width:0;font:700 22px/1 var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-row .v{width:104px;text-align:right;padding-right:16px;font:600 19px/1 var(--num);font-variant-numeric:tabular-nums}
.bd-row .v.m{color:var(--mut)}
.bd-row.fl .v.best{color:#D9C2FF}
.bd-cols{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);column-gap:2px}
.bd-cols div{display:flex;color:var(--mut);font:600 13px/1 var(--txt);padding:7px 0}
.bd-cols .sp{flex:1}.bd-cols .c{width:104px;text-align:right;padding-right:16px}
.bd-foot{height:10px;background:var(--panel2)}

/* setup note: only seen if the address is missing its token */
#setup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:24px 28px;max-width:640px;font:500 20px/1.45 var(--txt)}
#setup b{font:800 30px/1 var(--num);display:block;margin-bottom:8px}
#setup code{background:var(--panel2);padding:1px 6px}
@media (prefers-reduced-motion: reduce){.row,.layer,.tk{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <section class="layer" id="tower" aria-label="Timing tower">
    <div class="t-head chamfer" style="--cut:0px"><span class="sess" id="tSess">–</span><span class="clock" id="tClock"></span></div>
    <div class="t-flag" id="tFlag"></div>
    <div class="t-cols"><span style="width:47px"></span><span>Driver</span><span id="tColLabel" style="padding-right:0">Interval</span></div>
    <div class="t-body" id="tBody"></div>
    <div class="t-foot chamfer"></div>
  </section>

  <section class="layer" id="banner" aria-label="Session">
    <div class="b-flag" id="bFlag"></div>
    <div class="b-track"><b id="bTrack">–</b><span id="bCfg"></span></div>
    <div class="b-state chamfer"><b id="bMain">–</b><span id="bSub"></span></div>
    <div class="b-replay hide" id="bReplay">Replay</div>
  </section>

  <section class="layer" id="battle" aria-label="Battle">
    <div class="bt-head"><span id="btTitle">Battle</span><small id="btLap"></small></div>
    <div id="btCars"></div>
    <div class="bt-foot chamfer" id="btFoot"></div>
  </section>

  <section class="layer" id="card" aria-label="Driver">
    <div class="c-num"><b id="cNum">–</b><span id="cPos"></span></div>
    <div class="c-main chamfer">
      <div class="c-top"><div class="c-name" id="cName">–</div><div class="c-lic" id="cLic"></div></div>
      <div class="c-sub" id="cSub"></div>
      <div class="c-stats" id="cStats"></div>
    </div>
  </section>

  <section class="layer" id="map" aria-label="Track map"><canvas id="mapCv" width="720" height="720"></canvas><div class="m-cap" id="mapCap"></div></section>

  <section class="layer on" id="ticker" aria-label="Race control"></section>

  <section class="layer" id="board" aria-label="Standings">
    <div class="bd-head"><b id="bdTitle">Standings</b><span id="bdSub"></span></div>
    <div class="bd-cols" id="bdCols"></div>
    <div class="bd-grid" id="bdGrid"></div>
    <div class="bd-foot chamfer"></div>
  </section>

  <div id="setup" class="hide"><b>Overlay needs a token</b>Add the relay's view token to this page's address, for example <code>?token=…</code>, and <code>&amp;relay=ws://127.0.0.1:8765</code> when the page is opened from a file.</div>
</div>

<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const ONLY = Q.get("only");
  const S = { session: null, map: null, state: null, cars: null, feed: { ready: false, seq: 0 }, gfx: {} };

  // ---------------------------------------------------------------- stage scale
  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080) || 1;
    $("stage").style.transform = `scale(${k})`;
  }
  addEventListener("resize", fit); fit();

  // ---------------------------------------------------------------- helpers
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = v => v == null ? "" : String(v).replace(/[&<>"']/g, ch => ESC[ch]);
  const D = txt => `<span class="d">${txt}</span>`;      // derived: computed in normalize.py
  function merge(into, from) {
    for (const k of Object.keys(from)) {
      const v = from[k];
      if (v && typeof v === "object" && !Array.isArray(v) && into[k] && typeof into[k] === "object" && !Array.isArray(into[k])) merge(into[k], v);
      else into[k] = v;
    }
    return into;
  }
  const fmt = {
    lap(s) { if (s == null || !(s > 0)) return "–"; const m = Math.floor(s / 60), r = s - m * 60;
      return (m ? m + ":" + (r < 10 ? "0" : "") : "") + r.toFixed(3); },
    gap(s) { if (s == null) return "–"; return "+" + (Math.abs(s) < 60 ? s.toFixed(Math.abs(s) < 10 ? 3 : 1) : fmt.lap(s)); },
    clock(s) { if (s == null || s < 0 || s > 86400 * 3) return ""; s = Math.floor(s);
      const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
      return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); },
  };
  const classCss = v => v == null ? null : "#" + (Number(v) & 0xFFFFFF).toString(16).padStart(6, "0");
  // "Max Verstappen" -> {first:"Max", last:"Verstappen"}. iRacing gives one
  // UserName string; middle names and suffixes stay with the surname.
  function splitName(n) {
    const p = String(n || "").trim().split(/\s+/);
    if (p.length < 2) return { first: "", last: p[0] || "" };
    return { first: p[0], last: p.slice(1).join(" ") };
  }
  const allCars = () => S.cars && S.cars.cars ? Object.values(S.cars.cars) : [];
  const carByIdx = i => i == null ? null : allCars().find(c => c.idx === i) || null;
  function isMulticlass() {
    const ids = new Set(allCars().filter(c => c.pos > 0).map(c => c.classId));
    ids.delete(null); ids.delete(undefined);
    return ids.size > 1;
  }
  const isRace = () => !!(S.cars && S.cars.derived && S.cars.derived.isRace);
  const camIdx = () => S.state && S.state.camera ? S.state.camera.carIdx : null;
  function sessionRow() {
    const st = S.state; if (!st || !S.session) return null;
    return (S.session.sessions || []).find(x => x.SessionNum === st.session.num) || null;
  }
  // Racing flags only. SessionFlags also carries start-light and car-service
  // bits (start_hidden, servicible, repair); those are not something to put on
  // air as a flag.
  const FLAG_PRIO = ["red", "checkered", "white", "caution", "yellow", "blue", "green"];
  function racingFlag() {
    const f = (S.state && S.state.session.flags) || [];
    return FLAG_PRIO.find(x => f.includes(x) || f.includes(x + "_waving")) || null;
  }
  const FLAG_COLOR = { red: "var(--flag-red)", checkered: "repeating-linear-gradient(90deg,#fff 0 8px,#111 8px 16px)",
    white: "var(--flag-white)", caution: "var(--flag-yellow)", yellow: "var(--flag-yellow)", blue: "var(--flag-blue)", green: "var(--flag-green)" };

  // gfx state with defaults. The producer only sends what it changes.
  function G(path, dflt) {
    let v = S.gfx;
    for (const k of path.split(".")) { if (v == null || typeof v !== "object") return dflt; v = v[k]; }
    return v === undefined ? dflt : v;
  }
  const DEFAULT_ON = { tower: true, banner: true, ticker: true, card: true, map: false, battle: false, board: false };
  function shown(name) {
    if (ONLY && ONLY !== name) return false;
    return !!G(name + ".show", DEFAULT_ON[name]);
  }

  // ---------------------------------------------------------------- tower
  const TOWER_ROW = 36;
  const prevPos = {}, moveAt = {};
  function towerRows() {
    const cls = G("tower.class", null);
    let cars = allCars().filter(c => c.pos > 0);
    if (cls != null) cars = cars.filter(c => c.classId === cls && c.classPos > 0).sort((a, b) => a.classPos - b.classPos);
    else cars.sort((a, b) => a.pos - b.pos);
    const max = Math.max(6, Math.min(40, G("tower.rows", 20)));
    if (cars.length <= max) return cars;
    // Keep the camera car on the tower: top of the order, then the cars around it.
    const ci = cars.findIndex(c => c.idx === camIdx());
    if (ci < max - 1) return cars.slice(0, max);
    const around = 4, top = max - around - 1;
    const lo = Math.max(top, Math.min(ci - 1, cars.length - around));
    return [...cars.slice(0, top), { sep: true }, ...cars.slice(lo, lo + around)];
  }
  function towerValue(c, mode) {
    const d = c.derived || {};
    switch (mode) {
      case "leader": return isRace() && c.gapValid ? (c.f2TimeS > 0 ? fmt.gap(c.f2TimeS) : "Leader") : "–";
      case "best": return fmt.lap(c.bestLapS);
      case "last": return fmt.lap(c.lastLapS);
      case "stops": return d.stopsSeen != null ? D(String(d.stopsSeen)) : "–";
      case "incidents": return c.incidents != null && c.incidents >= 0 ? c.incidents + "x" : "–";
      default:
        if (!isRace()) return fmt.lap(c.bestLapS);
        if (c.gapValid && !(c.f2TimeS > 0)) return "Leader";
        return d.intervalS != null ? D(fmt.gap(d.intervalS)) : "–";
    }
  }
  const MODE_LABEL = { interval: "Interval", leader: "Gap", best: "Best lap", last: "Last lap", stops: "Stops seen", incidents: "Incidents" };
  function fastestIdx(cars) {
    let best = null;
    for (const c of cars) if (c.bestLapS > 0 && (!best || c.bestLapS < best.bestLapS)) best = c;
    return best ? best.idx : null;
  }
  function renderTower() {
    const el = $("tower"); el.classList.toggle("on", shown("tower") && !!S.cars);
    if (!S.cars) return;
    const sess = sessionRow();
    const cls = G("tower.class", null);
    const clsCar = cls != null ? allCars().find(c => c.classId === cls) : null;
    $("tSess").textContent = (clsCar && clsCar.className ? clsCar.className + " " : "") + (sess ? sess.SessionType : "Session");
    const st = S.state && S.state.session;
    const lr = st && st.lapsRemain;
    $("tClock").textContent = st ? (lr != null && lr < 32767 && isRace() ? (lr === 0 ? "Final lap" : lr + " to go") : fmt.clock(st.timeRemainS)) : "";
    const f = racingFlag();
    $("tFlag").style.background = f ? FLAG_COLOR[f] : "var(--mut)";
    let mode = G("tower.mode", "interval");
    if (!isRace() && (mode === "interval" || mode === "leader")) mode = "best";
    $("tColLabel").textContent = MODE_LABEL[mode] || "";
    const rows = towerRows();
    const multi = isMulticlass();
    const fl = fastestIdx(cls != null ? allCars().filter(c => c.classId === cls) : allCars());
    const cam = camIdx(), now = performance.now();
    const body = $("tBody");
    body.style.height = rows.reduce((h, r) => h + (r.sep ? 14 : TOWER_ROW), 0) + "px";
    const seen = new Set();
    let y = 0;
    for (const r of rows) {
      if (r.sep) {
        let s = body.querySelector(".row.sep");
        if (!s) { s = document.createElement("div"); s.className = "row sep"; body.appendChild(s); }
        s.style.transform = `translateY(${y}px)`; seen.add(s); y += 14; continue;
      }
      const key = "r" + r.idx;
      let row = body.querySelector(`[data-k="${key}"]`);
      if (!row) {
        row = document.createElement("div"); row.className = "row"; row.dataset.k = key;
        row.innerHTML = '<div class="pos"></div><div class="bar"></div><div class="num"></div><div class="nm"></div><span class="tag hide"></span><div class="mv"></div><div class="gap"></div>';
        row.style.transform = `translateY(${y}px)`;
        body.appendChild(row);
      }
      const p = cls != null ? r.classPos : r.pos;
      if (prevPos[r.idx] != null && prevPos[r.idx] !== p) moveAt[r.idx] = { at: now, up: p < prevPos[r.idx] };
      prevPos[r.idx] = p;
      const mv = moveAt[r.idx] && now - moveAt[r.idx].at < 6000 ? moveAt[r.idx] : null;
      row.querySelector(".pos").textContent = p;
      row.querySelector(".bar").style.background = multi && cls == null ? (classCss(r.classColor) || "transparent") : "transparent";
      row.querySelector(".num").textContent = r.num != null ? "#" + r.num : "";
      const n = splitName(r.name);
      row.querySelector(".nm").innerHTML = (n.first ? `<small>${esc(n.first[0])}.</small>` : "") + esc(n.last || "car " + r.idx);
      const tag = row.querySelector(".tag");
      const inPit = !!r.onPitRoad;
      tag.classList.toggle("hide", !inPit); tag.classList.toggle("pit", inPit); tag.textContent = inPit ? "PIT" : "";
      const mvEl = row.querySelector(".mv"); mvEl.className = "mv" + (mv ? (mv.up ? " up" : " dn") : ""); mvEl.textContent = mv ? (mv.up ? "▲" : "▼") : "";
      row.querySelector(".gap").innerHTML = towerValue(r, mode);
      row.classList.toggle("cam", r.idx === cam);
      row.classList.toggle("fl", r.idx === fl);
      row.style.transform = `translateY(${y}px)`;
      seen.add(row); y += TOWER_ROW;
    }
    for (const el2 of [...body.children]) if (!seen.has(el2)) el2.remove();
  }

  // ---------------------------------------------------------------- banner
  function renderBanner() {
    const on = shown("banner") && !!S.state;
    $("banner").classList.toggle("on", on);
    if (!S.state) return;
    const t = S.session && S.session.track;
    if (t) {
      $("bTrack").textContent = t.TrackDisplayShortName || t.TrackDisplayName || t.TrackName || "";
      $("bCfg").textContent = t.TrackConfigName || "";
    }
    const st = S.state.session, sess = sessionRow();
    const lr = st.lapsRemain, f = racingFlag();
    if (f === "checkered") { $("bMain").textContent = "Finish"; }
    else if (isRace() && lr != null && lr < 32767) $("bMain").textContent = lr === 0 ? "Final lap" : lr + (lr === 1 ? " lap" : " laps");
    else $("bMain").textContent = fmt.clock(st.timeRemainS) || "–";
    const flagWord = f ? (f === "caution" ? "Full course yellow" : f[0].toUpperCase() + f.slice(1) + " flag") : "";
    $("bSub").textContent = flagWord || (sess ? sess.SessionType : "");
    $("bFlag").style.background = f ? FLAG_COLOR[f] : "var(--mut)";
    // Spectating is a replay at speed 1. Anything else means the picture is not
    // the race as it happens, and the audience should be told.
    const cam = S.state.camera || {};
    const sp = cam.replaySpeed;
    // Playing at normal speed but behind the live race (the producer jumped to
    // an incident) is a replay too; liveEdge says so (normalize.live_edge).
    const le = S.state.derived && S.state.derived.liveEdge;
    const behind = (sp != null && (sp !== 1 || cam.replaySlowMotion)) || (le && le.atLive === false);
    const rp = $("bReplay");
    rp.classList.toggle("hide", !behind);
    if (behind) {
      const what = G("replay.label", "");
      const mode = sp === 0 ? "Paused" : cam.replaySlowMotion ? "Slow-mo" : sp < 0 ? "Rewind" : sp > 1 ? "Replay " + sp + "x" : "Replay";
      rp.innerHTML = esc(mode) + (what ? `<small>${esc(what)}</small>` : "");
    }
  }

  // ---------------------------------------------------------------- battle
  function currentBattle() {
    const list = (S.cars && S.cars.derived && S.cars.derived.battles) || [];
    if (!list.length) return null;
    if (G("battle.mode", "auto") === "pick") {
      const want = G("battle.cars", []) || [];
      // A battle keeps its identity by its cars, not its id: the id follows the
      // car at the front, which changes with every pass for the lead of it.
      return list.find(b => want.length && want.every(i => b.cars.includes(i))) ||
             list.find(b => want.some(i => b.cars.includes(i))) || null;
    }
    const cls = G("tower.class", null);
    return list.find(b => cls == null || b.classId === cls) || null;
  }
  function renderBattle() {
    const b = currentBattle();
    $("battle").classList.toggle("on", shown("battle") && !!b);
    if (!b) return;
    const lead = carByIdx(b.cars[0]);
    const multi = isMulticlass();
    $("btTitle").textContent = "Battle for " + (multi && lead && lead.className ? lead.className + " " : "") + "P" + b.forClassPos;
    $("btLap").textContent = lead && lead.lap != null ? "Lap " + lead.lap : "";
    let h = "";
    b.cars.forEach((i, k) => {
      const c = carByIdx(i); if (!c) return;
      if (k > 0) {
        const g = b.gapsS[k - 1];
        h += `<div class="bt-gap"><span>gap</span><b>${D(g.toFixed(3))}</b><span>s</span></div>`;
      }
      const n = splitName(c.name);
      h += `<div class="bt-car"><div class="pos">${esc(multi ? c.classPos : c.pos)}</div>` +
           `<div class="bar" style="background:${multi ? classCss(c.classColor) : "transparent"}"></div>` +
           `<div class="num">#${esc(c.num ?? "")}</div><div class="nm">${esc(n.first ? n.first[0] + ". " : "")}${esc(n.last)}</div>` +
           `<div class="ll">${c.lastLapS > 0 ? "last " + fmt.lap(c.lastLapS) : ""}</div></div>`;
    });
    $("btCars").innerHTML = h;
    // Trend of the car at the back on the car in front of it, when that pair is
    // also adjacent overall (otherwise normalize.py leaves it null).
    const k = b.closingSPerLap.length - 1;
    const rate = k >= 0 ? b.closingSPerLap[k] : null, laps = k >= 0 ? b.catchLaps[k] : null;
    let foot = "";
    if (rate != null) {
      if (rate > 0) foot = `<span class="gain">${D("Closing " + rate.toFixed(2) + " s a lap")}</span>` + (laps != null && laps > 0.5 ? ` · ${D("on the gearbox in about " + Math.max(1, Math.round(laps)) + (Math.round(laps) === 1 ? " lap" : " laps"))}` : "");
      else if (rate < 0) foot = `<span class="lose">${D("Gap growing " + Math.abs(rate).toFixed(2) + " s a lap")}</span>`;
      else foot = D("Gap holding steady");
    } else foot = b.cars.length > 2 ? `${b.cars.length} cars within a second of each other` : "Within a second";
    $("btFoot").innerHTML = foot;
  }

  // ---------------------------------------------------------------- driver card
  function cardCar() {
    if (G("card.follow", "camera") === "pinned") { const c = carByIdx(G("card.idx", null)); if (c) return c; }
    return carByIdx(camIdx());
  }
  function renderCard() {
    const c = cardCar();
    $("card").classList.toggle("on", shown("card") && !!c);
    if (!c) return;
    const multi = isMulticlass();
    $("cNum").textContent = c.num ?? "–";
    $("cPos").textContent = c.pos > 0 ? (multi ? "P" + c.classPos + " in class" : "P" + c.pos) : "";
    const n = splitName(c.name);
    $("cName").innerHTML = (n.first ? `<small>${esc(n.first)} </small>` : "") + esc(n.last);
    const lic = c.licString ? `<span class="lic" style="background:${classCss(c.licColor) || "var(--panel2)"}">${esc(c.licString)}</span>` : "";
    const ir = c.iRating ? `<span class="ir">${esc(c.iRating)} iR</span>` : "";
    $("cLic").innerHTML = lic + ir;
    const team = c.team && c.team !== c.name ? esc(c.team) : "";
    const clsChip = multi && c.className ? `<span class="cls" style="background:${classCss(c.classColor)}">${esc(c.className)}</span>` : "";
    $("cSub").innerHTML = [clsChip, esc(c.car || ""), team].filter(Boolean).join(" ");
    const d = c.derived || {};
    const stats = [
      ["Position", c.pos > 0 ? "P" + c.pos : "–"],
      ["Last lap", fmt.lap(c.lastLapS)],
      ["Best lap", fmt.lap(c.bestLapS)],
    ];
    if (isRace()) {
      stats.push(["Stint", d.stintLaps != null ? D(d.stintLaps + (d.stintLaps === 1 ? " lap" : " laps")) : "–"]);
      stats.push(["Stops seen", d.stopsSeen != null ? D(String(d.stopsSeen)) : "–"]);
    } else if (d.theoreticalBestS != null) {
      stats.push(["Best sectors", D(fmt.lap(d.theoreticalBestS))]);
    }
    // iRacing's own count, from the session info. Shown against the limit when
    // the session has one; hidden when the count is not published.
    if (c.incidents != null && c.incidents >= 0) {
      const lim = S.session && S.session.options ? parseInt(S.session.options.IncidentLimit, 10) : NaN;
      stats.push(["Incidents", c.incidents + "x" + (lim > 0 ? `<small style="font-size:17px;color:var(--mut);font-weight:600"> / ${lim}</small>` : "")]);
    }
    if (c.onPitRoad) stats[0][1] += " · pit";
    $("cStats").innerHTML = stats.map(([k, v]) => `<div><span>${esc(k)}</span><b>${v}</b></div>`).join("");
  }

  // ---------------------------------------------------------------- map
  const cv = $("mapCv"), ctx = cv.getContext("2d");
  function drawMap() {
    const on = shown("map") && !!S.cars;
    $("map").classList.toggle("on", on);
    if (!on) return;
    const W = 720, pad = 40, size = W - pad * 2;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, W);
    const pts = S.map && S.map.points;
    const P = pct => {
      pct = ((pct % 1) + 1) % 1;
      if (pts) { const n = pts.length, f = pct * n, i = Math.floor(f) % n, j = (i + 1) % n, r = f - Math.floor(f);
        return [pad + (pts[i][0] + (pts[j][0] - pts[i][0]) * r) * size, pad + (pts[i][1] + (pts[j][1] - pts[i][1]) * r) * size]; }
      const a = pct * Math.PI * 2 - Math.PI / 2; return [W / 2 + Math.cos(a) * size / 2, W / 2 + Math.sin(a) * size / 2];
    };
    ctx.lineJoin = ctx.lineCap = "round";
    const path = () => { ctx.beginPath(); for (let k = 0; k <= 400; k++) { const [x, y] = P(k / 400); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } };
    path(); ctx.strokeStyle = "rgba(16,24,36,.88)"; ctx.lineWidth = 26; ctx.stroke();
    path(); ctx.strokeStyle = "#F2EFE6"; ctx.lineWidth = 7; ctx.stroke();
    const [sx, sy] = P(0); ctx.fillStyle = "#F5B841"; ctx.fillRect(sx - 4, sy - 16, 8, 32);
    $("mapCap").textContent = pts ? "" : "Track outline appears after one clean lap; cars placed by lap distance";
    const multi = isMulticlass(), cam = camIdx();
    const bt = currentBattle(), btSet = new Set(bt && shown("battle") ? bt.cars : []);
    const cars = allCars().filter(c => c.pct != null && c.pct >= 0 && c.surface !== "not_in_world" && c.pos > 0)
      .sort((a, b) => (a.idx === cam) - (b.idx === cam) || b.pos - a.pos);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const c of cars) {
      const [x, y] = P(c.pct), big = c.idx === cam || btSet.has(c.idx);
      ctx.beginPath(); ctx.arc(x, y, big ? 21 : 14, 0, 7);
      ctx.fillStyle = c.onPitRoad ? "#5A6784" : multi ? (classCss(c.classColor) || "#98A5B8") : "#98A5B8";
      ctx.fill();
      ctx.lineWidth = big ? 5 : 2.5; ctx.strokeStyle = c.idx === cam ? "#F5B841" : btSet.has(c.idx) ? "#F2EFE6" : "#101824"; ctx.stroke();
      ctx.fillStyle = "#101824"; ctx.font = `800 ${big ? 22 : 17}px "Big Shoulders Display", sans-serif`;
      ctx.fillText(String(multi ? c.classPos : c.pos), x, y + 1);
    }
  }

  // ---------------------------------------------------------------- ticker
  // Only race-wide news. Events about "your" car (incidents, position, engine,
  // closing on you) are the driver's, and a spectator has none.
  const TICK_KINDS = new Set(["fastest_lap", "class_lead", "pit_in", "pit_out", "flag", "rain_start", "rain_stop", "declared_wet", "car_incident"]);
  const queue = [];
  function carName(i) { const c = carByIdx(i); if (!c) return "Car " + esc(i); const n = splitName(c.name);
    return `<b>${esc(n.first ? n.first[0] + ". " : "")}${esc(n.last)}</b>`; }
  function tickerItem(e) {
    const c = carByIdx(e.idx), multi = isMulticlass();
    const cls = multi && c && c.className ? esc(c.className) + " " : "";
    switch (e.kind) {
      case "fastest_lap":
        if (!e.overall && !multi) return null;
        return ["purple", `${carName(e.idx)} sets the fastest ${e.overall ? "" : cls}lap: <b>${fmt.lap(e.lapS)}</b>`];
      case "class_lead": return ["lead", `${carName(e.idx)} takes the ${multi ? cls : ""}lead`];
      case "pit_in": return isRace() ? ["pit", `${carName(e.idx)} pits`] : null;
      case "pit_out": return isRace() ? ["pit", `${carName(e.idx)} rejoins` + (e.stationaryS != null ? `, ${D(e.stationaryS.toFixed(1) + " s")} stationary` : "")] : null;
      case "flag": {
        const f = e.flag; const cls2 = { green: "flag-green", yellow: "flag-yellow", caution: "flag-yellow", red: "flag-red", white: "flag-white", checkered: "flag-white", blue: "flag-blue" }[f];
        if (!cls2 || f === "blue") return null;
        const word = { green: "Green flag", yellow: "Yellow flag", caution: "Full course yellow", red: "Red flag", white: "White flag: final lap", checkered: "Chequered flag" }[f];
        return [cls2, `<b>${word}</b>`];
      }
      case "rain_start": return ["wx", "Rain is falling"];
      case "rain_stop": return ["wx", "The rain has stopped"];
      case "declared_wet": return ["wx", e.value ? "Wet race declared" : "Wet declaration lifted"];
      case "car_incident": {
        // 2x and up only: 1x offs would bury everything else. The cause is
        // named only when the rise matches a single entry in iRacing's table.
        if (!(e.points >= 2)) return null;
        const cause = e.single && e.causes.length === 1 ? ` · ${esc(e.causes[0])}` : "";
        return ["inc", `${carName(e.idx)} +${esc(e.points)}x incident${cause}`];
      }
    }
    return null;
  }
  function pushTick(e) {
    if (!TICK_KINDS.has(e.kind)) return;
    if ((e.kind === "pit_in" || e.kind === "pit_out") && !G("ticker.pits", true)) return;
    if (e.kind === "car_incident" && !G("ticker.incidents", true)) return;
    const it = tickerItem(e); if (it) queue.push(it);
  }
  function pumpTicker() {
    const box = $("ticker");
    box.classList.toggle("on", shown("ticker"));
    const live = [...box.querySelectorAll(".tk:not(.out)")];
    const now = performance.now();
    for (const el of live) if (now - el._at > 7000) { el.classList.add("out"); setTimeout(() => el.remove(), 450); }
    if (queue.length && box.querySelectorAll(".tk:not(.out)").length < 3) {
      const [cls, html] = queue.shift();
      const el = document.createElement("div"); el.className = "tk chamfer " + cls; el._at = now;
      el.innerHTML = `<i></i><p>${html}</p>`;
      box.appendChild(el);
    }
    if (queue.length > 8) queue.splice(0, queue.length - 8);
  }
  function handleFeed(m) {
    if (m.full) {
      // History is not news. Only what happens after the overlay is on air.
      const first = !S.feed.ready;
      if (!first) for (const e of m.events || []) if (e.seq > S.feed.seq) pushTick(e);
      S.feed = { ready: true, seq: m.seq || 0 };
      return;
    }
    if (!S.feed.ready) return;
    for (const e of m.events || []) if (e.seq > S.feed.seq) pushTick(e);
    S.feed.seq = Math.max(S.feed.seq, m.seq || 0);
  }

  // ---------------------------------------------------------------- board
  function renderBoard() {
    const on = shown("board") && !!S.cars;
    $("board").classList.toggle("on", on);
    if (!on) return;
    const cls = G("board.class", G("tower.class", null));
    let cars = allCars().filter(c => c.pos > 0);
    if (cls != null) cars = cars.filter(c => c.classId === cls).sort((a, b) => a.classPos - b.classPos);
    else cars.sort((a, b) => a.pos - b.pos);
    cars = cars.slice(0, 40);
    const sess = sessionRow(), t = S.session && S.session.track, multi = isMulticlass() && cls == null;
    const clsCar = cls != null ? cars[0] : null;
    $("bdTitle").textContent = (clsCar && clsCar.className ? clsCar.className + " " : "") + (sess ? sess.SessionType : "Standings");
    $("bdSub").textContent = t ? (t.TrackDisplayName || "") + (t.TrackConfigName ? " – " + t.TrackConfigName : "") : "";
    const race = isRace(), fl = fastestIdx(cars);
    const cols = race ? ["Gap", "Best lap"] : ["Best lap", "Last lap"];
    const colHtml = `<div><span style="width:105px"></span><span class="sp">Driver</span><span class="c">${cols[0]}</span><span class="c">${cols[1]}</span></div>`;
    $("bdCols").innerHTML = colHtml + (cars.length > 20 ? colHtml : "<div></div>");
    $("bdGrid").style.gridTemplateColumns = cars.length > 20 ? "1fr 1fr" : "1fr";
    $("bdCols").style.gridTemplateColumns = cars.length > 20 ? "1fr 1fr" : "1fr";
    const half = cars.length > 20 ? Math.ceil(cars.length / 2) : cars.length;
    const cell = c => {
      const n = splitName(c.name);
      const p = cls != null ? c.classPos : c.pos;
      const v1 = race ? (c.gapValid ? (c.f2TimeS > 0 ? fmt.gap(c.f2TimeS) : "Leader") : "–") : fmt.lap(c.bestLapS);
      const v2 = race ? fmt.lap(c.bestLapS) : fmt.lap(c.lastLapS);
      return `<div class="bd-row${c.idx === fl ? " fl" : ""}"><div class="pos">${esc(p)}</div>` +
        `<div class="bar" style="background:${multi ? classCss(c.classColor) : "transparent"}"></div>` +
        `<div class="num">#${esc(c.num ?? "")}</div><div class="nm">${esc(n.first ? n.first[0] + ". " : "")}${esc(n.last)}${c.onPitRoad ? ' <span style="color:var(--mut);font-size:16px">pit</span>' : ""}</div>` +
        `<div class="v${race ? "" : " best"}">${v1}</div><div class="v m${race ? " best" : ""}">${v2}</div></div>`;
    };
    // Column-major: the first half down the left, the rest down the right.
    const left = cars.slice(0, half), right = cars.slice(half);
    let h = "";
    for (let k = 0; k < half; k++) { h += cell(left[k]); if (cars.length > 20) h += right[k] ? cell(right[k]) : "<div></div>"; }
    $("bdGrid").innerHTML = h;
  }

  // ---------------------------------------------------------------- connection
  function relayUrl() {
    const q = Q.get("relay");
    if (q) return q;
    if (location.protocol === "http:" || location.protocol === "https:") return (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
    return "ws://127.0.0.1:8765";
  }
  let ws = null;
  function connect() {
    const token = Q.get("token");
    if (!token) { $("setup").classList.remove("hide"); return; }
    let url;
    try { url = new URL(relayUrl().replace(/\/+$/, "") + "/view"); } catch (e) { return; }
    url.searchParams.set("token", token);
    const sock = new WebSocket(url.href);
    ws = sock;
    sock.onopen = () => sock.send(JSON.stringify({ type: "resend" }));
    sock.onclose = ev => {
      if (ev.code === 4001) { $("setup").classList.remove("hide"); $("setup").firstChild.textContent = "The relay refused this token"; return; }
      setTimeout(connect, ev.code === 4002 ? 200 : 3000);
    };
    sock.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      try { handle(m); } catch (e) { console.error("overlay: could not render " + m.type, e); }
    };
  }
  let dirty = true;
  function handle(m) {
    switch (m.type) {
      case "session": S.session = m; break;
      case "map": S.map = m; break;
      case "state": if (!m.full && !S.state) return; S.state = m.full ? m : merge(S.state, m); break;
      case "cars": if (!m.full && !S.cars) return; S.cars = m.full ? m : merge(S.cars, m); break;
      case "feed": handleFeed(m); break;
      case "gfx": S.gfx = m.state || {}; break;
      default: return;
    }
    dirty = true;
  }
  // Rendering is paced here rather than per message: cars arrive at 8 Hz and
  // state at 15 Hz, and OBS gains nothing from repainting the tower twice per frame.
  let last = 0;
  function frame(t) {
    if (dirty && t - last > 100) {
      dirty = false; last = t;
      renderTower(); renderBanner(); renderBattle(); renderCard(); renderBoard(); drawMap();
    }
    pumpTicker();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setInterval(() => { dirty = true; }, 1000);   // position arrows expire on time, not on data
  connect();
})();
</script>
</body>
</html>
