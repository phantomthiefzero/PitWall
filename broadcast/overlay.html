:root[data-look="arcade"] #battle.sbs .bt-gap .ax-sbs{display:block;margin-top:8px;padding:4px 8px 3px;background:#ff2a2a;color:#fff;font:900 italic 16px/1 var(--num);text-transform:uppercase;transform:skewX(-12deg)}
:root[data-look="arcade"][data-motion="on"] #battle.sbs .bt-gap .ax-sbs{animation:mBlink .6s steps(1) infinite}
:root[data-look="arcade"][data-motion="on"] #battle.sbs .bt-cars{animation:axShake .32s linear infinite}
@keyframes axShake{0%,100%{translate:0 0}25%{translate:2px -1px}50%{translate:-2px 1px}75%{translate:1px 1px}}
:root[data-look="arcade"]:not([data-motion="off"]) .bt-cars.ax-swap .bt-car{animation:axSpin .75s cubic-bezier(.3,1.3,.5,1)}
@keyframes axSpin{0%{transform:perspective(600px) rotateY(180deg);filter:brightness(2)}100%{transform:none;filter:none}}
/* the driver card: places made up and a clean-lap streak, which shatters when it ends */
#card .ax-badges{display:none}
:root[data-look="arcade"] #card .ax-badges{display:flex;position:absolute;right:70px;top:-34px;gap:8px;z-index:3}
.ax-badges em{font:900 italic 20px/1 var(--num);padding:5px 10px 4px;transform:skewX(-12deg);font-style:italic;text-transform:uppercase;white-space:nowrap}
.ax-badges .up{color:#06120a;background:linear-gradient(180deg,#9dffbf,#1fe07a)}
.ax-badges .st{color:#000;background:linear-gradient(180deg,#fff3b0,#ffc21a)}
.ax-badges .gone{color:#fff;background:#ff2a2a}
:root[data-look="arcade"]:not([data-motion="off"]) .ax-badges .gone{animation:axShatter 2.2s ease-in both}
:root[data-look="arcade"]:not([data-motion="off"]) .ax-badges em.new{animation:axStamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes axShatter{0%,45%{clip-path:none;opacity:1;transform:skewX(-12deg)}55%{clip-path:polygon(0 0,40% 0,30% 50%,45% 100%,0 100%,0 0,60% 0,100% 0,100% 100%,55% 100%,70% 45%);transform:skewX(-12deg) scale(1.08);filter:brightness(1.8);opacity:1}
  100%{clip-path:polygon(0 0,40% 0,30% 50%,45% 100%,0 100%,0 0,60% 0,100% 0,100% 100%,55% 100%,70% 45%);opacity:0;transform:skewX(-12deg) translateY(30px) rotate(6deg)}}
@keyframes axStamp{0%{transform:skewX(-12deg) scale(2.4);opacity:0;filter:blur(4px)}100%{transform:skewX(-12deg);opacity:1;filter:none}}
/* show screens: the field racing past on a diagonal, the countdown in chrome; the podium rising under spotlights;
   the grid walk's slot stamped in piece by piece */
.sc-ax{display:none}
:root[data-look="arcade"] #scene .sc-ax{display:block;position:absolute;inset:-200px;transform:rotate(-12deg);opacity:.16;pointer-events:none;overflow:hidden}
.sc-ax div{white-space:nowrap;font:900 italic 64px/1.25 var(--num);text-transform:uppercase;color:#fff;-webkit-text-stroke:1px rgba(255,255,255,.3)}
.sc-ax div:nth-child(odd){color:transparent}
:root[data-look="arcade"]:not([data-motion="off"]) .sc-ax div{animation:axCrawl 28s linear infinite}
:root[data-look="arcade"]:not([data-motion="off"]) .sc-ax div:nth-child(even){animation-direction:reverse;animation-duration:34s}
@keyframes axCrawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
:root[data-look="arcade"] .sc-cd{font:900 italic 150px/1 var(--num);color:transparent;background:var(--chrome);-webkit-background-clip:text;background-clip:text;padding-right:8px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.5))}
:root[data-look="arcade"] .sc-cd small{display:block;margin:0 0 8px;color:var(--accent);-webkit-text-fill-color:var(--accent);font:900 italic 30px/1 var(--num);letter-spacing:.16em}
:root[data-look="arcade"] .pd-b{position:relative;overflow:hidden}
:root[data-look="arcade"][data-motion="on"] .pd-b::before,:root[data-look="arcade"][data-motion="on"] .pd-b::after{content:"";position:absolute;top:-40%;width:420px;height:180%;pointer-events:none;z-index:0;
  background:conic-gradient(from 168deg at 50% 0,transparent 0deg,rgba(255,243,176,.22) 12deg,transparent 24deg);animation:axSpot 5s ease-in-out infinite alternate}
:root[data-look="arcade"][data-motion="on"] .pd-b::before{left:5%}
:root[data-look="arcade"][data-motion="on"] .pd-b::after{right:5%;animation-delay:-2.5s}
@keyframes axSpot{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
:root[data-look="arcade"] .pd-s{position:relative;z-index:1}
:root[data-look="arcade"] .pd-s .step{font:900 italic 72px/1 var(--num);color:transparent;background:var(--chrome),var(--ink2);-webkit-background-clip:text,border-box;background-clip:text,border-box}
:root[data-look="arcade"]:not([data-motion="off"]) #podium.on .pd-s .step{transform-origin:50% 100%;animation:axRise .8s cubic-bezier(.2,1.2,.4,1) both}
:root[data-look="arcade"]:not([data-motion="off"]) #podium.on .pd-s .nm,:root[data-look="arcade"]:not([data-motion="off"]) #podium.on .pd-s .ph{animation:axSlam .55s cubic-bezier(.2,1.5,.4,1) both}
:root[data-look="arcade"] #podium.on .pd-s.p3 .step{animation-delay:.1s}:root[data-look="arcade"] #podium.on .pd-s.p2 .step{animation-delay:.5s}:root[data-look="arcade"] #podium.on .pd-s.p1 .step{animation-delay:.9s}
:root[data-look="arcade"] #podium.on .pd-s.p3 :is(.nm,.ph){animation-delay:.6s}:root[data-look="arcade"] #podium.on .pd-s.p2 :is(.nm,.ph){animation-delay:1s}:root[data-look="arcade"] #podium.on .pd-s.p1 :is(.nm,.ph){animation-delay:1.5s}
@keyframes axRise{from{transform:scaleY(0)}to{transform:none}}
@keyframes axSlam{0%{transform:translateY(-140px) scale(1.8);opacity:0;filter:blur(6px)}70%{transform:translateY(6px) scale(.97);opacity:1;filter:none}100%{transform:none}}
:root[data-look="arcade"]:not([data-motion="off"]) #gwalk.gw-next :is(.gw-plate,#gwPlate){animation:axPop .45s .35s cubic-bezier(.2,1.6,.4,1) both}
:root[data-look="arcade"]:not([data-motion="off"]) #gwalk.gw-next #gwLv{animation:lkLv .7s .15s cubic-bezier(.15,.9,.25,1) both}
:root[data-look="arcade"]:not([data-motion="off"]) #gwalk.gw-next .gw-stats > div{animation:axPop .45s cubic-bezier(.2,1.6,.4,1) both}
:root[data-look="arcade"]:not([data-motion="off"]) #gwalk.gw-next .gw-stats > div:nth-child(1){animation-delay:.55s}
:root[data-look="arcade"]:not([data-motion="off"]) #gwalk.gw-next .gw-stats > div:nth-child(2){animation-delay:.7s}
:root[data-look="arcade"]:not([data-motion="off"]) #gwalk.gw-next .gw-stats > div:nth-child(3){animation-delay:.85s}
:root[data-look="arcade"]:not([data-motion="off"]) #gwalk.gw-next .gw-stats > div:nth-child(n+4){animation-delay:1s}
@keyframes axPop{0%{transform:scale(2.4);opacity:0;filter:blur(4px)}100%{transform:none;opacity:1;filter:none}}
/* a stinger of checkered tiles flipping over (any look; Arcade's own) */
#stinger.run[data-style="tiles"] .fx{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,1fr)}
#stinger.run[data-style="tiles"] .fx>i{position:static;background:var(--head);transform:perspective(500px) rotateY(90deg);animation:stTile var(--dur) cubic-bezier(.6,0,.4,1) both}
#stinger.run[data-style="tiles"] .fx>i.k{background:color-mix(in srgb,var(--head) 55%,#ffffff)}
#stinger.run[data-style="tiles"] .fx>i.a{background:var(--accent)}
@keyframes stTile{0%{transform:perspective(500px) rotateY(90deg)}30%,70%{transform:none}100%{transform:perspective(500px) rotateY(-90deg)}}
/* ---------- MOTION: every look moves in its own way (theme.motion: on | calm | off; data-preset picks the style) ----------
   Entrances are clip-path, opacity and filter only, so a graphic's measured box never changes while it comes in
   (makeRoom measures it). One-shot classes are restarted from script: lk-hit (something new on a graphic already up),
   m-roll (a lap count that changed), mv-up / mv-dn (a car gained or lost a place). Calm keeps those and the entrances
   and drops what loops (the glint across the headers, the flags rippling). Still: nothing moves but the stingers and
   the show screens, which were asked for by name. Arcade keeps its own entrances. */
.layer .inner{position:relative}
:root{--m-glint:rgba(255,255,255,.16);--m-in:mWipeL;--m-in-r:mWipeR;--m-t:.55s;--m-ease:cubic-bezier(.7,0,.2,1)}
:root[data-preset="pitboard"]{--m-in:mDrop;--m-in-r:mDrop;--m-t:.5s;--m-ease:cubic-bezier(.3,.9,.3,1);--m-glint:rgba(255,255,255,.1)}
:root[data-preset="daylight"]{--m-in:mRise;--m-in-r:mRise;--m-t:.5s;--m-ease:cubic-bezier(.2,.8,.2,1);--m-glint:rgba(255,255,255,.22)}
:root[data-preset="neon"]{--m-in:mNeon;--m-in-r:mNeon;--m-t:.9s;--m-ease:linear;--m-glint:color-mix(in srgb,var(--accent) 30%,transparent)}
:root[data-preset="heritage"]{--m-in:mOpen;--m-in-r:mOpen;--m-t:.75s;--m-ease:cubic-bezier(.25,.8,.25,1);--m-glint:color-mix(in srgb,var(--accent) 22%,transparent)}
:root[data-preset="pitwall"]{--m-in:mPower;--m-in-r:mPower;--m-t:.45s;--m-ease:cubic-bezier(.5,0,.2,1);--m-glint:color-mix(in srgb,var(--accent) 14%,transparent)}
:root[data-preset="arcade"]{--m-glint:rgba(255,243,176,.28)}
/* coming on air */
:root:not([data-motion="off"]):not([data-look="arcade"]) .layer.on:not(#stinger):not(#scene) > .inner{animation:var(--m-in) var(--m-t) var(--m-ease) backwards}
:root:not([data-motion="off"]):not([data-look="arcade"]) :is(#banner,#replay,#map,#faster,#ticker,#fastlap,#penalty,#pip).on > .inner{animation-name:var(--m-in-r)}
@keyframes mWipeL{from{clip-path:inset(-80px 100% -80px -80px)}to{clip-path:inset(-80px)}}
@keyframes mWipeR{from{clip-path:inset(-80px -80px -80px 100%)}to{clip-path:inset(-80px)}}
@keyframes mDrop{from{clip-path:inset(-80px -80px 100% -80px)}to{clip-path:inset(-80px)}}
@keyframes mRise{from{clip-path:inset(100% -80px -80px -80px);opacity:0}to{clip-path:inset(-80px);opacity:1}}
@keyframes mOpen{from{clip-path:inset(-80px 50% -80px 50%);opacity:0}to{clip-path:inset(-80px);opacity:1}}
@keyframes mPower{0%{clip-path:inset(50% -80px 50% -80px);filter:brightness(2.2)}60%{clip-path:inset(-80px);filter:brightness(1.6)}100%{clip-path:inset(-80px);filter:none}}
@keyframes mNeon{0%{opacity:0;filter:none}8%{opacity:.9;filter:drop-shadow(0 0 14px var(--accent))}13%{opacity:.15}22%{opacity:1}30%{opacity:.35}40%{opacity:1;filter:drop-shadow(0 0 18px var(--accent))}100%{opacity:1;filter:none}}
/* IMSA: the highlight colour leads the wipe in */
:root[data-preset="imsa"]:not([data-motion="off"]) .layer.on:not(#stinger):not(#scene):not(#strip) > .inner::before{content:"";position:absolute;top:0;bottom:0;width:5px;left:0;background:var(--accent);opacity:0;pointer-events:none;z-index:3;animation:mBarL var(--m-t) var(--m-ease)}
:root[data-preset="imsa"]:not([data-motion="off"]) :is(#banner,#replay,#map,#faster,#ticker,#fastlap,#penalty,#pip).on > .inner::before{animation-name:mBarR}
@keyframes mBarL{0%{left:0;opacity:1}88%{left:calc(100% - 5px);opacity:1}100%{left:calc(100% - 5px);opacity:0}}
@keyframes mBarR{0%{left:calc(100% - 5px);opacity:1}88%{left:0;opacity:1}100%{left:0;opacity:0}}
/* something new on a graphic already up */
:root:not([data-motion="off"]) .lk-hit .inner::after{content:"";position:absolute;pointer-events:none;z-index:3}
:root[data-preset="imsa"] .lk-hit .inner::after,:root[data-preset="heritage"] .lk-hit .inner::after{inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.32) 50%,transparent 62%) no-repeat;background-size:250% 100%;mix-blend-mode:screen;animation:lkSweep .7s cubic-bezier(.3,0,.5,1) both}
:root[data-preset="heritage"] .lk-hit .inner::after{background-image:linear-gradient(105deg,transparent 36%,color-mix(in srgb,var(--accent) 45%,transparent) 50%,transparent 64%);animation-duration:1.1s}
:root[data-preset="pitboard"] .lk-hit .inner::after{inset:0;box-shadow:inset 0 0 0 3px var(--accent);animation:mFade 1.1s ease-out both}
:root[data-preset="daylight"] .lk-hit .inner::after{left:0;right:0;bottom:-4px;height:4px;background:var(--accent);transform-origin:0 50%;animation:mLine 1.2s cubic-bezier(.2,.8,.2,1) both}
:root[data-preset="neon"] .lk-hit .inner::after{inset:0;box-shadow:0 0 0 2px var(--accent),0 0 32px var(--accent);animation:mFade 1.2s ease-out both}
:root[data-preset="pitwall"] .lk-hit .inner::after{inset:-1px;box-shadow:inset 0 0 0 2px var(--accent);animation:mBlink .9s steps(1) both}
@keyframes mFade{from{opacity:1}to{opacity:0}}
@keyframes mLine{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes mBlink{0%,40%{opacity:1}20%,60%,100%{opacity:0}}
/* a lap count or state that changed */
:root:not([data-motion="off"]) .m-roll{animation:mRoll .45s cubic-bezier(.2,.8,.2,1)}
:root[data-preset="pitboard"]:not([data-motion="off"]) .m-roll{animation-name:mFlip}
:root[data-preset="pitwall"]:not([data-motion="off"]) .m-roll{animation:mBlink .5s steps(1) reverse}
@keyframes mRoll{from{opacity:0;translate:0 55%}}
@keyframes mFlip{from{transform:perspective(240px) rotateX(-88deg);opacity:.2}}
/* a car gained or lost a place: its row lights up and fades */
:root:not([data-motion="off"]) .row.mv-up{animation:mRowUp 1.8s ease-out}
:root:not([data-motion="off"]) .row.mv-dn{animation:mRowDn 1.8s ease-out}
@keyframes mRowUp{from{box-shadow:inset 4px 0 0 var(--gain),inset 0 0 0 999px color-mix(in srgb,var(--gain) 28%,transparent)}to{box-shadow:inset 0 0 0 transparent,inset 0 0 0 999px transparent}}
@keyframes mRowDn{from{box-shadow:inset 4px 0 0 var(--lose),inset 0 0 0 999px color-mix(in srgb,var(--lose) 22%,transparent)}to{box-shadow:inset 0 0 0 transparent,inset 0 0 0 999px transparent}}
/* what loops (Animated only): a slow glint across the headers, now and then, and a flag that is out ripples */
.tw-head,.bn{position:relative}
:root[data-motion="on"] .tw-head::before,:root[data-motion="on"] .bn::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;mix-blend-mode:screen;
  background:linear-gradient(105deg,transparent 42%,var(--m-glint) 50%,transparent 58%) no-repeat;background-size:300% 100%;background-position:150% 0;animation:mGlint 22s ease-in-out infinite}
:root[data-motion="on"] .bn::before{animation-delay:-11s}
@keyframes mGlint{0%,90%{background-position:150% 0}100%{background-position:-50% 0}}
.m-wave{position:relative;overflow:hidden}
:root[data-motion="on"] .m-wave::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,255,255,.5),transparent) 0 0/100% 45% no-repeat;animation:mWaveV 1.5s ease-in-out infinite}
:root[data-motion="on"] .tw-flag.m-wave::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent) 0 0/30% 100% no-repeat;animation-name:mWaveH;animation-duration:2.2s}
@keyframes mWaveV{from{background-position:0 -120%}to{background-position:0 220%}}
@keyframes mWaveH{from{background-position:-50% 0}to{background-position:150% 0}}
/* Still: the graphics do not move (the stingers and the show screens, chosen by name, still do) */
:root[data-motion="off"] .layer:not(#stinger):not(#scene),:root[data-motion="off"] .layer:not(#stinger):not(#scene) *,
:root[data-motion="off"] .layer:not(#stinger):not(#scene) *::before,:root[data-motion="off"] .layer:not(#stinger):not(#scene) *::after{animation:none!important}
/* the grid walk in the Pit wall and Arcade looks */
:root[data-look="pitwall"] .gw-row,:root[data-look="pitwall"] .gl{box-shadow:0 0 0 5px #16181b,0 0 0 6px #2a2e33,0 14px 30px rgba(0,0,0,.55)}
:root[data-look="pitwall"] .gw-stats b{font-family:var(--seg)!important;font-size:22px;letter-spacing:.02em}
:root[data-look="pitwall"] .gl-head{border-bottom:3px solid var(--accent)}
:root[data-look="arcade"] .gw-row{clip-path:polygon(0 0,100% 0,98.6% 100%,0 100%);border-top:3px solid var(--accent);border-radius:0}
:root[data-look="arcade"] .gw-pos b{font:900 italic 100px/.86 var(--num)}
:root[data-look="arcade"] .gw-name{font-style:italic;text-shadow:var(--trail)}
:root[data-look="arcade"] .gw-stats b{font:900 italic 27px/1.05 var(--num);color:var(--accent)}
:root[data-look="arcade"] .gw-cls,:root[data-look="arcade"] .gw-badge{transform:skewX(-12deg);font-style:italic}
:root[data-look="arcade"] .gl-head{transform:skewX(-8deg);border-bottom:3px solid var(--accent)}
:root[data-look="arcade"] .gl-head b{font-style:italic}
:root[data-look="arcade"] .gl-s .p{font-style:italic;color:var(--accent)}
:root[data-look="arcade"] #gwalk.gw-next .gw-row{animation:lkCard .6s cubic-bezier(.15,.9,.25,1) both}
/* ---------- /LOOKS ---------- */
</style>
</head>

<script>

  const FIT_MIN = 0.7, NAME_SHRINK = 0.86;

  let fitForce = true;                                   // every box again: a new look or its fonts arriving

  }
  // one word less from the front of a name, given as its runs of text in order ("<small>C.</small>Andres Arteaga
  // Narvaez" is ["C.", "Andres Arteaga Narvaez"]): the first run of several words loses its first word, else the
  // first run goes (an initial or a first name); the last word always stays. null: nothing left to drop.
  function nameShorter(runs) {
    const w = runs.map(r => String(r).trim().split(/\s+/).filter(Boolean));

    const left = w.map((x, i) => x.length ? i : -1).filter(i => i >= 0);

  }

    lap(s) { if (s == null || !(s > 0)) return "–"; const m = Math.floor(s / 60), r = s - m * 60;

    laps(n) { return "+" + n + (n === 1 ? " lap" : " laps"); },

  const allowed = name => !ONLY || ONLY === name;
  let gridUp = false;
  // Automatic graphics (producer: "Pick graphics for me"): the battle's "where they're faster" when the two

  const AUTO = { pair: null, from: 0, rest: {} };
  // Contextual graphics ("Pick graphics for me"): what the camera is showing decides what goes up. The driver card

  const CTX = { cam: null, camAt: 0, group: null, groupAt: 0, flag: null, flagAt: 0, pit: {}, pitOut: {}, bat: null, batAt: 0 };
  const CARD_SHOW_MS = [1500, 9500], CARD_AGAIN_MS = 45000, CARD_AGAIN_FOR = 7000;

  function tyreHtml(i) {
    const t = ((S.session && S.session.driverTires) || []).find(x => x.index === i), n = t && t.type ? String(t.type) : "";
    const k = /soft/i.test(n) ? "S" : /med/i.test(n) ? "M" : /hard/i.test(n) ? "H" : /wet|rain/i.test(n) ? "W" : /inter/i.test(n) ? "I" : "";
    return `<span class="tc ${k}" title="${esc(n)}">${esc(k || (n ? n[0].toUpperCase() : "C" + i))}</span>`;
  }
  function renderTyres() {
    const c = cardCar(), runs = c && (c.derived || {}).tyreRuns || [];
    $("tyres").classList.toggle("on", !!c && runs.length > 0 && shown("tyres"));
    if (!c || !runs.length) return;
    const h = `<div class="mini"><div class="mini-h">Tyres ${plate(c)}<span>${nameHtml(c.name)}</span></div><div class="ty">` +
      runs.map(r => `<span class="run">${tyreHtml(r.compound)}${r.laps != null ? r.laps + (r.laps === 1 ? " lap" : " laps") : "since we joined"}</span>`).join('<span class="ar">›</span>') + `</div></div>`;
    setH($("tyBox"), h);
  }

  // ---------------------------------------------------------------- speed trap
  // Each car's best top speed on a lap (derived.topSpeedBestMs), the camera car's class in a multiclass race.
  function renderTrap() {
    const cam = carByIdx(camIdx()), m = multi(), mph = G("onboard.units", "kph") === "mph";
    const list = allCars().filter(c => (c.derived || {}).topSpeedBestMs > 0 && (!m || !cam || c.classId === cam.classId))
      .sort((a, b) => b.derived.topSpeedBestMs - a.derived.topSpeedBestMs).slice(0, 6);
    $("trap").classList.toggle("on", list.length > 0 && shown("trap"));
    if (!list.length) return;
    const k = c => c.className && m ? `<span class="cl" style="font:800 12px/1 var(--display);padding:3px 6px 2px;border-radius:var(--r);background:${css(c.classColor)};color:${inkOn(css(c.classColor))}">${esc(c.className)}</span>` : "";
    const h = `<div class="mini"><div class="mini-h">Speed trap ${list[0] ? k(list[0]) : ""}</div>` + list.map((c, i) =>
      `<div class="mini-r"><span style="width:22px;text-align:center">${i + 1}</span>${plate(c)}<span class="n">${nameHtml(c.name)}</span><span class="v">${Math.round(c.derived.topSpeedBestMs * (mph ? 2.23694 : 3.6))}</span><small style="color:var(--muted);font:600 12px var(--body)">${mph ? "mph" : "km/h"}</small></div>`).join("") + `</div>`;
    setH($("trBox"), h);
  }

  // ---------------------------------------------------------------- qualifying lap
  function qlapCar() { const c = carByIdx(camIdx()); return c && (c.derived || {}).qualiLap ? c : null; }
  function renderQlap() {
    const c = qlapCar(), q = c && c.derived.qualiLap;
    $("qlap").classList.toggle("on", !!q && !isRace() && shown("qlap"));
    if (!q) return;
    const dp = q.deltaPoleS, cls = dp < 0 ? "p" : q.deltaOwnS != null && q.deltaOwnS < 0 ? "g" : "y";
    const pole = carByIdx(q.poleIdx), m = multi();
    const h = `<div class="ql"><div class="ql-h">Live lap ${plate(c)}<span class="nm">${nameHtml(c.name)}</span></div>` +
      `<div class="ql-b"><span class="ql-d ${cls}">${dp < 0 ? "−" : "+"}${Math.abs(dp).toFixed(3)}</span>` +
      `<div class="ql-x"><span>to ${q.poleIdx === c.idx ? "own best" : "pole"}${pole && q.poleIdx !== c.idx ? " · " + nameHtml(pole.name) : ""}</span><span>on for <b>P${q.projectedPos}</b>${m && c.className ? " " + esc(c.className) : ""}</span></div>` +
      `${q.deltaOwnS != null ? `<div class="ql-x" style="margin-left:auto;text-align:right"><span>own best</span><b>${q.deltaOwnS < 0 ? "−" : "+"}${Math.abs(q.deltaOwnS).toFixed(3)}</b></div>` : ""}</div>` +
      `<div class="ql-bar"><i style="width:${(100 * q.stretch / q.of).toFixed(1)}%"></i></div></div>`;
    setH($("qlBox"), h);
  }

  // ---------------------------------------------------------------- running order strip
  // The whole field in running order (derived.livePos), crawling right to left; rebuilt each time round.
  const SO = { built: false };
  function soHtml() {
    const cam = camIdx(), race = isRace();
    const field = racingField().sort((a, b) => (a.onGrid ? a.pos : (a.derived || {}).livePos || a.pos) - (b.onGrid ? b.pos : (b.derived || {}).livePos || b.pos));
    const grid = field.length > 0 && field[0].onGrid;
    const one = `<span class="so-t">${esc(T("text.series", "") || (grid ? "Starting grid" : "Running order"))}</span>` + field.map(c => { const d = c.derived || {};
      const g = c.onGrid ? (c.gridLapS ? fmt.lap(c.gridLapS) : "") : !race ? fmt.lap(c.bestLapS) : c.pos === 1 ? "Leader" : c.surface === "not_in_world" && !d.finished ? "Out" : d.gapLaps >= 1 ? fmt.laps(d.gapLaps) : d.liveGapS != null ? fmt.gap(d.liveGapS) : "";
      return `<span class="so-c${c.idx === cam ? " cam" : ""}"><span class="p">${esc(c.onGrid ? c.pos : d.livePos || c.pos)}</span>${plate(c)}<span>${nameHtml(c.name, "last")}</span><span class="g">${esc(g)}</span></span>`; }).join("");
    return { one, n: field.length };
  }
  // Two identical halves, each at least a screen wide, so the crawl never shows a gap (a small field is repeated).
  function soFill(one) {
    const row = $("soRow"); row.innerHTML = one;
    const w = row.scrollWidth || 1920, k = Math.max(1, Math.ceil(1920 / w));
    row.innerHTML = one.repeat(2 * k);
    return k;
  }
  function renderStrip() {
    const on = shown("strip") && !!S.cars && racingField().length > 0;     // no cars: nothing to crawl (it ran its title alone)
    $("strip").classList.toggle("on", on);
    if (!on) { SO.built = false; return; }
    if (!SO.built) {
      const r = soHtml(), k = soFill(r.one); $("soRow").style.setProperty("--so-dur", Math.max(30, r.n * k * 3.2) + "s"); SO.built = true;
      $("soRow").onanimationiteration = () => soFill(soHtml().one);
    }
  }

  // ---------------------------------------------------------------- league standings
  // gfx league: {title, rows: [{pos, name, points, num, cls, uid}]} from the producer's uploaded file. The
  // points are the league's own figures; a driver in this session shows where they are now (iRacing's order).
  // A driver's line in the league's table (gfx league.rows, the league's own points): by iRacing customer id, else by
  // name (accents, iRacing's added digits and "Last, First" ignored), else by car number when only one row has it.
  function leagueKeys(n) {
    const s = String(n || "").trim(), sw = s.includes(",") ? s.split(",").map(x => x.trim()).reverse().join(" ") : s;
    const k = x => x.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
    return [...new Set([k(s), k(sw)])].filter(Boolean);
  }
  function leagueRowFor(c, rows) {
    if (!c) return null;
    rows = rows || (G("league", {}) || {}).rows || [];
    const uid = c.userId != null ? String(c.userId) : "";
    let r = uid && rows.find(x => x.uid && String(x.uid) === uid); if (r) return r;
    const ks = leagueKeys(c.name);
    r = rows.find(x => leagueKeys(x.name).some(k => ks.includes(k))); if (r) return r;
    // iRacing adds a digit to a name it already has ("John Smith2"): without the digits, if only one row fits
    const bare = a => a.map(k => k.replace(/\d+$/, "")).filter(k => k.length > 3);
    const kb = bare(ks), loose = kb.length ? rows.filter(x => bare(leagueKeys(x.name)).some(k => kb.includes(k))) : [];
    if (loose.length === 1) return loose[0];
    const byNum = rows.filter(x => x.num != null && x.num !== "" && String(x.num) === String(c.num ?? ""));
    return byNum.length === 1 ? byNum[0] : null;
  }
  const ordinal = p => { const n = parseInt(p, 10); if (!(n > 0)) return String(p ?? ""); const t = n % 100;
    return n + (t >= 11 && t <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th"); };
  function champText(c) {
    const r = leagueRowFor(c); if (!r) return "";
    return [r.pos ? ordinal(r.pos) : "", r.points !== "" && r.points != null ? r.points + " pts" : ""].filter(Boolean).join(" · ");
  }
  function renderLeague() {
    const L = G("league", {}) || {}, rows = L.rows || [];
    const on = shown("league") && rows.length > 0;
    $("league").classList.toggle("on", on);
    if (!on) return;
    setT($("lgTitle"), L.title || "Championship");
    setT($("lgSub"), L.sub || "");
    const logo = assetUrl(T("logo", "")); $("lgLogo").classList.toggle("hide", !logo); if (logo) $("lgLogo").src = logo;
    const cars = allCars().filter(c => c.pos > 0), m = multi();
    const now = r => { const c = cars.find(c => leagueRowFor(c, rows) === r);
      return c ? `<span class="now">${isRace() ? "Now " : ""}P${esc(m ? c.classPos : c.pos)}</span>` : ""; };
    const list = rows.slice(0, 24), half = list.length > 12 ? Math.ceil(list.length / 2) : list.length;
    const col = part => `<div>${part.map((r, i) => `<div class="lg-r"><span class="p">${esc(r.pos ?? "")}</span>${r.num != null && r.num !== "" ? `<span class="plate" style="background:${T("colors.plate", "#2a2f38")};color:#fff">${esc(r.num)}</span>` : ""}` +
      `<span class="n">${nameHtml(r.name)}${r.cls ? ` <small style="color:var(--muted);font-size:14px">${esc(r.cls)}</small>` : ""}</span>${now(r)}<span class="pts">${esc(r.points ?? "")}</span></div>`).join("")}</div>`;
    const h = col(list.slice(0, half)) + (half < list.length ? col(list.slice(half)) : "");
    $("lgCols").style.gridTemplateColumns = half < list.length ? "1fr 1fr" : "1fr";
    setH($("lgCols"), h);
  }

  // ---------------------------------------------------------------- picture in picture
  // gfx pip: {url, label, car, second: {name, cam: {idx, num, uid, name}, seen}}. The video is the producer's
  // VDO.Ninja view link (https only, or this PC), loaded when the window first comes on and dropped a minute
  // after it goes off. The caption names the second camera's car while that camera reports in (pip.second,
  // from the co-host's suite), else the car the producer picked. "Reports in" is timed here, from when a
  // report arrived, never by comparing the two PCs' clocks.
  const PIP = { url: null, offAt: 0, secKey: null, secAt: 0 };
  function pipUrl(u) {
    try { const x = new URL(String(u || "")); return x.protocol === "https:" || /^(127\.0\.0\.1|localhost)$/.test(x.hostname) ? x.href : null; } catch (e) { return null; }
  }
  function pipCar(p) {
    const sec = p.second, key = sec ? JSON.stringify(sec) : null, now = performance.now();
    if (key !== PIP.secKey) { PIP.secKey = key; PIP.secAt = now; }
    const cam = sec && sec.cam && now - PIP.secAt < 150000 ? sec.cam : null;
    if (cam) { const c = carByIdx(cam.idx); if (c && (cam.num == null || String(c.num) === String(cam.num))) return c;
      const byNum = allCars().find(x => cam.num != null && String(x.num) === String(cam.num)); if (byNum) return byNum; }
    return carByIdx(p.car);
  }
  function renderPip() {
    const p = G("pip", {}) || {}, url = pipUrl(p.url), on = shown("pip") && !!url, now = performance.now();
    $("pip").classList.toggle("on", on);
    $("pip").classList.toggle("with-map", $("map").classList.contains("on"));
    if (on) {
      PIP.offAt = 0;
      if (PIP.url !== url) { PIP.url = url; $("ppV").innerHTML = `<iframe src="${esc(url)}" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>`; hit($("pip")); }
    } else if (PIP.url) {
      if (!PIP.offAt) PIP.offAt = now;
      else if (now - PIP.offAt > 60000 || !url) { PIP.url = null; $("ppV").innerHTML = ""; }
    }
    if (!on) return;
    const c = pipCar(p), m = multi();
    const h = `<span class="lb">${esc(p.label || "Onboard")}</span>` + (c ? `${plate(c)}<span class="nm">${nameHtml(c.name)}</span><span class="ps">${c.pos > 0 ? "P" + (m ? c.classPos : c.pos) : ""}</span>` : `<span class="nm"></span>`);
    setH($("ppC"), h);
  }

  // ---------------------------------------------------------------- show screens
  // gfx scene: {mode: soon | break | end, title, sub, untilMs}. The countdown runs on this machine's clock
  // to the time the producer set; nothing in it is a race figure.
  const SCENE_KICK = { soon: "Starting soon", break: "We'll be right back", end: "Thanks for watching" };
  function classGroups() {
    const field = allCars().filter(c => c.pos > 0);
    return multi() ? classes().map(k => ({ k, list: field.filter(c => c.classId === k.id).sort((a, b) => a.classPos - b.classPos) }))
      : [{ k: null, list: field.sort((a, b) => a.pos - b.pos) }];
  }
  const clsHead = k => k ? `<h3 style="background:${k.color || "var(--muted)"};color:${inkOn(k.color)}">${esc(k.name)}</h3>` : "";
  let sceneSig = "";
  function renderScene() {
    const mode = G("scene.mode", null), on = !!mode && allowed("scene");
    $("scene").classList.toggle("on", on);
    if (!on) { sceneSig = ""; renderScene.mode = null; return; }
    // Each screen can use your own file (gfx scene.files[mode]): an uploaded picture or looping video, or a web
    // page (https); with scene.bare[mode], that file alone, without the built-in words and lists.
    const own = (G("scene.files", {}) || {})[mode] || "", bare = !!(G("scene.bare", {}) || {})[mode];
    const ownKey = mode + "|" + own;
    if ($("scOwn").dataset.k !== ownKey) {
      $("scOwn").dataset.k = ownKey;
      const a = (S.assets || []).find(x => x.name === own), u = /^https:\/\/./.test(own) ? own : a ? assetUrl(own) : "";
      $("scOwn").innerHTML = !u ? "" : /^https:/.test(own) ? `<iframe src="${esc(u)}" allow="autoplay" referrerpolicy="no-referrer"></iframe>`
        : a && a.type.startsWith("video/") ? `<video src="${esc(u)}" autoplay loop muted playsinline></video>` : `<img src="${esc(u)}" alt="">`;
    }
    $("scBox").classList.toggle("own", !!$("scOwn").innerHTML);
    $("scBox").classList.toggle("bare", bare && !!$("scOwn").innerHTML);
    if (renderScene.mode !== mode) {      // a new screen: the words and lists come in once
      renderScene.mode = mode; const box = $("scBox");
      box.classList.remove("enter"); void box.offsetWidth; box.classList.add("enter");
      clearTimeout(renderScene.t); renderScene.t = setTimeout(() => box.classList.remove("enter"), 2500);
    }
    const t = S.session && S.session.track, sess = sessionRow();
    setT($("scKick"), G("scene.kick", "") || SCENE_KICK[mode] || "");
    setT($("scTitle"), G("scene.title", "") || T("text.event", "") || T("text.series", "") || (t ? t.TrackDisplayName : ""));
    setT($("scSub"), G("scene.sub", "") || [t ? t.TrackDisplayName : "", t && t.TrackConfigName ? t.TrackConfigName : "", sess ? sess.SessionType : ""].filter(Boolean).join(" · "));
    const logo = assetUrl(T("logo", "")); $("scLogo").classList.toggle("hide", !logo); if (logo && $("scLogo").getAttribute("src") !== logo) $("scLogo").src = logo;
    const until = G("scene.untilMs", null);
    if (until && mode !== "end") {
      const left = Math.max(0, Math.round((until - Date.now()) / 1000));
      const word = mode === "soon" ? "Starting in" : mode === "break" ? "Back in" : "";
      setH($("scCd"), left > 0 ? `<small>${word}</small><span class="tick">${fmt.clock(left)}</span>` : `<small>${mode === "soon" ? "Starting" : mode === "break" ? "Back" : ""}</small>now`);
    } else setH($("scCd"), "");
    const sp = (G("sponsors.logos", []) || []).map(assetUrl).filter(Boolean);
    const spH = sp.map(u => `<img src="${u}" alt="">`).join("");
    setH($("scSp"), spH);
    // the body changes with the field: rebuilt at most once a second
    const now = performance.now(); if (sceneSig === mode && now - (renderScene.at || 0) < 1000) return;
    sceneSig = mode; renderScene.at = now;
    const groups = classGroups(), race = isRace(), fin = racingFlag() === "checkered";
    let body = "";
    if (mode === "soon") {
      const per = groups.length > 1 ? 12 : 24;
      body = groups.map(g => `<div class="sc-col">${clsHead(g.k)}${(g.list.length ? g.list : []).slice(0, per).map(c =>
        `<div class="r">${plate(c)}<span class="n">${nameHtml(c.name)}</span></div>`).join("")}${g.list.length > per ? `<div class="more">and ${g.list.length - per} more</div>` : ""}</div>`).join("");
    } else if (mode === "break") {
      body = groups.map(g => `<div class="sc-col">${clsHead(g.k)}${g.list.slice(0, 6).map(c => { const d = c.derived || {}, by = !!g.k;
        const gap = race ? ((by ? c.classPos : c.pos) === 1 ? "Leader" : by ? (d.classGapLaps >= 1 ? fmt.laps(d.classGapLaps) : fmt.gap(d.liveClassGapS)) : (d.gapLaps >= 1 ? fmt.laps(d.gapLaps) : fmt.gap(d.liveGapS))) : fmt.lap(c.bestLapS);
        return `<div class="r"><span class="p">${esc(by ? c.classPos : c.pos)}</span>${plate(c)}<span class="n">${nameHtml(c.name)}</span><span class="v">${esc(gap)}</span></div>`; }).join("")}</div>`).join("");
    } else if (mode === "end") {
      body = groups.map(g => `<div class="sc-col">${clsHead(g.k)}${g.list.slice(0, 3).map(c => { const by = !!g.k;
        return `<div class="r"><span class="p">${esc(by ? c.classPos : c.pos)}</span>${plate(c)}<span class="n">${nameHtml(c.name)}</span><span class="v">${race && !fin ? "" : fmt.lap(c.bestLapS)}</span></div>`; }).join("")}</div>`).join("");
    }
    setH($("scBody"), body);
    // Arcade: the field races past behind the words, like a game's attract mode
    const names = document.documentElement.dataset.look === "arcade" ? allCars().filter(c => c.pos > 0 || (c.name && c.surface !== "not_in_world")).map(c => esc(c.name || "")).filter(Boolean) : [];
    const line = k => { const L = names.slice(k % names.length).concat(names.slice(0, k % names.length)).join(" &nbsp;◆&nbsp; "); return `<div>${L} &nbsp;◆&nbsp; ${L} &nbsp;◆&nbsp; </div>`; };
    setH($("scAx"), names.length ? [0, 3, 6, 9, 12, 15, 18, 21].map(line).join("") : "");
  }

  // ---------------------------------------------------------------- podium
  // Top three of a class (gfx podium.classId; none picked in a multiclass race: each class in turn, 10 s each).
  let pdSig = "";
  function renderPodium() {
    const groups = classGroups();
    let g = groups[0];
    if (groups.length > 1) {
      const pick = G("podium.classId", null);
      g = groups.find(x => x.k.id === pick) || groups[Math.floor(Date.now() / 10000) % groups.length];
    }
    const on = shown("podium") && !!g && g.list.length > 0;
    $("podium").classList.toggle("on", on);
    if (!on) return;
    const by = !!g.k, fin = racingFlag() === "checkered", race = isRace(), top = g.list.slice(0, 3);
    const val = c => { const d = c.derived || {}, p = by ? c.classPos : c.pos;
      if (!race) return fmt.lap(c.bestLapS);
      if (p === 1) return fin ? "Winner" : "Leader";
      return by ? (d.classGapLaps >= 1 ? fmt.laps(d.classGapLaps) : fmt.gap(d.liveClassGapS)) : (d.gapLaps >= 1 ? fmt.laps(d.gapLaps) : fmt.gap(d.liveGapS)); };
    const step = (c, k) => !c ? "<div></div>" : `<div class="pd-s p${k}"><div class="ph">${photoHtml(c) || helmetHtml(c, 120)}</div><div class="nm">${nameHtml(c.name)}</div>` +
      `<div class="x">${plate(c)}<span data-v="${c.idx}">${esc(val(c))}</span></div><div class="step">${k}</div></div>`;
    const h = `<div class="pd"><div class="pd-h"><b>${fin && race ? "Podium" : !race && /qual/i.test((sessionRow() || {}).SessionType || "") ? (fin ? "Front of the grid" : "Qualifying: top three") : "Top three"}</b>${g.k ? `<span class="cl" style="background:${g.k.color};color:${inkOn(g.k.color)}">${esc(g.k.name)}</span>` : ""}` +
      `<span>${esc(T("text.event", "") || (S.session && S.session.track ? S.session.track.TrackDisplayName : ""))}</span></div>` +
      `<div class="pd-b">${step(top[1], 2)}${step(top[0], 1)}${step(top[2], 3)}</div></div>`;
    // rebuilt only when who stands on it (or its title) changes, so it comes in once; the gaps change in place
    const sig = h.replace(/<span data-v="(\d+)">[^<]*<\/span>/g, "$1");
    if (sig !== pdSig) { const fresh = !pdSig; pdSig = sig; $("pdBox").innerHTML = h; if (fresh) hit($("podium")); }
    else for (const c of top) { const el = $("pdBox").querySelector(`[data-v="${c.idx}"]`); if (el) { const v = val(c); if (el.textContent !== v) el.textContent = v; } }
  }

  // ---------------------------------------------------------------- commentator strap, sponsor bug
  // gfx straps: {list: [{name, role}], idx, at, secs}. A new `at` puts the strap up for `secs` (0: until taken
  // down), timed here from when it arrived, so the two machines' clocks never matter.
  const STRAP = { key: null, from: 0 };
  function renderStrap() {
    const st = G("straps", {}) || {}, p = st.idx != null ? (st.list || [])[st.idx] : null;
    const key = p ? st.idx + "|" + st.at : null;
    if (key !== STRAP.key) { STRAP.key = key; STRAP.from = performance.now(); if (p) { $("spBox").innerHTML = `<div class="sp-s"><div class="bar"></div><div class="m"><div class="nm">${esc(p.name || "")}</div>` +
      (p.role ? `<div class="rl">${esc(p.role)}</div>` : "") + `</div></div>`; hit($("strap")); } }
    const secs = st.secs == null ? 10 : st.secs;
    $("strap").classList.toggle("on", !!p && allowed("strap") && !sceneUp() && (!secs || performance.now() - STRAP.from < secs * 1000));
  }
  const SPB = { i: -1, at: 0 };
  function renderSponsor() {
    const logos = (G("sponsors.logos", []) || []).filter(Boolean);
    const on = shown("sponsors") && logos.length > 0 && !$("traffic").classList.contains("on");
    $("sponsors").classList.toggle("on", on);
    if (!on) return;
    const every = Math.max(4, G("sponsors.every", 15)) * 1000, now = performance.now();
    if (SPB.i < 0 || now - SPB.at > every || SPB.i >= logos.length) {
      SPB.i = (SPB.i + 1) % logos.length; SPB.at = now;
      setH($("sbBox"), `<img src="${assetUrl(logos[SPB.i])}" alt="">`);
    }
  }

  // ---------------------------------------------------------------- banner + replay bug
  function renderBanner() {
    $("banner").classList.toggle("on", shown("banner") && !!S.state);
    if (!S.state) return;

  // ---------------------------------------------------------------- race TV extras
  // All the numbers are normalize's (cars.derived: pitStops, closing, recentPace*, stopDue, lapChart; battles' swaps).
  const posOf = (c, cp, p) => multi() ? (c && c.className ? c.className + " " : "") + "P" + cp : "P" + p;
  const short = c => c ? `${plate(c)}${nameHtml(c.name, "last")}` : "";

  // the lap chart: every car's place lap by lap (the class of the camera car in a multiclass race), the top ten named

  // ---------------------------------------------------------------- flag calls

  // ---------------------------------------------------------------- battle

  // ---------------------------------------------------------------- where they're faster
  // The battle's two cars (the battle box's pair), best lap against best lap over 24 stretches of the track

  function carColor(c, other) {

    const K = f.gainS.length, row = (c, col, lap) => `<div class="fs-car"><span class="sw" style="background:${col}"></span>${plate(c)}<span class="nm">${nameHtml(c.name)}</span><span class="tm">${fmt.lap(lap)}</span></div>`;

  // ---------------------------------------------------------------- race control
  const queue = [];
  const nm = i => { const c = carByIdx(i); return c ? `<b>${nameHtml(c.name)}</b>` : "Car " + esc(i); };
  // the same words as the producer panel's incident list
  const WHAT = { contact: "Contact", spin: "Spin", lost_speed: "Lost speed", off_track: "Off track", tow: "Left the track", damage: "Damage" };
  const seenContact = {};
  function tickerItem(e) {
    const m = multi(), c = carByIdx(e.idx), cls = m && c && c.className ? esc(c.className) + " " : "";
    switch (e.kind) {
      case "fastest_lap":
        if ((!e.overall && !m) || shown("fastlap")) return null;   // the fastest-lap alert has it
        return ["fl", "Fastest lap", `${nm(e.idx)} · ${e.overall ? "" : cls}fastest lap <b>${fmt.lap(e.lapS)}</b>`];
      case "class_lead": return ["lead", "Lead", `${nm(e.idx)} takes the ${m ? cls : ""}lead`];
      case "pit_in": return G("ticker.pits", true) && isRace() ? ["pit", "Pit", `${nm(e.idx)} pits`] : null;
      case "pit_out": return G("ticker.pits", true) && isRace() ? ["pit", "Pit", `${nm(e.idx)} rejoins` + (e.stationaryS != null ? ` after a ${e.stationaryS.toFixed(1)} s stop` : "")] : null;
      case "race_incident": {
        if (!G("ticker.incidents", true)) return null;
        const min = G("ticker.minIncident", "spin");
        const order = ["off_track", "lost_speed", "spin", "contact"];
        if (order.indexOf(e.what) < order.indexOf(min) && !(e.what === "tow" || e.what === "damage")) return null;
        if (e.what === "contact" && e.contactWith && e.contactWith.length) {   // each car reports the same contact: show it once
          const key = [e.idx, ...e.contactWith].sort((a, b) => a - b).join("-");
          if (seenContact[key] != null && Math.abs((e.t || 0) - seenContact[key]) < 5) return null;
          seenContact[key] = e.t || 0;
        }
        const who = e.what === "contact" && e.contactWith && e.contactWith.length ? `${nm(e.idx)} and ${nm(e.contactWith[0])}` : nm(e.idx);
        return ["inc", WHAT[e.what] || "Incident", who];
      }
      case "flag": {
        const w = { green: "Green flag", yellow: "Yellow flag", caution: "Full course yellow", red: "Red flag", white: "White flag: final lap", checkered: "Checkered flag" }[e.flag];
        return w ? ["flag", "Flag", `<b>${w}</b>`] : null;
      }
      case "car_flag": {
        if (e.flag === "repair") return null;                          // the damage incident says it
        if (shown("penalty")) return null;                            // the race control alert has it
        const w = { black: "Black flag", furled: "Warning", disqualify: "Disqualified" }[e.flag];
        return w ? ["flag", w, nm(e.idx)] : null;
      }
      case "penalty_served": return shown("penalty") ? null : ["flag", "Penalty served", nm(e.idx)];
      case "rain_start": return ["wx", "Weather", "Rain is falling"];
      case "rain_stop": return ["wx", "Weather", "The rain has stopped"];
      case "declared_wet": return ["wx", "Weather", e.value ? "Wet race declared" : "Wet declaration lifted"];
    }
    return null;
  }
  function pushTick(e) { queueFastLap(e); queuePenalty(e); safely(axEvent, e); const it = tickerItem(e); if (it) queue.push(it); }
  function pumpTicker() {
    const box = $("ticker");
    box.classList.toggle("on", shown("ticker"));
    const now = performance.now();
    for (const el of box.querySelectorAll(".tk:not(.out)")) if (now - el._at > 7000) { el.classList.add("out"); setTimeout(() => el.remove(), 450); }
    if (queue.length && box.querySelectorAll(".tk:not(.out)").length < 3) {
      const [k, label, html] = queue.shift();
      const el = document.createElement("div"); el.className = "tk k-" + k; el._at = now;
      el.innerHTML = `<i>${esc(label)}</i><p>${html}</p>`;
      box.appendChild(el);
    }
    if (queue.length > 8) queue.splice(0, queue.length - 8);
  }
  function handleFeed(m) {
    if (m.full) {
      const first = !S.feed.ready;
      if (!first) for (const e of m.events || []) if (e.seq > S.feed.seq) pushTick(e);
      S.feed = { ready: true, seq: m.seq || 0, events: (m.events || []).slice(-400) };
      return;
    }
    if (!S.feed.ready) return;
    for (const e of m.events || []) if (e.seq > S.feed.seq) { pushTick(e); S.feed.events.push(e); }
    S.feed.seq = Math.max(S.feed.seq, m.seq || 0);
    if (S.feed.events.length > 400) S.feed.events.splice(0, S.feed.events.length - 400);
  }

  // ---------------------------------------------------------------- standings board
  function renderBoard() {
    const on = shown("board") && !!S.cars;
    $("board").classList.toggle("on", on);
    if (!on) return;
    const sess = sessionRow(), t = S.session && S.session.track;
    const f = racingFlag();
    setT($("bdTitle"), f === "checkered" ? "Results" : (T("text.series", "") || (sess ? sess.SessionType : "Standings")));
    setH($("bdSub"), esc(T("text.event", "") || (t ? t.TrackDisplayName : "")) + "<br>" + raceState().main.replace(/<[^>]+>/g, ""));
    const race = isRace(), off = officialPublished();
    const fin = race && f === "checkered";
    const gridOnly = race && !allCars().some(c => c.pos > 0);            // before the start: the grid and its laps
    const cols = gridOnly ? ["Qualifying", "", ""] : race ? (fin ? ["Gap", "Best", "+/−", "Stops", "Led"] : off ? ["Gap", "Best", "Inc"] : ["Gap", "Best", "Pits"]) : ["Best", "Last", ""];
    const fl = fastestByClass();
    const field = racingField(), onGrid = field.length > 0 && field[0].onGrid;
    if (onGrid) setT($("bdTitle"), T("text.gridTitle", "") || "Starting grid");
    const groups = multi() ? classes().map(k => ({ k, list: field.filter(c => c.classId === k.id).sort((a, b) => a.classPos - b.classPos) }))
      : [{ k: null, list: field.sort((a, b) => a.pos - b.pos) }];
    const row = (c, byClass) => {
      const d = c.derived || {};
      const g = c.pos === 1 || (byClass && c.classPos === 1) ? "Leader" : c.surface === "not_in_world" && !d.finished ? "Out" :
        (byClass ? (d.classGapLaps >= 1 ? fmt.laps(d.classGapLaps) : d.liveClassGapS != null ? fmt.gap(d.liveClassGapS) : "–")
                 : (d.gapLaps >= 1 ? fmt.laps(d.gapLaps) : d.liveGapS != null ? fmt.gap(d.liveGapS) : "–"));
      const pg = byClass ? d.classPosGained : d.posGained;
      const gained = pg == null ? "–" : pg > 0 ? "▲" + pg : pg < 0 ? "▼" + (-pg) : "=";
      const vals = c.onGrid ? [c.gridLapS ? fmt.lap(c.gridLapS) : "–", "", ""] : race ? [g, fmt.lap(c.bestLapS), fin ? gained : off ? (c.incidents >= 0 ? c.incidents + "x" : "–") : (d.stopsSeen ?? "–")]
                        : [fmt.lap(c.bestLapS), fmt.lap(c.lastLapS), ""];
      if (fin) vals.push(d.stopsSeen ?? "–", (byClass ? d.classLapsLedSeen : d.lapsLedSeen) || "–");    // the full result: stops, laps led
      const isFl = fl[c.classId] && fl[c.classId].idx === c.idx;
      return `<div class="bd-row"><span class="pos">${esc(byClass ? c.classPos : c.pos)}</span>${plate(c)}<span class="nm">${nameHtml(c.name)}${c.onPitRoad ? ' <span style="color:var(--muted);font-size:14px">PIT</span>' : ""}</span>` +
        vals.map((v, i) => `<span class="v${i ? " m" : ""}${(race ? i === 1 : i === 0) && isFl ? " fl" : ""}${fin && i === 2 ? (pg > 0 ? " up" : pg < 0 ? " dn" : "") : ""}">${esc(v)}</span>`).join("") + `</div>`;
    };
    const colHead = `<div class="bd-colhead"><span style="width:80px"></span><span class="sp">Driver</span>${cols.map(c => `<span class="c">${c}</span>`).join("")}</div>`;
    const ncols = groups.length > 1 ? Math.min(groups.length, 3) : (groups[0].list.length > 20 ? 2 : 1);
    $("bdCols").style.gridTemplateColumns = `repeat(${ncols},1fr)`;
    if (groups.length > 1) {
      setH($("bdCols"), groups.map(g => `<div class="bd-sec"><div class="cls" style="background:${g.k.color};color:${inkOn(g.k.color)}">${esc(g.k.name)}</div>${colHead}${g.list.slice(0, 18).map(c => row(c, true)).join("")}</div>`).join(""));
    } else {
      const list = groups[0].list.slice(0, 40), half = ncols === 2 ? Math.ceil(list.length / 2) : list.length;
      setH($("bdCols"), [list.slice(0, half), list.slice(half)].filter(x => x.length).map(part => `<div class="bd-sec">${colHead}${part.map(c => row(c, false)).join("")}</div>`).join(""));
    }
    // The story of the race, under the results: fastest lap, most laps led, biggest climb (over the field)
    const hi = $("bdHi");
    if (!fin) { hi.innerHTML = ""; return; }
    const by = (k, pick) => field.filter(c => pick(c) != null).sort((a, b) => k(a, b))[0];
    const fast = by((a, b) => a.bestLapS - b.bestLapS, c => c.bestLapS > 0 ? c.bestLapS : null);
    const led = by((a, b) => (b.derived.lapsLedSeen || 0) - (a.derived.lapsLedSeen || 0), c => c.derived && c.derived.lapsLedSeen > 0 ? 1 : null);
    const up = by((a, b) => (b.derived.posGained || 0) - (a.derived.posGained || 0), c => c.derived && c.derived.posGained > 0 ? 1 : null);
    const card = (lab, c, v) => c ? `<div class="hi"><small>${lab}</small>${plate(c)}<span class="nm">${nameHtml(c.name, "last")}</span><b>${esc(v)}</b></div>` : "";
    hi.innerHTML = card("Fastest lap", fast, fast && fmt.lap(fast.bestLapS)) +
      card("Most laps led", led, led && led.derived.lapsLedSeen + (led.derived.lapsLedSeen === 1 ? " lap" : " laps")) +
      card("Biggest climb", up, up && "▲" + up.derived.posGained + " from P" + up.derived.gridPos);
  }

  // ---------------------------------------------------------------- starting grid
  // Shows itself during the parade laps of a race when set to automatic, and
  // pages through the field, turning to the page with the car on camera.
  let gridPage = 0, gridPageAt = 0;
  function gridWanted() {
    const mode = G("grid.mode", "auto");
    if (mode === "on") return true;
    if (mode === "off") return false;
    const st = S.state && S.state.session && S.state.session.state;
    return isRace() && (st === "parade_laps" || st === "warmup");
  }
  // The grid board: every car in its grid slot (columns as the grid forms up: StartingGrid's cars a row, each
  // column a little behind the one before), iRacing's picture of each car, its qualifying lap and gap to pole
  // (normalize), a light down the rows from pole. A car not on the grid yet is still shown (the picture is the
  // render, not the camera), marked. The window follows the light on a big grid.
  const GB = { on: false, key: "" };
  function renderGBoard() {
    const gb = gridBoardOn();
    const grid = (S.session && S.session.grid) || {}, rows = grid.rows || [];
    const on = !!gb && rows.length > 0 && !!S.cars && (!ONLY || ["gboard", "grid"].includes(ONLY)) && !sceneUp();
    $("gboard").classList.toggle("on", on);
    if (!on) { GB.on = false; return; }
    const per = Math.max(1, Math.min(4, grid.perRow || 2)), m = multi();
    const rowOf = x => (x.derived || {}).row || Math.ceil((x.pos || 1) / per);
    const nRows = Math.max(1, ...rows.map(rowOf));
    const winH = 880, gap = 10, stag = per > 1 ? 0.5 : 0;
    const h = Math.max(84, Math.min(150, Math.floor((winH - 36) / (nRows + stag) - gap)));
    const t = S.session.track;
    setT($("gbTitle"), T("text.gridTitle", "") || "Starting grid");
    setT($("gbKind"), rows.length + " starters");
    setH($("gbSub"), esc(T("text.event", "") || (t ? t.TrackDisplayName : "")) + (t && t.TrackConfigName ? "<br>" + esc(t.TrackConfigName) : ""));
    const cols = Array.from({ length: per }, () => []);
    rows.forEach((x, i) => cols[(x.pos ? x.pos - 1 : i) % per].push(x));
    const slot = (x, k) => {
      const c = carByIdx(x.idx), d = x.derived || {}, rw = rowOf(x);
      const cls = rw === gb.row ? "lit" : "";
      if (!c) return `<div class="gbs ${cls}" style="--k:${k}"><div class="p"><b>${esc(x.pos)}</b></div></div>`;
      const away = c.surface === "not_in_world";
      const tag = d.pole ? "Pole" : m && d.classPole ? esc(c.className || "Class") + " pole" : m && x.classPos ? esc(c.className || "Class") + " P" + x.classPos : "";
      const gapH = d.poleGapS != null && !d.pole ? `<em>${fmt.gap(d.poleGapS)}</em>` : "";
      return `<div class="gbs ${cls}${away ? " away" : ""}" style="--k:${k}"><i style="background:${m ? css(c.classColor) || "#444" : "var(--accent)"}"></i>` +
        `<div class="p"><b>${esc(x.pos)}</b><span>${tag}</span></div><div class="lv">${liveryHtml(c)}</div>` +
        `<div class="who"><b>${plate(c)}${nameHtml(c.name)}</b><span>${away ? '<em class="out">Not on the grid yet</em> · ' : ""}${esc([c.team && c.team !== c.name ? c.team : "", c.car || ""].filter(Boolean).join(" · "))}</span></div>` +
        `<div class="tm">${x.timeS ? fmt.lap(x.timeS) : "No time"}<span>Qualifying</span>${gapH}</div></div>`;
    };
    let k = 0;
    const html = cols.map((col, ci) => `<div class="gbd-col" style="padding-top:${Math.round(ci * (h + gap) / per)}px">${col.map(x => slot(x, k++)).join("")}</div>`).join("");
    const box = $("gbCols");
    box.style.gridTemplateColumns = `repeat(${per}, 1fr)`;
    box.style.setProperty("--gbH", h + "px"); box.style.setProperty("--gbGap", gap + "px");
    setH(box, html);
    // a big grid: the window follows the light (two rows above it in view)
    const need = (nRows + stag) * (h + gap) + 36, over = Math.max(0, Math.ceil((need - winH) / (h + gap)));
    const at = Math.max(0, Math.min(over, (gb.row || 1) - 3));
    box.style.translate = `0 ${-at * (h + gap)}px`;
    $("gbWin").style.height = Math.min(winH, need) + "px";
    if (!GB.on) { GB.on = true; replay($("gboard"), "gb-in"); }
  }

  function renderGrid() {
    const rows = (S.session && S.session.grid && S.session.grid.rows) || [];
    gridUp = (rows.length > 0 && gridWanted() && !!S.cars) || !!gridWalkCar() || !!gridBoardOn();
    const on = allowed("grid") && !sceneUp() && rows.length > 0 && gridWanted() && !!S.cars && !gridWalkCar() && !gridBoardOn();
    $("grid").classList.toggle("on", on);
    if (!on) return;
    const t = S.session.track;
    setT($("gdTitle"), T("text.gridTitle", "") || "Starting grid");
    setH($("gdSub"), esc(T("text.event", "") || (t ? t.TrackDisplayName : "")) + (t && t.TrackConfigName ? "<br>" + esc(t.TrackConfigName) : ""));
    const per = 10, pages = Math.ceil(rows.length / per), now = performance.now();
    const cam = camIdx(), ci = rows.findIndex(r => r.idx === cam);
    if (ci >= 0 && G("grid.followCamera", true)) gridPage = Math.floor(ci / per);
    else if (now - gridPageAt > 8000) { gridPage = (gridPage + 1) % pages; gridPageAt = now; }
    if (gridPage >= pages) gridPage = 0;
    const m = multi();
    $("gdSlots").innerHTML = rows.slice(gridPage * per, gridPage * per + per).map(r => {
      const c = carByIdx(r.idx); if (!c) return `<div class="slot"><span class="p">${r.pos}</span></div>`;
      return `<div class="slot${c.idx === cam ? " cam" : ""}"><span class="p">${r.pos}</span><div class="lv">${liveryHtml(c)}</div>` +
        `<div class="who"><b>${plate(c)} ${nameHtml(c.name)}</b><span>${esc([m && c.className ? c.className + (r.classPos ? " P" + r.classPos : "") : "", c.team && c.team !== c.name ? c.team : c.car].filter(Boolean).join(" · "))}</span></div>` +
        `<div class="tm">${r.timeS ? fmt.lap(r.timeS) : ""}<span>${r.timeS ? "Qualifying" : ""}</span></div></div>`;
    }).join("");
    setT($("gdPage"), pages > 1 ? `Positions ${gridPage * per + 1}–${Math.min(rows.length, gridPage * per + per)} of ${rows.length}` : `${rows.length} starters`);
    setT($("gdNote"), S.session.grid.source === "qualify_results" ? "Grid from qualifying" : "");
  }

  // ---------------------------------------------------------------- stinger
  // A transition that covers the cut to and from a replay. The producer fires
  // it, then sends the camera command at the cut point, so the jump happens
  // behind it. A video from the assets (webm with alpha) replaces the default.
  let stingerSeq = null, stingerRunning = false;
  // The built-in stingers: name -> pieces drawn (CSS #stinger.run[data-style=...]). Your own are videos (theme.stinger.video).
  // Every one covers the whole picture from 42% to 58% of its length, so a cut anywhere in there is hidden.
  const STINGERS = {
    wipe: { html: () => "" },
    chevrons: { html: () => '<i class="fill"></i>' + [0, 1, 2].map(k => `<i class="ch" style="animation-delay:calc(var(--dur) * ${k * 0.06})"></i>`).join("") },
    checker: { html: () => "<i></i>" },
    panels: { html: () => Array.from({ length: 8 }, (_, k) => `<i style="left:${k * 12.5}%;animation-delay:calc(var(--dur) * ${k * 0.01})"></i>`).join("") },
    iris: { html: () => "<i></i>" },
    // checkered tiles flipping over corner to corner (Arcade's); each tile covers 30-70% of its own run, and the
    // run starts at most 12% in, so the whole picture is covered from 42% to 58%
    tiles: { html: () => Array.from({ length: 84 }, (_, k) => { const x = k % 12, y = Math.floor(k / 12);
      return `<i class="${(x + y) % 2 ? "k" : ""}${(x * 7 + y * 3) % 23 === 0 ? " a" : ""}" style="animation-delay:calc(var(--dur) * ${((x + y) / 17 * 0.12).toFixed(3)});animation-duration:calc(var(--dur) * .88)"></i>`; }).join("") },
  };
  function maybeStinger() {
    const st = S.gfx.stinger;
    // The first graphics state this page sees only sets the mark: an old stinger is not played on load. A state
    // with no stinger yet sets it too (the first stinger ever fired used to be taken for an old one and skipped).
    if (stingerSeq === null) { stingerSeq = st && st.seq != null ? st.seq : -1; return; }
    if (!st || st.seq == null) return;
    if (st.seq === stingerSeq) return;
    stingerSeq = st.seq;
    if (st.at && Date.now() - st.at > 4000) return;              // stale: arrived after a reconnect
    runStinger(st);
  }
  // The director's own replays fire their stinger through its status (director.stinger {seq, dir}); the first one
  // this page sees only sets the mark, as for the producer's.
  let dirStingerSeq = null;
  function directorStinger(d) {
    const st = d && d.stinger;
    if (dirStingerSeq === null) { dirStingerSeq = st ? st.seq : -1; return; }
    if (!st || st.seq === dirStingerSeq) return;
    dirStingerSeq = st.seq;
    runStinger(st);
  }
  function runStinger(st) {
    if (!allowed("stinger")) return;
    const box = $("stinger");
    const vid = T("stinger.video", "");
    $("stFx").innerHTML = "";
    const dur = Number(T("stinger.durationMs", 900)) || 900;
    stingerRunning = true;
    box.querySelectorAll("video").forEach(v => v.remove());
    if (vid) {
      const v = document.createElement("video");
      v.src = assetUrl(vid); v.muted = !T("stinger.sound", false); v.autoplay = true; v.playsInline = true;
      v.onended = () => { v.remove(); stingerRunning = false; };
      v.onerror = () => { v.remove(); stingerRunning = false; };
      box.appendChild(v);
      setTimeout(() => { stingerRunning = false; }, 6000);
      return;
    }
    const style = STINGERS[T("stinger.style", "wipe")] ? T("stinger.style", "wipe") : "wipe";
    box.dataset.style = style;
    $("stFx").innerHTML = STINGERS[style].html();
    const logo = assetUrl(T("stinger.logo", "") || T("logo", ""));
    $("stMark").innerHTML = logo ? `<img src="${logo}" alt="">` : (st.dir === "take" ? "" : `<b>${esc(st.dir === "toLive" ? "Live" : "Replay")}</b>`);
    box.style.setProperty("--dur", dur + "ms");
    box.classList.remove("run"); void box.offsetWidth; box.classList.add("run");
    setTimeout(() => { box.classList.remove("run"); stingerRunning = false; }, dur + 50);
  }

  // ---------------------------------------------------------------- connection
  function relayUrl() {
    const q = Q.get("relay");
    if (q) return q;
    if (location.protocol === "http:" || location.protocol === "https:") return (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
    return "ws://127.0.0.1:8765";
  }
  function connect() {
    const token = Q.get("token");
    if (!token) { $("setup").classList.remove("hide"); return; }
    let url;
    try { url = new URL(relayUrl().replace(/\/+$/, "") + "/view"); } catch (e) { return; }
    url.searchParams.set("token", token);
    const sock = new WebSocket(url.href);
    sock.onopen = () => sock.send(JSON.stringify({ type: "resend" }));
    sock.onclose = ev => {
      if (ev.code === 4001) { $("setup").classList.remove("hide"); $("setup").textContent = "The relay refused this overlay's token."; return; }
      setTimeout(connect, ev.code === 4002 ? 200 : 3000);
    };
    sock.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      try { handle(m); } catch (e) { console.error("overlay: could not render " + m.type, e); }
    };
  }
  let dirty = true;
  function mapFits(m) {
    const t = S.session && S.session.track;
    if (!t || m.trackId == null) return true;
    return String(m.trackId) === String(t.TrackID) && (m.config || "default") === (t.TrackConfigName || "default");
  }
  function handle(m) {
    switch (m.type) {
      // another track: the old outline goes (the relay may still hold the last session's map); a map only
      // for this session's track is drawn (the same rule as PitWall's mapMatchesSession)
      case "session": S.session = m; if (S.map && !mapFits(S.map)) S.map = null; break;
      case "map": if (mapFits(m)) S.map = m; break;
      case "state": if (!m.full && !S.state) return; S.state = m.full ? m : merge(S.state, m); break;
      case "cars": if (!m.full && !S.cars) return; S.cars = m.full ? m : merge(S.cars, m); trackMotion(); break;
      case "feed": handleFeed(m); break;
      case "gfx": {
        const st = m.state || {};
        S.gfx = PREVIEW && st.studio && st.studio.pv ? staged(JSON.parse(JSON.stringify(st)), st.studio.pv) : st;
        applyTheme(); if (!MONITOR) maybeStinger(); break;
      }
      case "assets": S.assets = m.files || []; break;
      case "director": S.director = m; document.body.classList.toggle("bc-off", !m.live && !PREVIEW); if (!MONITOR) directorStinger(m); break;
      case "livery": {
        if (!m.image) break;
        const car = m.car || String(m.key || "").split(":")[0], kind = m.kind || "photo";
        S.liveries[car] = Object.assign({}, S.liveries[car], { [kind]: m.image });
        break;
      }
      default: return;
    }
    dirty = true;
  }
  // ---------------------------------------------------------------- Arcade: the big moments, full screen
  // The Arcade look calls the race's real moments like an arcade racer (gfx arcade.callouts, on by default): a pass
  // for position ("OVERTAKE!", "FOR THE LEAD!": normalize's pass events), a fastest lap (fastest_lap events), and the
  // flags the flag calls make (the green with five lights going out, the final lap, the winner, a caution). One call at
  // a time from a short queue; chrome letters drive in, brake, hold and whip off, speed lines, confetti and checkered
  // flags on one canvas (axFx) that only runs while something moves. Never with the broadcast off, in Preview or in
  // Arrange; Still (theme.motion off) has none of it. Names and times are the feed's; a lap time counts up to itself.
  const AX = { q: [], cur: null, end: 0, last: {}, parts: [], raf: 0, mood: null, swap: {}, streak: {}, hot: {}, hotAt: 0 };
  const axOn = () => document.documentElement.dataset.look === "arcade" && moving() && !PREVIEW && !EDIT &&
    !document.body.classList.contains("bc-off") && G("arcade.callouts", true) !== false;
  const AX_FIRST = new Set(["green", "final", "winner", "caution"]);   // the race's own state goes ahead of the queue
  function axCall(kind, title, sub, opts) {
    if (!axOn()) return;
    const it = { kind, title, sub: sub || "", opts: opts || {}, at: performance.now() };
    if (AX_FIRST.has(kind)) AX.q.unshift(it); else AX.q.push(it);
    if (AX.q.length > 3) AX.q.length = 3;
  }
  function axTick(now) {
    const box = $("axCall");
    if (AX.cur && now > AX.end) { AX.cur = null; box.className = ""; box.innerHTML = ""; }
    if (AX.cur || !AX.q.length) return;
    const it = AX.q.shift();
    if (now - it.at > 8000 || !axOn()) return;        // too late to call it now
    AX.cur = it; AX.end = now + (it.opts.ms || 2700);
    box.innerHTML = `<div class="ax-band"></div><div class="ax-t" data-t="${esc(it.title)}">${esc(it.title)}</div>` +
      (it.sub ? `<div class="ax-s">${it.sub}</div>` : "");
    box.className = ""; void box.offsetWidth; box.className = "ax-" + it.kind + " run";
    box.style.setProperty("--ax-ms", (it.opts.ms || 2700) + "ms");
    if (it.opts.c) box.style.setProperty("--ax-c", it.opts.c); else box.style.removeProperty("--ax-c");
    for (const el of box.querySelectorAll("[data-roll]")) axRoll(el, 300);
    if (it.opts.say) bcSay(it.opts.say, 0.15);
    for (const f of [].concat(it.opts.fx || [])) axFx(f, it.opts);
  }
  // a lap time counts up to itself like a score (the value it ends on is the feed's)
  function axRoll(el, delay) {
    if (!el || !axOn()) return;
    const txt = el.textContent, m = /^(?:(\d+):)?(\d+)\.(\d{3})$/.exec(txt.trim());
    if (!m) return;
    const v = (+m[1] || 0) * 60 + +m[2] + +m[3] / 1000, t0 = performance.now() + (delay || 0), D = 650;
    const step = now => {
      if (!el.isConnected || (el._axShown != null && el.textContent !== el._axShown)) return;    // written anew meanwhile
      const k = Math.max(0, Math.min(1, (now - t0) / D)), e = 1 - Math.pow(1 - k, 3);
      el.textContent = k < 1 ? fmt.lap(Math.max(0.001, v * e)) : txt; el._axShown = el.textContent;
      if (k < 1) requestAnimationFrame(step); else el._axShown = null;
    };
    el._axShown = null; requestAnimationFrame(step);
  }
  // the canvas: speed lines, confetti, checkered flags; drawn only while something is on it
  function axFx(kind, opts) {
    const now = performance.now(), P = AX.parts, cols = [].concat(opts.colors || []).filter(Boolean);
    const pal = cols.length ? cols : [T("colors.accent", "#ffd400"), "#ffffff", "#19d9ff", "#ff3b6b"];
    if (kind === "lines") for (let i = 0; i < 46; i++) P.push({ k: "l", t0: now + Math.random() * 500, life: 700 + Math.random() * 500,
      y: 330 + Math.random() * 420, len: 260 + Math.random() * 520, w: 2 + Math.random() * 5, v: 3.2 + Math.random() * 2.6, c: Math.random() < .25 ? pal[0] : "#ffffff" });
    if (kind === "confetti") for (let i = 0; i < 220; i++) P.push({ k: "c", t0: now + Math.random() * 1400, life: 4200 + Math.random() * 1800,
      x: Math.random() * 1920, y: -40 - Math.random() * 300, vx: (Math.random() - .5) * .18, vy: .22 + Math.random() * .3, r: Math.random() * 6.28,
      vr: (Math.random() - .5) * .012, w: 10 + Math.random() * 10, h: 5 + Math.random() * 6, c: pal[i % pal.length] });
    if (kind === "flags") for (const side of [0, 1]) P.push({ k: "f", t0: now, life: opts.ms || 4500, side });
    if (kind === "lights") { const L = $("axLights"); L.classList.remove("run"); void L.offsetWidth; L.classList.add("run"); }
    if (!AX.raf && P.length) AX.raf = requestAnimationFrame(axDraw);
  }
  function axDraw(now) {
    const cv = $("axFx"), g = cv.getContext("2d"), P = AX.parts;
    g.clearRect(0, 0, 1920, 1080);
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i], a = now - p.t0;
      if (a > p.life) { P.splice(i, 1); continue; }
      if (a < 0) continue;
      const k = a / p.life;
      if (p.k === "l") {
        const x = 1920 + 200 - a * p.v * 1.2;
        g.globalAlpha = Math.sin(k * Math.PI) * .75;
        const gr = g.createLinearGradient(x, 0, x + p.len, 0); gr.addColorStop(0, p.c); gr.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = gr; g.fillRect(x, p.y, p.len, p.w);
      } else if (p.k === "c") {
        const x = p.x + p.vx * a + Math.sin(a / 300 + p.r) * 30, y = p.y + p.vy * a;
        g.globalAlpha = k > .8 ? (1 - k) / .2 : 1;
        g.save(); g.translate(x, y); g.rotate(p.r + p.vr * a); g.scale(1, Math.abs(Math.cos(a / 180 + p.r)) + .15);
        g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
      } else if (p.k === "f") {
        // a checkered flag waving in from its side, then away
        const inK = Math.min(1, a / 450), outK = Math.max(0, (a - (p.life - 500)) / 500), dir = p.side ? -1 : 1;
        const W = 480, H = 320, n = 12, m = 8, y0 = 140, show = (inK - outK) * (W + 60);
        const pole = p.side ? 1920 + W - show : -W + show;      // the pole's x, the cloth goes inwards from it
        g.globalAlpha = 1;
        for (let cx = 0; cx < n; cx++) for (let cy = 0; cy < m; cy++) {
          const u0 = cx / n, u1 = (cx + 1) / n, w0 = Math.sin(u0 * 6 - a / 120) * 24 * u0, w1 = Math.sin(u1 * 6 - a / 120) * 24 * u1;
          const xa = pole + dir * u0 * W, xb = pole + dir * u1 * W, ya = y0 + cy * H / m + w0, yb = y0 + cy * H / m + w1;
          g.fillStyle = (cx + cy) % 2 ? "#0b0d12" : "#f5f5f5";
          g.beginPath(); g.moveTo(xa, ya); g.lineTo(xb, yb); g.lineTo(xb, yb + H / m + .6); g.lineTo(xa, ya + H / m + .6); g.closePath(); g.fill();
        }
        g.fillStyle = "#c9ced8"; g.fillRect(pole - 4, y0 - 20, 8, H + 160);
      }
    }
    g.globalAlpha = 1;
    AX.raf = P.length ? requestAnimationFrame(axDraw) : 0;
    if (!P.length) g.clearRect(0, 0, 1920, 1080);
  }
  // the feed's events, as they come (not the ones a page sees on load or after a reconnect)
  function axEvent(e) {
    if (!axOn() || !e) return;
    const tNow = S.cars && S.cars.t;
    if (e.t != null && tNow != null && Math.abs(tNow - e.t) > 20) return;
    const now = performance.now(), m = multi(), who = i => { const c = carByIdx(i); return c ? nameHtml(c.name, "last") : ""; };
    if (e.kind === "pass" && isRace() && sessState() === "racing") {
      const c = carByIdx(e.idx), lead = e.classPos === 1;
      if (!c || e.classPos > G("arcade.passTop", 10)) return;
      if (now - (AX.last.pass || -1e9) < (lead ? 4000 : 10000)) return;
      AX.last.pass = now;
      const cls = m && c.className ? c.className + " " : "";
      axCall(lead ? "lead" : "pass", lead ? (m && c.className ? `For the ${c.className} lead!` : "For the lead!") : "Overtake!",
        `${plate(c)}${who(e.idx)} <small>passes</small> ${who((e.passedIdx || [])[0])} <small>for</small> ${esc(cls)}P${esc(e.classPos)}`,
        { say: lead ? "lead" : "overtake", fx: "lines", c: m ? css(c.classColor) : null });
    } else if (e.kind === "fastest_lap" && (e.overall || m)) {
      const c = carByIdx(e.idx), k = "fl" + (e.classId ?? "");
      if (!c || now - (AX.last[k] || -1e9) < 15000) return;
      AX.last[k] = now;
      axCall("fl", "Fastest lap!", `${plate(c)}${who(e.idx)} <b data-roll>${fmt.lap(e.lapS)}</b>${m && c.className && !e.overall ? ` <small>${esc(c.className)}</small>` : ""}`,
        { fx: "lines", c: "var(--fl)" });
    }
  }
  // the race's mood on the edges: the kerbs run faster on the final lap, yellow and slow under a caution
  function axMood() {
    const f = racingFlag(), mood = document.documentElement.dataset.look !== "arcade" ? "" :
      f === "caution" || f === "yellow" || f === "red" ? "caution" : f === "white" ? "final" : f === "checkered" ? "done" : "green";
    if (mood !== AX.mood) { AX.mood = mood; if (mood) document.documentElement.dataset.ax = mood; else delete document.documentElement.dataset.ax; }
  }
  // cars on a run (two passes or more in the last 150 s of the feed): the tower's "on fire"
  function axHot() {
    const now = performance.now();
    if (now - AX.hotAt < 1000) return AX.hot;
    AX.hotAt = now; const tNow = S.cars && S.cars.t, n = {};
    if (tNow != null && isRace()) for (const e of S.feed.events) if (e.kind === "pass" && e.t != null && tNow - e.t <= 150 && tNow >= e.t) n[e.idx] = (n[e.idx] || 0) + 1;
    AX.hot = n; return n;
  }
  let last = 0, fitAll = 0;
  // Every graphic is drawn on its own: one that throws on some state of the race must never take the
  // others off air, and the frame loop must never stop (it did: an error left OBS showing nothing until reloaded).
  const RENDERS = [ctxTick, renderGrid, renderTower, renderBanner, renderBattle, renderCard, renderGridWalk, renderGBoard,
    renderBoard, renderFlagCall, renderPitStop, renderClosing, renderPace, renderStrategy, renderLapChart, renderFaster,
    renderTraffic, renderFastLap, renderPenalty, renderH2H, renderOnboard, renderScene, renderPodium, renderStrap,
    renderSponsor, renderTyres, renderTrap, renderQlap, renderStrip, renderLeague, renderPip];
  const failed = {};
  function safely(fn, ...a) {
    try { fn(...a); }
    catch (e) {                      // said once per graphic and message, in the console (OBS: Interact, or remote debugging)
      const k = fn.name + ": " + (e && e.message);

    }

  function frame(t) {
    requestAnimationFrame(frame);

      dirty = false; last = t;
      for (const r of RENDERS) safely(r);

      safely(fitWords, t - fitAll > 1000 && (fitAll = t));
    }
    safely(drawMap); safely(drawFaster, t); safely(axTick, t);
    safely(pumpTicker);
  }
  applyTheme();
  fitObs.observe($("stage"), { childList: true, subtree: true, characterData: true });
  if (document.fonts) document.fonts.addEventListener("loadingdone", () => { fitForce = true; dirty = true; });
  requestAnimationFrame(frame);
  setInterval(() => { dirty = true; }, 1000);
  connect();
})();
</script>
