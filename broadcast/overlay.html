<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broadcast Overlay</title>
<!--
  PitWall broadcast overlay. OBS Browser Source, 1920 x 1080, above the iRacing capture:

      http://<relay>/broadcast/overlay.html?token=<view token>
      file:///.../broadcast/overlay.html?relay=ws://127.0.0.1:8765&token=<view token>

  &only=<graphic> shows just one graphic (tower, banner, battle, card, map, ticker,
  board, grid, replay, stinger) so each can be its own OBS source.

  Everything shown and how it looks (colours, fonts, logos, text, position and
  size of every graphic, the transition stinger) is set from the producer panel
  and arrives as the relay's shared "gfx" state. Numbers come from iRacing
  through pitwall/normalize.py; computed ones (live gaps, predicted incidents)
  are computed there too, never here. On air they are not marked -- the
  producer panel marks them for the people running the show.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#111317; --ink2:#16191f; --head:#000; --headText:#fff; --text:#fff; --muted:#9aa3ae;
  --accent:#ffcc00; --accentText:#000; --line:rgba(255,255,255,.07); --fl:#a766ff;
  --gain:#2fd27a; --lose:#ff4d4d;
  --flag-green:#22c55e; --flag-yellow:#ffd23f; --flag-red:#e5383b; --flag-white:#f4f4f4; --flag-blue:#3a86ff;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Segoe UI",sans-serif;
  --caps:uppercase; --r:0px; --rowH:34px;
}
html,body{margin:0;background:transparent;overflow:hidden}
body{font-family:var(--body);color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.layer{position:absolute;opacity:0;pointer-events:none;transition:opacity .35s ease}
.layer.on{opacity:1}
.inner{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.hide{display:none!important}
.tab{font-variant-numeric:tabular-nums}
.plate{display:inline-grid;place-items:center;min-width:38px;height:24px;padding:0 4px;font:700 17px/1 var(--display);border-radius:var(--r);box-sizing:border-box}
.logo{max-height:30px;max-width:130px;object-fit:contain;display:block}

/* ---------- tower ---------- */
#tower{left:36px;top:36px;width:380px}
.tw-head{background:var(--head);color:var(--headText);display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r) var(--r) 0 0}
.tw-head .ttl{font:700 22px/1 var(--display);text-transform:var(--caps);letter-spacing:.02em}
.tw-head .st{margin-left:auto;font:700 22px/1 var(--display);text-transform:var(--caps);font-variant-numeric:tabular-nums}
.tw-head .st small{font-weight:600;color:var(--muted);font-size:16px;margin-right:4px}
.tw-flag{height:5px;background:var(--muted)}
.tw-body{position:relative;background:var(--ink)}
.row{position:absolute;left:0;right:0;height:var(--rowH);display:flex;align-items:center;gap:8px;padding-right:10px;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),background .3s;box-sizing:border-box;border-top:1px solid var(--line)}
.row.alt{background:var(--ink2)}
.row .pos{width:34px;text-align:center;font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
.row .nm{flex:1;min-width:0;font:600 20px/1 var(--display);text-transform:var(--caps);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--muted);font-weight:500;margin-right:3px}
.row .val{min-width:74px;text-align:right;font:600 18px/1 var(--display);font-variant-numeric:tabular-nums}
.row .tag{font:700 12px/1 var(--body);padding:3px 5px 2px;background:var(--muted);color:var(--ink);border-radius:var(--r)}
.row .fl{width:8px;height:8px;border-radius:50%;background:var(--fl);flex:none}
.row .mv{width:10px;font:700 10px/1 var(--body);text-align:center;flex:none}
.row .mv.up{color:var(--gain)} .row .mv.dn{color:var(--lose)}
.row.cam{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 35%,transparent),transparent 75%)}
.row.cam .pos{background:var(--accent);color:var(--accentText);align-self:stretch;display:grid;place-items:center}
.row.sec{background:transparent;border:0;gap:8px;padding-left:10px}
.row.sec .cls{font:800 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px 3px;border-radius:var(--r)}
.row.sec .rule{flex:1;height:2px;opacity:.6}
.row.sep{border:0}
.row.sep{background:var(--ink)}
.row.sep::after{content:"";margin:0 auto;width:36px;height:2px;border-radius:1px;background:var(--muted);opacity:.5}
.tw-foot{height:6px;background:var(--head);border-radius:0 0 var(--r) var(--r)}

/* ---------- status banner ---------- */
#banner{right:36px;top:36px}
.bn{display:flex;align-items:stretch;height:56px;border-radius:var(--r);overflow:hidden}
.bn .flag{width:12px;background:var(--muted)}
.bn .main{background:var(--head);color:var(--headText);padding:0 18px;display:flex;flex-direction:column;justify-content:center;min-width:170px}
.bn .main b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums;text-transform:var(--caps)}
.bn .main span{font:600 14px/1.2 var(--body);color:var(--muted);text-transform:var(--caps);letter-spacing:.04em}
.bn .trk{background:var(--ink);padding:0 16px;display:flex;flex-direction:column;justify-content:center}
.bn .trk b{font:700 20px/1 var(--display);text-transform:var(--caps)}
.bn .trk span{font:500 14px/1.2 var(--body);color:var(--muted)}
.bn .lg{background:var(--ink);display:grid;place-items:center;padding:0 12px}

/* ---------- replay bug ---------- */
#replay{right:36px;top:104px}
.rp{display:flex;align-items:stretch;border-radius:var(--r);overflow:hidden;animation:rpIn .4s ease both}
.rp b{background:var(--lose);color:#fff;font:800 22px/1 var(--display);letter-spacing:.08em;padding:9px 14px 8px;text-transform:uppercase}
.rp span{background:var(--head);color:var(--headText);font:600 16px/1 var(--body);padding:11px 14px 8px;text-transform:var(--caps)}
@keyframes rpIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ---------- battle ---------- */
#battle{left:50%;top:36px;width:760px;margin-left:-380px}
.bt{border-radius:var(--r);overflow:hidden}
.bt-head{background:var(--accent);color:var(--accentText);font:800 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 14px 6px;display:flex}
.bt-head span:last-child{margin-left:auto;font-weight:600}
.bt-cars{display:flex;align-items:stretch;background:var(--ink)}
.bt-car{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;min-width:0}
.bt-car .pos{font:800 26px/1 var(--display)}
.bt-car .nm{flex:1;min-width:0;font:700 24px/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-car .lv{width:96px;height:44px;flex:none;border-radius:var(--r);overflow:hidden;background:var(--ink2)}
.bt-gap{background:var(--head);color:var(--headText);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;min-width:90px}
.bt-gap b{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.bt-gap span{font:600 12px/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.bt-foot{background:var(--ink2);color:var(--muted);font:600 15px/1 var(--body);padding:7px 14px}
.bt-foot .g{color:var(--gain)} .bt-foot .l{color:var(--lose)}

/* ---------- where they're faster ---------- */
#faster{right:36px;top:164px;width:860px}
.fs{display:flex;background:var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.fs-map{width:400px;height:400px;flex:none;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.06),transparent 70%),var(--ink2)}
.fs-r{flex:1;display:flex;flex-direction:column;min-width:0}
.fs-h{background:var(--accent);color:var(--accentText);font:800 20px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:9px 16px 8px}
.fs-car{display:flex;align-items:center;gap:12px;padding:10px 16px 0}
.fs-car .sw{width:10px;align-self:stretch;border-radius:3px;flex:none}
.fs-car .nm{flex:1;min-width:0;font:700 30px/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-car .tm{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.fs-big{padding:10px 16px 2px;font:800 48px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.fs-big small{display:block;font:600 16px/1.2 var(--body);color:var(--muted);letter-spacing:.02em;margin-top:6px}
.fs-bars{display:flex;gap:3px;height:72px;margin:8px 16px 4px;position:relative}
.fs-bars:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.fs-bars i{flex:1;border-radius:2px;transform:scaleY(0);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#faster.on .fs-bars i{transform:scaleY(1)}
.fs-foot{margin-top:auto;padding:6px 16px 12px;font:600 15px/1.3 var(--body);color:var(--muted)}
.fs-foot b{color:var(--text)}

/* ---------- driver card ---------- */
#card{left:460px;bottom:54px;width:900px}
.cd{display:flex;align-items:stretch;border-radius:var(--r);overflow:hidden;height:118px}
.cd .lv{width:220px;flex:none;background:var(--ink2);position:relative;overflow:hidden}
.cd .num{width:96px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd .num b{font:800 54px/.9 var(--display)}
.cd .num span{font:700 14px/1 var(--body);margin-top:6px;opacity:.85}
.cd .main{flex:1;background:var(--ink);min-width:0;display:flex;flex-direction:column}
.cd .top{display:flex;align-items:baseline;gap:12px;padding:12px 16px 4px}
.cd .name{font:700 38px/.95 var(--display);text-transform:var(--caps);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .name small{font-weight:500;color:var(--muted)}
.cd .lic{margin-left:auto;display:flex;gap:6px;flex:none}
.cd .lic span{font:700 13px/1 var(--body);padding:4px 7px 3px;border-radius:var(--r)}
.cd .sub{padding:0 16px 8px;color:var(--muted);font:600 15px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .stats{margin-top:auto;display:flex;background:var(--ink2)}
.cd .stats div{flex:1 1 auto;padding:6px 14px 7px;border-right:1px solid var(--line);white-space:nowrap}
.cd .stats div:last-child{border-right:0}
.cd .stats span{display:block;color:var(--muted);font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em}
.cd .stats b{display:block;font:700 21px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:3px}

.lv:empty{display:none}
.livery{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.livery.render{object-fit:contain;inset:4% 3%;width:94%;height:92%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}

/* ---------- map ---------- */
#map{right:36px;top:170px;width:360px;height:360px}
#map canvas{width:360px;height:360px;display:block}

/* ---------- race control ---------- */
#ticker{right:36px;bottom:54px;width:480px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tk{display:flex;align-items:stretch;background:var(--ink);width:100%;min-height:40px;border-radius:var(--r);overflow:hidden;animation:tkIn .45s cubic-bezier(.2,.8,.2,1) both}
.tk.out{animation:tkOut .4s ease both}
.tk i{width:84px;flex:none;display:grid;place-items:center;font:800 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;font-style:normal;background:var(--muted);color:var(--ink)}
.tk.k-fl i{background:var(--fl);color:#fff} .tk.k-lead i{background:var(--accent);color:var(--accentText)}
.tk.k-inc i{background:var(--lose);color:#fff} .tk.k-flag i{background:var(--flag-green);color:#000}
.tk.k-wx i{background:#59c2e8;color:#000}
.tk p{margin:0;padding:9px 12px 8px;font:600 17px/1.25 var(--body)}
.tk p b{font:700 19px/1 var(--display);text-transform:var(--caps);letter-spacing:.02em}
@keyframes tkIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes tkOut{to{opacity:0;transform:translateX(30px)}}

/* ---------- standings board / grid ---------- */
#board,#grid{left:50%;top:110px;width:1400px;margin-left:-700px}
.pn{border-radius:var(--r);overflow:hidden}
.pn-head{background:var(--head);color:var(--headText);display:flex;align-items:center;gap:16px;padding:14px 22px}
.pn-head b{font:800 40px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.pn-head span{margin-left:auto;font:600 17px/1.2 var(--body);color:var(--muted);text-align:right;text-transform:var(--caps)}
.pn-body{background:var(--ink);padding:10px 14px 14px}
.bd-cols{display:grid;gap:14px}
.bd-sec .cls{font:800 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px 5px;margin:8px 0 2px;border-radius:var(--r)}
.bd-row{display:flex;align-items:center;gap:10px;height:32px;border-top:1px solid var(--line);padding:0 6px}
.bd-row .pos{width:30px;text-align:center;font:700 20px/1 var(--display)}
.bd-row .nm{flex:1;min-width:0;font:600 19px/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-row .v{width:88px;text-align:right;font:600 17px/1 var(--display);font-variant-numeric:tabular-nums}
.bd-row .v.m{color:var(--muted)}
.bd-row .v.fl{color:#d9c2ff}
.bd-colhead{display:flex;gap:10px;color:var(--muted);font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.bd-colhead .sp{flex:1}.bd-colhead .c{width:88px;text-align:right}

.gd{display:grid;grid-template-columns:1fr 1fr;column-gap:30px;row-gap:10px}
.slot{display:flex;align-items:center;gap:12px;background:var(--ink2);border-radius:var(--r);height:68px;padding-right:14px;position:relative;overflow:hidden;transition:background .3s}
.slot:nth-child(even){transform:translateY(36px)}
.slot .p{width:56px;align-self:stretch;display:grid;place-items:center;font:800 34px/1 var(--display);background:var(--head);color:var(--headText)}
.slot .lv{width:130px;height:68px;flex:none;position:relative;overflow:hidden;background:var(--ink)}
.slot .who{flex:1;min-width:0}
.slot .who b{display:block;font:700 26px/1 var(--display);text-transform:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .who > span{display:block;color:var(--muted);font:600 14px/1.3 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.slot .who b .plate{margin-right:8px;vertical-align:2px}
small{margin-right:4px}
.slot .tm{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.slot .tm span{display:block;color:var(--muted);font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.slot.cam{background:color-mix(in srgb,var(--accent) 22%,var(--ink2));box-shadow:inset 0 0 0 3px var(--accent)}
.gd-foot{display:flex;justify-content:space-between;color:var(--muted);font:600 14px/1 var(--body);padding:48px 4px 0}

/* ---------- stinger ---------- */
#stinger{left:0;top:0;width:1920px;height:1080px;opacity:1;overflow:hidden}
#stinger .bar{position:absolute;top:-20%;height:140%;width:140%;left:-150%;transform:skewX(-18deg)}
#stinger .b1{background:var(--accent)} #stinger .b2{background:var(--head)}
#stinger .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0}
#stinger .mark img{max-width:520px;max-height:220px}
#stinger .mark b{font:800 96px/1 var(--display);color:var(--headText);text-transform:uppercase;letter-spacing:.06em}
#stinger.run .b1{animation:sw1 var(--dur,900ms) cubic-bezier(.7,0,.3,1) both}
#stinger.run .b2{animation:sw2 var(--dur,900ms) cubic-bezier(.7,0,.3,1) both}
#stinger.run .mark{animation:mk var(--dur,900ms) ease both}
@keyframes sw1{0%{left:-150%}45%{left:-20%}55%{left:-20%}100%{left:110%}}
@keyframes sw2{0%{left:-170%}10%{left:-170%}50%{left:-20%}60%{left:-20%}100%{left:120%}}
@keyframes mk{0%,35%{opacity:0;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1)}65%{opacity:1}80%,100%{opacity:0}}
#stinger video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

#setup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#111;color:#fff;padding:24px 28px;max-width:640px;font:500 20px/1.45 sans-serif}
@media (prefers-reduced-motion: reduce){.row,.layer,.tk,.inner{transition:none!important;animation:none!important}}
/* The broadcast's master switch is off (the producer panel's "Broadcast off"): nothing on air */
body.bc-off>*:not(script){visibility:hidden!important}
</style>
</head>
<body class="bc-off">
<div id="stage">
  <section class="layer" id="tower"><div class="inner">
    <div class="tw-head"><img class="logo hide" id="twLogo" alt=""><span class="ttl" id="twTitle">Race</span><span class="st" id="twState"></span></div>
    <div class="tw-flag" id="twFlag"></div>
    <div class="tw-body" id="twBody"></div>
    <div class="tw-foot"></div>
  </div></section>

  <section class="layer" id="banner"><div class="inner"><div class="bn">
    <div class="flag" id="bnFlag"></div>
    <div class="main"><b id="bnMain">–</b><span id="bnSub"></span></div>
    <div class="trk"><b id="bnTrack">–</b><span id="bnEvent"></span></div>
    <div class="lg hide" id="bnLogoBox"><img class="logo" id="bnLogo" alt=""></div>
  </div></div></section>

  <section class="layer" id="replay"><div class="inner"><div class="rp"><b>Replay</b><span id="rpLabel" class="hide"></span></div></div></section>

  <section class="layer" id="battle"><div class="inner"><div class="bt">
    <div class="bt-head"><span id="btTitle">Battle</span><span id="btLap"></span></div>
    <div class="bt-cars" id="btCars"></div>
    <div class="bt-foot" id="btFoot"></div>
  </div></div></section>

  <section class="layer" id="faster"><div class="inner"><div class="fs">
    <canvas class="fs-map" id="fsCv" width="800" height="800"></canvas>
    <div class="fs-r"><div class="fs-h">Where they're faster</div><div id="fsCars"></div><div class="fs-big" id="fsBig"></div>
    <div class="fs-bars" id="fsBars"></div><div class="fs-foot" id="fsFoot"></div></div>
  </div></div></section>

  <section class="layer" id="card"><div class="inner"><div class="cd">
    <div class="lv" id="cdLv"></div>
    <div class="num" id="cdNumBox"><b id="cdNum">–</b><span id="cdPos"></span></div>
    <div class="main">
      <div class="top"><div class="name" id="cdName">–</div><div class="lic" id="cdLic"></div></div>
      <div class="sub" id="cdSub"></div>
      <div class="stats" id="cdStats"></div>
    </div>
  </div></div></section>

  <section class="layer" id="map"><div class="inner"><canvas id="mapCv" width="720" height="720"></canvas></div></section>

  <section class="layer on" id="ticker"></section>

  <section class="layer" id="board"><div class="inner"><div class="pn">
    <div class="pn-head"><img class="logo hide" id="bdLogo" alt=""><b id="bdTitle">Standings</b><span id="bdSub"></span></div>
    <div class="pn-body"><div class="bd-cols" id="bdCols"></div></div>
  </div></div></section>

  <section class="layer" id="grid"><div class="inner"><div class="pn">
    <div class="pn-head"><img class="logo hide" id="gdLogo" alt=""><b id="gdTitle">Starting grid</b><span id="gdSub"></span></div>
    <div class="pn-body"><div class="gd" id="gdSlots"></div><div class="gd-foot"><span id="gdPage"></span><span id="gdNote"></span></div></div>
  </div></div></section>

  <section class="layer on" id="stinger"><div class="bar b1"></div><div class="bar b2"></div><div class="mark" id="stMark"></div></section>

  <div id="setup" class="hide">This overlay needs the relay's view token in its address: add <code>?token=…</code> (and <code>&amp;relay=ws://127.0.0.1:8765</code> when opened from a file).</div>
</div>

<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const ONLY = Q.get("only");
  const S = { session: null, map: null, state: null, cars: null, feed: { ready: false, seq: 0, events: [] },
              gfx: {}, assets: [], liveries: {}, motion: {} };
  const ASSET_BASE = (() => {
    const r = Q.get("relay");
    if (location.protocol.startsWith("http") && !r) return location.origin + "/broadcast/assets/";
    if (r) return r.replace(/^ws/, "http").replace(/\/+$/, "") + "/broadcast/assets/";
    return "http://127.0.0.1:8765/broadcast/assets/";
  })();
  const assetUrl = n => n ? ASSET_BASE + encodeURIComponent(n) : "";

  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080) || 1;
    $("stage").style.transform = `scale(${k})`;
  }
  addEventListener("resize", fit); fit();

  // ---------------------------------------------------------------- helpers

  // ---------------------------------------------------------------- map (60 fps)
  // Cars arrive 15 times a second; between messages each dot moves on at its
  // own recent speed, so the map runs smoothly. Purely a drawing aid.
  function trackMotion() {
    const now = performance.now();
    for (const c of allCars()) {
      if (c.pct == null || c.pct < 0 || c.lap == null) continue;
      const d = c.lap + c.pct, m = S.motion[c.idx];
      if (!m) { S.motion[c.idx] = { d, at: now, rate: 0 }; continue; }
      if (d === m.d) continue;
      const dt = (now - m.at) / 1000;
      const rate = dt > 0 && dt < 1.5 ? (d - m.d) / dt : 0;
      m.rate = rate >= 0 && rate < 0.2 ? (m.rate ? m.rate * 0.5 + rate * 0.5 : rate) : 0;
      m.d = d; m.at = now;
    }
  }

  // ---------------------------------------------------------------- race control
  const queue = [];
  const nm = i => { const c = carByIdx(i); return c ? `<b>${nameHtml(c.name)}</b>` : "Car " + esc(i); };
  // the same words as the producer panel's incident list
  const WHAT = { contact: "Contact", spin: "Spin", lost_speed: "Lost speed", off_track: "Off track", tow: "Left the track", damage: "Damage" };
  const seenContact = {};
  function tickerItem(e) {
    const m = multi(), c = carByIdx(e.idx), cls = m && c && c.className ? esc(c.className) + " " : "";
    switch (e.kind) {
      case "fastest_lap":
        if (!e.overall && !m) return null;
        return ["fl", "Fastest lap", `${nm(e.idx)} · ${e.overall ? "" : cls}fastest lap <b>${fmt.lap(e.lapS)}</b>`];
      case "class_lead": return ["lead", "Lead", `${nm(e.idx)} takes the ${m ? cls : ""}lead`];
      case "pit_in": return G("ticker.pits", true) && isRace() ? ["pit", "Pit", `${nm(e.idx)} pits`] : null;
      case "pit_out": return G("ticker.pits", true) && isRace() ? ["pit", "Pit", `${nm(e.idx)} rejoins` + (e.stationaryS != null ? ` after a ${e.stationaryS.toFixed(1)} s stop` : "")] : null;
      case "race_incident": {
        if (!G("ticker.incidents", true)) return null;
        const min = G("ticker.minIncident", "spin");
        const order = ["off_track", "lost_speed", "spin", "contact"];
        if (order.indexOf(e.what) < order.indexOf(min) && !(e.what === "tow" || e.what === "damage")) return null;
        if (e.what === "contact" && e.contactWith && e.contactWith.length) {   // each car reports the same contact: show it once
          const key = [e.idx, ...e.contactWith].sort((a, b) => a - b).join("-");
          if (seenContact[key] != null && Math.abs((e.t || 0) - seenContact[key]) < 5) return null;
          seenContact[key] = e.t || 0;
        }

      }

  function handleFeed(m) {

      S.feed = { ready: true, seq: m.seq || 0, events: (m.events || []).slice(-400) };

    for (const e of m.events || []) if (e.seq > S.feed.seq) { pushTick(e); S.feed.events.push(e); }

  }

  }
  function renderGrid() {
    const rows = (S.session && S.session.grid && S.session.grid.rows) || [];
    gridUp = (rows.length > 0 && gridWanted() && !!S.cars) || !!gridWalkCar();
    const on = allowed("grid") && rows.length > 0 && gridWanted() && !!S.cars && !gridWalkCar();
    $("grid").classList.toggle("on", on);
    if (!on) return;
    const t = S.session.track;
    $("gdTitle").textContent = T("text.gridTitle", "") || "Starting grid";
    $("gdSub").innerHTML = esc(T("text.event", "") || (t ? t.TrackDisplayName : "")) + (t && t.TrackConfigName ? "<br>" + esc(t.TrackConfigName) : "");
    const per = 10, pages = Math.ceil(rows.length / per), now = performance.now();
    const cam = camIdx(), ci = rows.findIndex(r => r.idx === cam);
    if (ci >= 0 && G("grid.followCamera", true)) gridPage = Math.floor(ci / per);
    else if (now - gridPageAt > 8000) { gridPage = (gridPage + 1) % pages; gridPageAt = now; }
    if (gridPage >= pages) gridPage = 0;
    const m = multi();
    $("gdSlots").innerHTML = rows.slice(gridPage * per, gridPage * per + per).map(r => {
      const c = carByIdx(r.idx); if (!c) return `<div class="slot"><span class="p">${r.pos}</span></div>`;
      return `<div class="slot${c.idx === cam ? " cam" : ""}"><span class="p">${r.pos}</span><div class="lv">${liveryHtml(c)}</div>` +
        `<div class="who"><b>${plate(c)} ${nameHtml(c.name)}</b><span>${esc([m && c.className ? c.className + (r.classPos ? " P" + r.classPos : "") : "", c.team && c.team !== c.name ? c.team : c.car].filter(Boolean).join(" · "))}</span></div>` +
        `<div class="tm">${r.timeS ? fmt.lap(r.timeS) : ""}<span>${r.timeS ? "Qualifying" : ""}</span></div></div>`;
    }).join("");
    $("gdPage").textContent = pages > 1 ? `Positions ${gridPage * per + 1}–${Math.min(rows.length, gridPage * per + per)} of ${rows.length}` : `${rows.length} starters`;
    $("gdNote").textContent = S.session.grid.source === "qualify_results" ? "Grid from qualifying" : "";
  }

  // ---------------------------------------------------------------- stinger
  // A transition that covers the cut to and from a replay. The producer fires
  // it, then sends the camera command at the cut point, so the jump happens
  // behind it. A video from the assets (webm with alpha) replaces the default.
  let stingerSeq = null, stingerRunning = false;
  function maybeStinger() {
    const st = S.gfx.stinger;
    if (!st || st.seq == null) return;
    if (stingerSeq === null) { stingerSeq = st.seq; return; }     // do not replay an old one on load
    if (st.seq === stingerSeq) return;
    stingerSeq = st.seq;
    if (!allowed("stinger")) return;
    if (st.at && Date.now() - st.at > 4000) return;              // stale: arrived after a reconnect
    const box = $("stinger");
    const vid = T("stinger.video", "");
    const dur = Number(T("stinger.durationMs", 900)) || 900;
    stingerRunning = true;
    box.querySelectorAll("video").forEach(v => v.remove());
    if (vid) {
      const v = document.createElement("video");
      v.src = assetUrl(vid); v.muted = !T("stinger.sound", false); v.autoplay = true; v.playsInline = true;
      v.onended = () => { v.remove(); stingerRunning = false; };
      v.onerror = () => { v.remove(); stingerRunning = false; };
      box.appendChild(v);
      setTimeout(() => { stingerRunning = false; }, 6000);
      return;
    }
    const logo = assetUrl(T("stinger.logo", "") || T("logo", ""));
    $("stMark").innerHTML = logo ? `<img src="${logo}" alt="">` : `<b>${esc(st.dir === "toLive" ? "Live" : "Replay")}</b>`;
    box.style.setProperty("--dur", dur + "ms");
    box.classList.remove("run"); void box.offsetWidth; box.classList.add("run");
    setTimeout(() => { box.classList.remove("run"); stingerRunning = false; }, dur + 50);
  }

  // ---------------------------------------------------------------- connection
  function relayUrl() {
    const q = Q.get("relay");
    if (q) return q;
    if (location.protocol === "http:" || location.protocol === "https:") return (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
    return "ws://127.0.0.1:8765";
  }
  function connect() {
    const token = Q.get("token");
    if (!token) { $("setup").classList.remove("hide"); return; }
    let url;
    try { url = new URL(relayUrl().replace(/\/+$/, "") + "/view"); } catch (e) { return; }
    url.searchParams.set("token", token);
    const sock = new WebSocket(url.href);
    sock.onopen = () => sock.send(JSON.stringify({ type: "resend" }));
    sock.onclose = ev => {
      if (ev.code === 4001) { $("setup").classList.remove("hide"); $("setup").textContent = "The relay refused this overlay's token."; return; }
      setTimeout(connect, ev.code === 4002 ? 200 : 3000);
    };
    sock.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      try { handle(m); } catch (e) { console.error("overlay: could not render " + m.type, e); }
    };
  }
  let dirty = true;
  function handle(m) {
    switch (m.type) {
      case "session": S.session = m; break;
      case "map": S.map = m; break;
      case "state": if (!m.full && !S.state) return; S.state = m.full ? m : merge(S.state, m); break;
      case "cars": if (!m.full && !S.cars) return; S.cars = m.full ? m : merge(S.cars, m); trackMotion(); break;
      case "feed": handleFeed(m); break;
      case "gfx": S.gfx = m.state || {}; applyTheme(); maybeStinger(); break;
      case "assets": S.assets = m.files || []; break;
      case "director": S.director = m; document.body.classList.toggle("bc-off", !m.live); break;
      case "livery": {
        if (!m.image) break;
        const car = m.car || String(m.key || "").split(":")[0], kind = m.kind || "photo";
        S.liveries[car] = Object.assign({}, S.liveries[car], { [kind]: m.image });
        break;
      }
      default: return;
    }
    dirty = true;
  }
  let last = 0;
  function frame(t) {
    if (dirty && t - last > 150) {
      dirty = false; last = t;
      renderGrid(); renderTower(); renderBanner(); renderBattle(); renderCard(); renderBoard(); renderFaster();
    }
    drawMap(); drawFaster(t);
    pumpTicker();
    requestAnimationFrame(frame);
  }
  applyTheme();
  requestAnimationFrame(frame);
  setInterval(() => { dirty = true; }, 1000);
  connect();
})();
</script>
</body>
</html>
